topic: t04
terms:
  - id: quorum
    term: Кворум
    definition: Мінімальна кількість голосів, за наявності якої загальні збори правомочні ухвалювати рішення.
    seeAlso: [cumulative-voting]
  - id: cumulative-voting
    term: Кумулятивне голосування
    definition: Спосіб обрання органу, за якого кількість голосів акціонера множать на кількість місць.
    synonyms: [кумулятивний голос]
