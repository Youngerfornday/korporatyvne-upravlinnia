topic: t01
terms:
  - id: corporation
    term: Корпорація
    definition: Юридична особа, капітал якої поділено на частки, а власність відокремлено від управління.
    synonyms: [корпоративне підприємство]
  - id: corporate-governance
    term: Корпоративне управління
    definition: |-
      Система відносин між власниками, радою і менеджментом, що визначає, як ухвалюють рішення в корпорації.

      Охоплює права акціонерів, звітність & контроль.
    seeAlso: [agency-problem]
  - id: agency-problem
    term: Агентська проблема
    definition: Конфлікт інтересів між власниками корпорації та найманими менеджерами, яким делеговано контроль.
    synonyms: [проблема «принципал — агент», принципал-агент]
    seeAlso: [corporate-governance, corporation]
