<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160" role="img" aria-labelledby="t d">
  <title id="t">Моделі корпоративного управління</title>
  <desc id="d">Чотири моделі: англо-американська, німецька, японська, сімейна.</desc>
  <rect x="0" y="0" width="480" height="160" fill="#FCFCFC"/>
  <g font-size="13" fill="#FFFFFF" text-anchor="middle">
    <rect x="10" y="50" width="105" height="60" rx="6" fill="#005B9F"/><text x="62" y="85">Англо-амер.</text>
    <rect x="130" y="50" width="105" height="60" rx="6" fill="#00305F"/><text x="182" y="85">Німецька</text>
    <rect x="250" y="50" width="105" height="60" rx="6" fill="#867EB4"/><text x="302" y="85">Японська</text>
    <rect x="370" y="50" width="100" height="60" rx="6" fill="#00796B"/><text x="420" y="85">Сімейна</text>
  </g>
</svg>
