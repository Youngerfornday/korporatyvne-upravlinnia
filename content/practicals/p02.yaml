# Практична 2 «Вибір форми бізнесу і корпоративний договір стартапу»: дані тренажера legal-form-choice.
# Мета, результати, ПРН, завдання й рубрика — у реєстрі course.yaml (practicals[p02]). Тут — зміст:
# ряд ЄДРПОУ для задачі на динаміку, критерії й правила конструктора форми, три стартапи, межі
# корпоративного договору та ризики стартапу під нього, тема есе.
# Норми — лише з docs/research/legal-baseline.md: код рядка стоїть у дужках у полі article, звідти ж дата
# перевірки. Числа ЄДРПОУ — з docs/research/data-sources.md, розділ 1.1; поділ на ПАТ і ПрАТ між таблицями
# до 2021 р. і з 2022 р. непорівнянний, тому в ряді лишено тільки загальну кількість АТ (суму рядків).
id: p02
title: Вибір форми бізнесу і корпоративний договір стартапу
intro: >-
  Форму бізнесу обирають не за звичкою, а за відповідями на п’ять питань: скільки засновників, як входить
  інвестор, як учасник виходить, скільки компанія готова розкривати і що саме реєструють — нову юридичну особу
  чи вже наявну. Конструктор нижче показує, які форми лишаються за вашими відповідями і яка норма закриває
  решту. Далі — задача на динаміку кількості товариств за ЄДРПОУ з перевіркою відповіді, три стартапи для
  письмового обґрунтування і межі, у яких працює корпоративний договір. Зарахування — за рубрикою практичної
  в реєстрі курсу; тренажер дає XP за кожен новий правильно розв’язаний варіант задачі.
status: review
updatedAt: '2026-09-17'

