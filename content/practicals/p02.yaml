trainer:
  kind: legal-form-choice

  # Норми конструктора. Код рядка legal-baseline стоїть у дужках у полі article — так само, як у lawRef лекцій,
  # тому `npm run lint:content` звіряє статтю й дату перевірки з базою.
  norms:
    - id: tov-uchasnyky
      code: TOV-01
      article: ст. 4 ч. 1 (TOV-01)
      law: Закон № 2275-VIII
      url: https://zakon.rada.gov.ua/laws/show/2275-19#n15
      checkedAt: '2026-09-15'
      summary: Кількість учасників товариства з обмеженою відповідальністю не обмежується.
    - id: tov-kapital
      code: TOV-03
      article: ст. 12 ч. 1–4; ст. 13; ст. 14 (TOV-03)
      law: Закон № 2275-VIII
      url: https://zakon.rada.gov.ua/laws/show/2275-19
      checkedAt: '2026-09-14'
      summary: >-
        Статутний капітал складається з номінальної вартості часток у гривнях; мінімального розміру закон не
        встановлює. Вклад вноситься повністю протягом шести місяців з державної реєстрації, якщо статут не
        встановлює інше; негрошовий вклад оцінюють одностайно всі учасники.
    - id: tov-dohovir
      code: TOV-04
      article: ст. 7 (TOV-04)
      law: Закон № 2275-VIII
      url: https://zakon.rada.gov.ua/laws/show/2275-19
      checkedAt: '2026-09-14'
      summary: >-
        Корпоративний договір укладають у письмовій формі, інакше він нікчемний; він може бути оплатним або
        безоплатним, а сторонами можуть бути також товариство і треті особи. Договір може передбачати умови
        купівлі-продажу частки, але нікчемний, якщо зобов’язує учасників голосувати за вказівками органів
        товариства. Зміст конфіденційний; договір за участю держави, громади чи юрособи з їхньою часткою від
        25 % оприлюднюють протягом десяти днів.
    - id: tov-perevazhne
      code: TOV-05
      article: ст. 20 (TOV-05)
      law: Закон № 2275-VIII
      url: https://zakon.rada.gov.ua/laws/show/2275-19
      checkedAt: '2026-09-14'
      summary: >-
        Учасник має переважне право купити частку, що продається третій особі, пропорційно своїй частці; якщо
        протягом 30 днів ніхто не заявив про намір, продавець вільний продати її на повідомлених умовах. Статут
        може змінити порядок або скасувати переважне право одностайним рішенням, і воно не застосовується, якщо
        так передбачає корпоративний договір.
    - id: tov-vykhid
      code: TOV-06
      article: ст. 24 ч. 1–8 (TOV-06)
      law: Закон № 2275-VIII
      url: https://zakon.rada.gov.ua/laws/show/2275-19#n137
      checkedAt: '2026-09-15'
      summary: >-
        Учасник з часткою менше 50 % виходить з товариства будь-коли без згоди інших; з часткою 50 % і більше —
        лише за згодою решти, якщо статут не дозволяє інакше. Вартість частки повідомляють протягом 30 днів і
        виплачують протягом року, якщо статут не встановлює інший строк.
    - id: tov-rishennia
      code: TOV-11
      article: ст. 33 ч. 3; ст. 34 ч. 2–5; ст. 35; ст. 36 ч. 2, 10 (TOV-11)
      law: Закон № 2275-VIII
      url: https://zakon.rada.gov.ua/laws/show/2275-19#n230
      checkedAt: '2026-09-15'
      summary: >-
        Кворуму як поняття закон для ТОВ не встановлює: більшість рахується від голосів усіх учасників. Зміни
        статуту, зміна розміру статутного капіталу й реорганізація потребують 3/4 голосів усіх учасників, а
        оцінка негрошового вкладу й перерозподіл часток — одностайності.
    - id: at-typy
      code: AT-01
      article: ст. 6 ч. 1–4; ст. 2 ч. 1 п. 26 (AT-01)
      law: Закон № 2465-IX
      url: https://zakon.rada.gov.ua/laws/show/2465-20
      checkedAt: '2026-09-14'
      summary: >-
        Акціонерні товариства бувають лише публічні й приватні, тип визначає статут. Публічне — те, щодо акцій
        якого була публічна пропозиція та/або акції допущені до торгів на організованому ринку капіталу;
        публічну пропозицію власних акцій робить лише публічне АТ. Публічне АТ створюється тільки зміною типу з
        приватного або перетворенням іншого господарського товариства.
    - id: at-odyn
      code: AT-02
      article: ст. 7; ст. 60 (AT-02)
      law: Закон № 2465-IX
      url: https://zakon.rada.gov.ua/laws/show/2465-20
      checkedAt: '2026-09-14'
      summary: >-
        Акціонерне товариство може мати одного акціонера: правила про скликання і проведення загальних зборів до
        нього не застосовуються, а свої рішення такий акціонер оформлює письмово.
    - id: at-kapital
      code: AT-06
      article: ст. 16 ч. 1 (AT-06)
      law: Закон № 2465-IX
      url: https://zakon.rada.gov.ua/laws/show/2465-20#n191
      checkedAt: '2026-09-15'
      summary: >-
        Мінімальний статутний капітал акціонерного товариства — 200 розмірів мінімальної заробітної плати,
        чинної на день створення; для товариства, створеного у 2026 році, це 1 729 400 грн.
    - id: at-aktsii
      code: AT-11
      article: ст. 22 ч. 1–4; ст. 24; ст. 25 ч. 5; ст. 26 (AT-11)
      law: Закон № 2465-IX
      url: https://zakon.rada.gov.ua/laws/show/2465-20
      checkedAt: '2026-09-14'
      summary: >-
        Усі акції іменні й існують лише в електронній формі; обмежувати кількість акцій чи голосів одного
        акціонера не можна. Публічне АТ зобов’язане пройти допуск акцій до торгів на регульованому ринку або в
        багатосторонній торговельній системі і залишатися хоча б на одному організованому ринку в Україні.
    - id: at-dohovir
      code: AT-14
      article: ст. 29 (AT-14)
      law: Закон № 2465-IX
      url: https://zakon.rada.gov.ua/laws/show/2465-20
      checkedAt: '2026-09-14'
      summary: >-
        Корпоративний договір акціонерів укладають письмово, інакше він нікчемний; сторонами можуть бути також
        саме товариство і треті особи, а нікчемним договір стає, якщо зобов’язує голосувати за вказівками
        органів управління. Зміст конфіденційний, але в публічному АТ сторона повідомляє товариство про
        укладення протягом трьох робочих днів, і товариство розкриває цей факт як особливу інформацію.
    - id: at-oferta
      code: AT-71
      article: ст. 93; ст. 94 (AT-71)
      law: Закон № 2465-IX
      url: https://zakon.rada.gov.ua/laws/show/2465-20#n1203
      checkedAt: '2026-09-15'
      summary: >-
        Хто набув контрольний пакет, повідомляє товариство і НКЦПФР, а потім надсилає всім акціонерам
        безвідкличну оферту за ціною не нижче ринкової вартості й найвищої ціни придбання за 12 місяців. Строк
        прийняття оферти — від 10 до 50 робочих днів, оплата — протягом 30 днів після його закінчення.
    - id: at-vykup
      code: AT-78
      article: ст. 102 ч. 1–3; ст. 103 ч. 1–2 (AT-78)
      law: Закон № 2465-IX
      url: https://zakon.rada.gov.ua/laws/show/2465-20
      checkedAt: '2026-09-14'
      summary: >-
        Вимагати обов’язкового викупу своїх простих акцій може лише той акціонер, який зареєструвався на
        загальних зборах і голосував проти рішення з переліку закону: злиття, приєднання, поділ, перетворення,
        виділ, зміна типу, значний правочин, правочин із заінтересованістю, зміна статутного капіталу, відмова
        від переважного права. Ціна — не нижче ринкової вартості.
    - id: rk-richna
      code: RK-09
      article: ст. 126 ч. 3–4 (RK-09)
      law: Закон № 3480-IV
      url: https://zakon.rada.gov.ua/laws/show/3480-15#n4289
      checkedAt: '2026-09-15'
      summary: >-
        Річна інформація емітента містить, зокрема, органи управління, аудитовану фінансову звітність, значні
        правочини і правочини із заінтересованістю, власників 5 % і більше акцій, звіт керівництва та
        корпоративні договори; її розкривають не пізніше 30 квітня і тримають на сайті не менше десяти років.
    - id: gk-zaborona
      code: GK-03
      article: ст. 13 ч. 1, 3 (GK-03)
      law: Закон № 4196-IX
      url: https://zakon.rada.gov.ua/laws/show/4196-20
      checkedAt: '2026-09-14'
      summary: >-
        Заборонено створювати юридичних осіб у формі державного, комунального, приватного, дочірнього,
        іноземного підприємства, підприємства об’єднання громадян і споживчої кооперації, а також закріплювати
        майно на праві господарського відання чи оперативного управління.
    - id: gk-perekhid
      code: GK-02
      article: ст. 1 (GK-02)
      law: Закон № 4196-IX
      url: https://zakon.rada.gov.ua/laws/show/4196-20
      checkedAt: '2026-09-14'
      summary: Перехідний період триває три роки з дня введення закону в дію, тобто з 28.08.2025 до 28.08.2028.
    - id: ubo-zminy
      code: UBO-03
      article: ст. 5-1 ч. 1, 3–5 (UBO-03)
      law: Закон № 361-IX
      url: https://zakon.rada.gov.ua/laws/show/361-20#n1458
      checkedAt: '2026-09-16'
      summary: >-
        Юридична особа підтримує відомості про кінцевого бенефіціарного власника і структуру власності в
        актуальному стані й повідомляє державного реєстратора про зміни протягом 30 робочих днів; учасник, який
        здійснює вирішальний вплив, повідомляє товариство про зміни протягом п’яти робочих днів, а виявлену
        неповноту чи помилку виправляють не пізніше трьох робочих днів з дня виявлення.

  forms:
    - id: tov
      title: Товариство з обмеженою відповідальністю
      short: ТОВ
      term: limited-liability-company
      registryKey: tov
      summary: >-
        Капітал поділено на частки, мінімального розміру закон не встановлює, органи — загальні збори учасників і
        виконавчий орган, наглядова рада за бажанням. Найгнучкіша форма для нового бізнесу: правила виходу,
        переважного права й порядку голосування можна змінити статутом або корпоративним договором.
      norms: [tov-uchasnyky, tov-kapital, tov-dohovir, tov-vykhid, tov-rishennia]
    - id: prat
      title: Приватне акціонерне товариство
      short: ПрАТ
      term: private-joint-stock-company
      summary: >-
        Капітал поділено на іменні електронні акції, мінімум — 200 розмірів мінімальної заробітної плати.
        Публічної пропозиції акцій не робить, зміст корпоративного договору лишається конфіденційним, а «вийти»
        акціонер може лише продажем акцій або обов’язковим викупом у випадках закону.
      norms: [at-typy, at-kapital, at-aktsii, at-dohovir, at-vykup]
    - id: pat
      title: Публічне акціонерне товариство
      short: ПАТ
      term: public-joint-stock-company
      summary: >-
        Єдина форма, яка робить публічну пропозицію власних акцій. Створюється не «з нуля», а зміною типу з
        приватного АТ або перетворенням іншого господарського товариства, зобов’язана тримати акції на
        організованому ринку і щороку розкривати регульовану інформацію.
      norms: [at-typy, at-aktsii, rk-richna]
    - id: pp
      title: Приватне підприємство
      short: ПП
      summary: >-
        Форма зі скасованого Господарського кодексу. Створювати нові приватні підприємства заборонено з
        28.08.2025; ті, що вже працюють, живуть у перехідному періоді до 28.08.2028. У завданні ця форма
        потрібна як контрприклад: її пропонують за звичкою, а закон її вже не дає.
      norms: [gk-zaborona, gk-perekhid]

  criteria:
    - id: founders
      title: Засновники
      question: Скільки людей входить у капітал на старті?
      options:
        - { id: one, label: Один власник }
        - { id: few, label: Двоє — п’ятеро засновників }
        - { id: many, label: Понад п’ятеро, з опціонами для команди }
    - id: investor
      title: Інвестор
      question: Як у компанію заходять гроші ззовні?
      options:
        - { id: none, label: Без зовнішнього інвестора }
        - { id: venture, label: Венчурний фонд входить у капітал }
        - { id: public, label: Публічна пропозиція цінних паперів }
    - id: exit
      title: Вихід учасника
      question: Як учасник або інвестор має виходити з компанії?
      options:
        - { id: free, label: Будь-коли, без згоди решти }
        - { id: by-consent, label: Лише за згодою решти }
        - { id: market, label: Продажем пакета на ринку }
    - id: disclosure
      title: Розкриття інформації
      question: Скільки компанія готова розкривати про себе?
      options:
        - { id: minimum, label: 'Мінімум: дані реєстру й бенефіціари' }
        - { id: regular, label: Щорічна регульована інформація }
    - id: setup
      title: Що реєструємо
      question: Створюєте нову юридичну особу чи переоформлюєте наявну?
      options:
        - { id: new-2026, label: Нову юридичну особу у 2026 році }
        - { id: existing-pp, label: Переоформлюємо наявне приватне підприємство }

  rules:
    # ТОВ
    - form: tov
      criterion: founders
      option: one
      effect: fits
      reason: Кількість учасників закон не обмежує знизу — товариство працює і з одним учасником.
      norm: tov-uchasnyky
    - form: tov
      criterion: founders
      option: few
      effect: fits
      reason: >-
        Кількість учасників не обмежена, а зміни статуту й розміру капіталу ухвалюють 3/4 голосів усіх учасників
        — трьом засновникам це дає зрозумілий поріг для домовленостей.
      norm: tov-rishennia
    - form: tov
      criterion: founders
      option: many
      effect: burden
      reason: >-
        Більшість рахується від голосів усіх учасників, а не присутніх, і кворуму закон не встановлює: що більше
        учасників, то важче зібрати 3/4 голосів для зміни статуту.
      norm: tov-rishennia
    - form: tov
      criterion: investor
      option: none
      effect: fits
      reason: >-
        Мінімального розміру статутного капіталу закон не встановлює, а вклад можна вносити протягом шести
        місяців з реєстрації — старт коштує найменше.
      norm: tov-kapital
    - form: tov
      criterion: investor
      option: venture
      effect: fits
      reason: >-
        Корпоративний договір може передбачити умови купівлі-продажу частки, а стороною договору може бути і сам
        фонд, і товариство — домовленості з інвестором оформлюються без зміни форми.
      norm: tov-dohovir
    - form: tov
      criterion: investor
      option: public
      effect: blocks
      reason: >-
        Капітал ТОВ складається з часток, а не з акцій, і публічну пропозицію власних акцій робить лише публічне
        акціонерне товариство.
      norm: at-typy
    - form: tov
      criterion: exit
      option: free
      effect: fits
      reason: Учасник з часткою менше 50 % виходить будь-коли й без згоди інших учасників.
      norm: tov-vykhid
    - form: tov
      criterion: exit
      option: by-consent
      effect: fits
      reason: >-
        Для частки 50 % і більше вихід можливий лише за згодою решти, і саме статут вирішує, чи послабити це
        правило — форма дає обидва режими.
      norm: tov-vykhid
    - form: tov
      criterion: exit
      option: market
      effect: burden
      reason: >-
        Продаж частки третій особі зв’язаний переважним правом інших учасників і 30 днями на заяву; зняти його
        можна лише одностайною зміною статуту або корпоративним договором.
      norm: tov-perevazhne
    - form: tov
      criterion: disclosure
      option: minimum
      effect: fits
      reason: >-
        Зміст корпоративного договору конфіденційний: оприлюднювати його треба лише за участі держави, громади
        чи юрособи з їхньою часткою від 25 %.
      norm: tov-dohovir
    - form: tov
      criterion: setup
      option: existing-pp
      effect: fits
      reason: >-
        Нові приватні підприємства створювати заборонено, тому наявне переоформлюють в іншу форму — товариство з
        обмеженою відповідальністю не потребує ані мінімального капіталу, ані емісії акцій.
      norm: gk-zaborona

    # ПрАТ
    - form: prat
      criterion: founders
      option: one
      effect: fits
      reason: >-
        Акціонерне товариство може мати одного акціонера: правила про скликання зборів до нього не
        застосовуються, рішення оформлюються письмово.
      norm: at-odyn
    - form: prat
      criterion: founders
      option: few
      effect: burden
      reason: >-
        Перш ніж ділити капітал між засновниками, його треба сформувати: мінімум для АТ — 200 розмірів
        мінімальної заробітної плати, тоді як для ТОВ мінімуму немає.
      norm: at-kapital
    - form: prat
      criterion: founders
      option: many
      effect: fits
      reason: >-
        Акції іменні й лише електронні, а обмежувати кількість акцій чи голосів одного акціонера не можна: облік
        багатьох власників веде депозитарна система, а не статут.
      norm: at-aktsii
    - form: prat
      criterion: investor
      option: none
      effect: burden
      reason: Без зовнішнього інвестора 200 розмірів мінімальної заробітної плати статутного капіталу — витрата без потреби.
      norm: at-kapital
    - form: prat
      criterion: investor
      option: venture
      effect: fits
      reason: >-
        Корпоративний договір акціонерів лишається конфіденційним: обов’язок повідомити товариство протягом
        трьох робочих днів і розкрити факт як особливу інформацію закон встановлює лише для публічного АТ.
      norm: at-dohovir
    - form: prat
      criterion: investor
      option: public
      effect: blocks
      reason: Публічну пропозицію власних акцій робить лише публічне АТ — приватному спершу треба змінити тип.
      norm: at-typy
    - form: prat
      criterion: exit
      option: free
      effect: blocks
      reason: >-
        Акціонер не «виходить» так, як учасник ТОВ: вимагати обов’язкового викупу акцій можна лише тоді, коли він
        зареєструвався на зборах і голосував проти рішення з переліку закону.
      norm: at-vykup
    - form: prat
      criterion: exit
      option: market
      effect: burden
      reason: >-
        Продаж контрольного пакета запускає обов’язкову оферту: набувач надсилає всім акціонерам безвідкличну
        оферту за ціною не нижче ринкової, а строк її прийняття — від 10 до 50 робочих днів.
      norm: at-oferta
    - form: prat
      criterion: disclosure
      option: minimum
      effect: fits
      reason: >-
        Зміст корпоративного договору конфіденційний, а особливу інформацію про його укладення розкриває лише
        публічне АТ.
      norm: at-dohovir

    # ПАТ
    - form: pat
      criterion: founders
      option: one
      effect: burden
      reason: >-
        Обов’язок пройти допуск акцій до торгів і залишатися хоча б на одному організованому ринку не залежить
        від кількості акціонерів — для одного власника це витрати без вигоди.
      norm: at-aktsii
    - form: pat
      criterion: founders
      option: few
      effect: burden
      reason: Мінімальний статутний капітал — 200 розмірів мінімальної заробітної плати, і сформувати його треба до початку роботи.
      norm: at-kapital
    - form: pat
      criterion: founders
      option: many
      effect: fits
      reason: >-
        Іменні електронні акції без обмежень на кількість акцій і голосів одного акціонера розраховані саме на
        велике коло власників.
      norm: at-aktsii
    - form: pat
      criterion: investor
      option: none
      effect: burden
      reason: >-
        Публічне АТ зобов’язане тримати акції на організованому ринку навіть тоді, коли зовнішніх інвесторів у
        нього немає.
      norm: at-aktsii
    - form: pat
      criterion: investor
      option: venture
      effect: burden
      reason: >-
        Сторона корпоративного договору повідомляє публічне АТ про його укладення протягом трьох робочих днів, і
        товариство розкриває цей факт як особливу інформацію — домовленості з фондом перестають бути приватними.
      norm: at-dohovir
    - form: pat
      criterion: investor
      option: public
      effect: fits
      reason: Публічну пропозицію власних акцій робить лише публічне АТ — інші форми такої можливості не мають.
      norm: at-typy
    - form: pat
      criterion: exit
      option: free
      effect: blocks
      reason: >-
        Права «вийти будь-коли» акціонер не має: обов’язковий викуп доступний лише тому, хто зареєструвався на
        зборах і голосував проти рішення з переліку закону.
      norm: at-vykup
    - form: pat
      criterion: exit
      option: market
      effect: fits
      reason: >-
        Акції публічного АТ допущені до торгів на регульованому ринку або в багатосторонній торговельній
        системі, тож пакет продають на ринку.
      norm: at-aktsii
    - form: pat
      criterion: disclosure
      option: minimum
      effect: blocks
      reason: >-
        Мінімумом обмежитися не вийде: емітент щороку до 30 квітня розкриває органи управління, аудитовану
        звітність, значні правочини, власників 5 % і більше акцій та корпоративні договори.
      norm: rk-richna
    - form: pat
      criterion: disclosure
      option: regular
      effect: fits
      reason: >-
        Річна регульована інформація — штатний режим емітента: перелік розділів і строк до 30 квітня встановлює
        закон, а не домовленість з інвестором.
      norm: rk-richna
    - form: pat
      criterion: setup
      option: new-2026
      effect: burden
      reason: >-
        Публічне АТ не реєструють «з нуля»: воно створюється лише зміною типу з приватного або перетворенням
        іншого господарського товариства, тож спершу потрібна інша форма.
      norm: at-typy
    - form: pat
      criterion: setup
      option: existing-pp
      effect: blocks
      reason: >-
        Приватне підприємство не є господарським товариством, тому перетворити його одразу на публічне АТ не
        можна: спершу — господарське товариство, потім зміна типу.
      norm: at-typy

    # Приватне підприємство
    - form: pp
      criterion: setup
      option: new-2026
      effect: blocks
      reason: Створювати нові юридичні особи у формі приватного підприємства заборонено з 28.08.2025.
      norm: gk-zaborona
    - form: pp
      criterion: setup
      option: existing-pp
      effect: burden
      reason: >-
        Наявне приватне підприємство працює, але перехідний період триває лише до 28.08.2028, тож рішення про
        форму все одно доведеться ухвалити.
      norm: gk-perekhid

  cases:
    - id: agro-saas
      title: AgroSaaS — троє засновників і венчурний фонд
      description: >-
        Три розробники запускають сервіс планування польових робіт. Венчурний фонд готовий увійти на 20 % за
        умови права вето на продаж бізнесу і можливості вийти через п’ять років. Засновники не хочуть публікувати
        домовленості й планують працювати без виходу на ринок капіталу.
      preset: { founders: few, investor: venture, exit: by-consent, disclosure: minimum, setup: new-2026 }
      answer: tov
      explanation: >-
        Лишається ТОВ: капітал не потребує мінімуму, домовленості з фондом оформлюються корпоративним договором,
        а його зміст конфіденційний. ПрАТ технічно можливе, але додає 200 розмірів мінімальної заробітної плати
        статутного капіталу й емісію акцій; ПАТ відпадає через обов’язкове розкриття, приватне підприємство — бо
        його заборонено створювати.
      norm: tov-dohovir
    - id: medtech-scale
      title: MedTech — вихід на регульований ринок
      description: >-
        Компанія з обладнанням для лікарень працює п’ятий рік, має понад двадцять співвласників і план залучити
        гроші публічною пропозицією акцій у 2027 році. Інвестори очікують щорічної регульованої звітності, а
        пакети мають вільно продаватися.
      preset: { founders: many, investor: public, exit: market, disclosure: regular, setup: new-2026 }
      answer: pat
      explanation: >-
        Публічну пропозицію робить лише ПАТ, і саме тому решта форм відпадає. Але ПАТ не реєструють «з нуля»:
        спершу створюють або перетворюють господарське товариство в приватне АТ, і вже потім змінюють тип — цей
        крок і треба описати в обґрунтуванні разом зі строками розкриття.
      norm: at-typy
    - id: rodynna-maisternia
      title: Родинна майстерня — переоформлення приватного підприємства
      description: >-
        Приватне підприємство з одним власником працює з 2019 року. Власник хоче ввести доньку як співвласницю,
        зберегти можливість вийти з бізнесу будь-коли і не розкривати нічого, крім обов’язкових даних реєстру.
      preset: { founders: one, investor: none, exit: free, disclosure: minimum, setup: existing-pp }
      answer: tov
      explanation: >-
        Приватне підприємство лишається чинним, але перехідний період спливає 28.08.2028, а нові такі юридичні
        особи створювати заборонено. ТОВ дає те, чого просить власник: вихід з часткою менше 50 % без згоди
        решти й мінімальне розкриття. Обидва акціонерні товариства відпадають, бо права «вийти будь-коли»
        акціонер не має.
      norm: gk-perekhid

  statistics:
    title: Кількість зареєстрованих юридичних осіб за організаційно-правовими формами, ЄДРПОУ
    note: >-
      Таблиці до 2021 року включно й з 2022 року мають різну структуру рядків: у старих є «публічне» і «приватне
      акціонерне товариство», у нових — «Відкрите» і «Закрите акціонерне товариство». Тому поділ АТ на типи між
      цими таблицями не порівнюють, а в ряді нижче лишено загальну кількість АТ — суму всіх акціонерних рядків.
      ЄДРПОУ рахує зареєстровані, а не діючі суб’єкти; дані наведено без тимчасово окупованої території АР Крим і
