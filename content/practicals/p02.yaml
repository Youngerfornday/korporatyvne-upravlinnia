  agreement:
    intro: >-
      Корпоративний договір — не «джентльменська угода», а правочин з жорсткими межами. За цими межами умова не
      «слабка», а нікчемна: вона не діє з самого початку, і суд не поновить її. Спершу перевірте задум на межах
      нижче, потім формулюйте умову під конкретний ризик.
    limits:
      - id: pysmova-forma
        title: Тільки письмово
        text: Договір, укладений не в письмовій формі, нікчемний. Це стосується і додаткових угод, якими змінюють його умови.
        norm: tov-dohovir
      - id: bez-vkazivok
        title: Не за вказівками органів товариства
        text: >-
          Умова, яка зобов’язує учасника голосувати згідно з вказівками органів товариства, робить договір
          нікчемним. Домовлятися про спільне голосування між собою учасники можуть, підпорядковувати голос
          директору — ні.
        norm: tov-dohovir
      - id: storony-i-predmet
        title: Сторони й предмет
        text: >-
          Сторонами можуть бути учасники, саме товариство і треті особи; договір буває оплатним і безоплатним, а
          умови купівлі-продажу частки — його прямо дозволений предмет.
        norm: tov-dohovir
      - id: perevazhne-pravo
        title: Переважне право можна вимкнути
        text: >-
          Переважне право інших учасників на купівлю частки не застосовується, якщо так передбачає корпоративний
          договір: без цієї умови продаж третій особі щоразу впирається у 30 днів очікування.
        norm: tov-perevazhne
      - id: konfidentsiinist
        title: Конфіденційність і її межі
        text: >-
          Зміст договору конфіденційний, але договір за участю держави, громади чи юрособи з їхньою часткою від
          25 % оприлюднюють протягом десяти днів. В акціонерному товаристві публічного типу сторона повідомляє
          товариство протягом трьох робочих днів, і воно розкриває факт укладення як особливу інформацію.
        norm: at-dohovir
    risks:
      - id: zasnovnyk-ide
        risk: Один із трьох засновників через півроку йде в інший проєкт, а його частка лишається за ним.
        mustSettle: >-
          За яких умов частка того, хто припинив працювати в компанії, викуповується рештою: подія-тригер, строк
          і порядок визначення ціни.
        consequence: >-
          Без умови діє загальне правило: учасник з часткою менше 50 % виходить будь-коли й без згоди решти, а
          вартість частки товариство має виплатити протягом року — це удар по обігових коштах стартапу.
        norm: tov-vykhid
      - id: prodazh-chastky
        risk: Мажоритарій знайшов покупця на всю компанію, а міноритарій продавати не хоче — або навпаки.
        mustSettle: >-
          Чи може мажоритарій вимагати, щоб міноритарій продав частку разом із ним (drag-along), і чи може
          міноритарій приєднатися до продажу на тих самих умовах (tag-along); як ці умови узгоджуються з
          переважним правом решти учасників.
        consequence: >-
          Без умови кожен продаж третій особі проходить через переважне право інших учасників і 30 днів
          очікування, а примусити партнера продати частку взагалі немає підстав.
        norm: tov-perevazhne
      - id: blokuvannia-rishen
        risk: Двоє засновників з рівними частками не можуть домовитися, і компанія не ухвалює жодного рішення.
        mustSettle: >-
          Порядок голосування за переліком питань, спосіб розв’язання патової ситуації й наслідки для того, хто
          проголосував усупереч домовленості.
        consequence: >-
          Без умови зміна статуту і розміру капіталу потребує 3/4 голосів усіх учасників, а кворуму закон не
          встановлює: рівні частки означають, що жодне таке рішення не пройде.
        norm: tov-rishennia
      - id: vykhid-investora
        risk: Фонд хоче вийти з проєкту через п’ять років, а засновники не мають грошей викупити його частку.
        mustSettle: >-
          Строк і спосіб виходу інвестора: право вимагати продажу компанії, право запропонувати частку третій
          особі, оплатність такого зобов’язання для сторін.
        consequence: >-
          Без умови інвестор має ті самі права, що й будь-який учасник, а домовленість «на словах» не є
          договором: письмова форма для корпоративного договору обов’язкова, інакше він нікчемний.
        norm: tov-dohovir
      - id: zmina-kbv
        risk: Після входу фонду через іноземну холдингову компанію змінюється кінцевий бенефіціарний власник.
        mustSettle: >-
          Обов’язок сторін надавати компанії дані про свою структуру власності й строки, у які вони це роблять
          після кожної зміни.
        consequence: >-
          Без умови компанія ризикує пропустити строки: про зміни відомостей вона повідомляє державного
          реєстратора протягом 30 робочих днів, а учасник з вирішальним впливом має повідомити її протягом п’яти
          робочих днів.
        norm: ubo-zminy

  essay:
    prompt: >-
      За шість років кількість товариств з обмеженою відповідальністю в ЄДРПОУ зросла на чверть, а кількість
      акціонерних товариств зменшилася. Спираючись на дані Держстату і норми Законів № 2275-VIII і № 2465-IX,
      поясніть, які саме правила роблять ТОВ дешевшою формою для нового бізнесу і в яких ситуаціях акціонерне
      товариство все одно потрібне.
    maxWords: 350
    expectations:
      - Числа з ЄДРПОУ наведено з датою, назвою таблиці й посиланням, а не «за різними оцінками».
      - Названо щонайменше три конкретні норми (стаття і закон), які здешевлюють ТОВ порівняно з АТ.
      - Названо щонайменше одну ситуацію, у якій без акціонерного товариства не обійтися, з нормою.
      - Згадано, що поділ АТ на типи між таблицями до 2021 року і з 2022 року порівнювати не можна.
    hints:
      - 'Мінімальний капітал: ст. 12 Закону № 2275-VIII проти ст. 16 ч. 1 Закону № 2465-IX.'
      - Вихід учасника (ст. 24 Закону № 2275-VIII) проти обов’язкового викупу акцій (ст. 102 Закону № 2465-IX).
      - Публічна пропозиція акцій і допуск до торгів (ст. 6 і ст. 26 Закону № 2465-IX) — те, чого ТОВ не дає.
      - Розкриття річної інформації емітента (ст. 126 Закону № 3480-IV) — ціна публічності.
