        - model: german
          statement: Банківський кредит і нерозподілений прибуток; фондовий ринок менший відносно розміру економіки.
          explanation: >-
            Банкоцентрична система, за Шляйфером і Вішні, фінансує компанії через кредит і довгострокові відносини з банком, а не через
            емісію акцій розпорошеним інвесторам.
