    - id: employees
      title: Роль працівників
      cells:
        - model: anglo-american
          statement: Працівники — стейкхолдери без місця в раді; вплив через ринок праці, опціонні програми й механізми залучення персоналу, які рекомендує кодекс.
          explanation: >-
            Кодекс Великої Британії рекомендує один із механізмів залучення працівників (директор від персоналу, консультативна рада або
