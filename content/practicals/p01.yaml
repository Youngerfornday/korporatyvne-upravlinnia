        - model: german
          statement: Співучасть за законом — у компаніях понад 2 000 працівників половина наглядової ради представляє працівників, від 500 до 2 000 — третина.
          explanation: >-
            Закон про співучасть 1976 р. (§ 1, § 7) встановлює паритет представників акціонерів і працівників у наглядовій раді компаній,
            що зазвичай мають понад 2 000 працівників; Закон про третинну участь 2004 р. — третину для компаній з понад 500 працівниками.
