        - model: japanese
          statement: Кредит головного банку і ресурси групи; ринок акцій великий за кількістю компаній, але акції значною мірою в перехресних пакетах.
          explanation: >-
            В Японії 3 904 лістингові компанії (табл. 1.1 Огляду ОЕСР 2023) — найбільше серед розвинених ринків, але 22 % капіталу належить
