trainer:
  kind: model-matrix
  models:
    - id: anglo-american
      title: Англо-американська модель
      short: Англо-американська
      term: anglo-american-model
      countries: [США, Велика Британія, Канада, Австралія]
      summary: >-
        Аутсайдерська система: розпорошена власність, інституційні інвестори як головні акціонери, однорівнева рада
        з більшістю незалежних директорів, глибокий ринок капіталу і активний ринок корпоративного контролю.
        Головний агентський конфлікт — між менеджментом і акціонерами.
      examples:
        - company: HSBC Holdings plc
          country: Велика Британія
          note: >-
            Рада з 15 директорів, з них 11 незалежних невиконавчих; голова ради і головний виконавчий директор — різні особи,
            як рекомендує Кодекс корпоративного управління Великої Британії.
          url: https://www.hsbc.com/who-we-are/leadership-and-governance/board-of-directors
          checkedAt: '2026-09-16'
        - company: Microsoft Corporation
          country: США
          note: >-
            Чотири постійні комітети ради складаються лише з незалежних директорів; власна настанова щодо незалежності директорів.
            Найбільші акціонери — інституційні інвестори.
          url: https://www.microsoft.com/en-us/investor/corporate-governance/board-of-directors
          checkedAt: '2026-09-16'
    - id: german
      title: Німецька (континентальна) модель
      short: Німецька
      term: german-model
      countries: [Німеччина, Австрія, Нідерланди]
      summary: >-
        Інсайдерська система: концентрована власність стратегічних власників, дворівнева рада з правління й наглядової
        ради, законодавчо закріплена співучасть працівників, банківське фінансування. Головний конфлікт — між контролюючим
        акціонером і міноритаріями, врівноважений інтересами праці.
      examples:
        - company: Volkswagen AG
          country: Німеччина
          note: >-
            Права голосу на 31.12.2025: Porsche Automobil Holding SE 53,3 %, земля Нижня Саксонія 20,0 %, Qatar Holding 17,0 %,
            вільний обіг 9,7 %. Правління і наглядова рада; за законом про співучасть половина наглядової ради — представники працівників.
          url: https://www.volkswagen-group.com/en/shareholder-structure-15951
          checkedAt: '2026-09-16'
    - id: japanese
      title: Японська модель
      short: Японська
      term: japanese-model
      countries: [Японія]
      summary: >-
        Інсайдерська система групового типу: перехресне володіння акціями всередині груп (кейрецу), історична роль головного
        банку, рада з інсайдерів, довгострокові відносини з працівниками й партнерами. З 2015 р. Кодекс корпоративного управління
        Японії штовхає компанії до незалежних директорів і розпродажу перехресних пакетів.
      examples:
        - company: Toyota Motor Corporation
          country: Японія
          note: >-
            Володіла 24,66 % акцій Toyota Industries — компанії-засновниці групи, яка сама є її акціонером (перехресне володіння);
            у 2025 р. збори перевели компанію до структури з аудиторсько-наглядовим комітетом (98,80 % голосів «за»).
          url: https://www.toyota-industries.com/news/item/20260417_document_e01.pdf
          checkedAt: '2026-09-16'
    - id: family
      title: Сімейна модель
      short: Сімейна
      term: family-model
      countries: [поширена в Азії, Латинській Америці, Південній Європі, Швейцарії; трапляється в Україні]
      summary: >-
        Контроль родини засновника через великий пакет, пул акціонерів або акції з різними правами голосу; рада з членів
        родини й довірених осіб; мета — збереження контролю і передавання компанії наступному поколінню. Головний конфлікт —
        між родиною і зовнішніми інвесторами.
      examples:
        - company: Roche Holding Ltd
          country: Швейцарія
          note: >-
            Пул нащадків засновника тримає понад 67 % голосів (після викупу пакета Novartis у 2021 р.), хоча більшість капіталу — це
            неголосуючі папери зовнішніх інвесторів; п’яте й шосте покоління родини — у пулі акціонерів (промова віцеголови ради на зборах 15.03.2022).
          url: https://assets.roche.com/f/176343/x/e3c69256dc/gv-2022_speech_ah_e_final_14marz_handout.pdf
          checkedAt: '2026-09-16'

  features:
    - id: ownership-structure
      title: Структура власності
      cells:
        - model: anglo-american
          statement: Розпорошена — три найбільші акціонери типової лістингової компанії разом тримають лише близько третини капіталу, контролюючого власника немає.
          explanation: >-
            За Оглядом ОЕСР 2023 р., найнижча концентрація власності — в Австралії, Фінляндії, Ірландії, США, Канаді та Великій Британії:
            три найбільші акціонери володіють у середньому 33–36 % капіталу. Саме така картина стоїть за працею Берлі й Мінза.
          source: oecd-factbook-2023
        - model: german
          statement: Концентрована — у більшості лістингових компаній три найбільші акціонери володіють понад половиною капіталу; серед них холдинги, родини і землі.
          explanation: >-
            У Німеччині три найбільші акціонери контролюють понад 50 % капіталу у 59 % лістингових компаній (табл. 1.1 Огляду ОЕСР 2023).
            Приклад — Volkswagen AG, де 53,3 % голосів у Porsche SE і 20,0 % у землі Нижня Саксонія.
          source: oecd-factbook-2023
        - model: japanese
          statement: Помірно концентрована з перехресним володінням — контролюючого акціонера часто немає, але значна частка акцій належить «дружнім» компаніям групи.
          explanation: >-
            В Японії три найбільші акціонери контролюють понад половину капіталу лише у 28 % лістингових компаній, водночас корпорації
            володіють 22 % капіталу ринку — ознака групових структур і перехресних пакетів (Огляд ОЕСР 2023, розд. 1.5, табл. 1.1).
          source: oecd-factbook-2023
        - model: family
          statement: Контроль родини засновника — через великий пакет, пул акціонерів або акції з різними правами голосу, навіть якщо родині належить менша частина капіталу.
          explanation: >-
            Пул нащадків засновника Roche тримає понад 67 % голосів, хоча більшість капіталу компанії — неголосуючі папери; контроль
            відокремлений від частки в капіталі саме інструментами голосування.
          source: roche-agm-2022

    - id: key-owners
      title: Хто найбільші власники
      cells:
        - model: anglo-american
          statement: Інституційні інвестори — пенсійні, взаємні й індексні фонди; у США вони володіють щонайменше 70 % капіталу лістингових компаній.
          explanation: >-
            Огляд ОЕСР 2023 (розд. 1.5): інституційні інвестори — беззаперечно домінуючі власники в США. Тому «активний принципал»
            у цій моделі — фонд, який голосує за політикою залученості, а не окрема людина.
          source: oecd-factbook-2023
        - model: german
          statement: Стратегічні власники — промислові холдинги, родини-засновники, федеральні землі; історично також банки і страховики.
          explanation: >-
            Структура Volkswagen AG (холдинг родин засновників, земля, суверенний фонд) — типовий набір стратегічних власників
            континентальної моделі; частка вільного обігу лише 9,7 %.
          source: vw-shareholders-2025
        - model: japanese
          statement: Інші компанії тієї самої групи та фінансові установи, які тримають пакети одне одного для стабільності відносин.
          explanation: >-
            Toyota Motor володіла 24,66 % акцій Toyota Industries — компанії-засновниці групи, яка сама є акціонером Toyota Motor;
            це класичне перехресне володіння, яке Кодекс 2021 р. вимагає щорічно переоцінювати й розкривати.
          source: toyota-industries-2026
        - model: family
          statement: Родина засновника і пов’язані з нею особи; зовнішні інвестори тримають капітал, але не контроль.
          explanation: >-
            У Roche зовнішні інвестори володіють більшістю капіталу через неголосуючі папери, а голоси зосереджені в сімейному пулі —
            родина лишається головним власником у сенсі контролю.
          source: roche-agm-2022

    - id: role-of-banks
      title: Роль банків
      cells:
        - model: anglo-american
          statement: Банки — кредитори на ринкових умовах, а не власники; вони не сидять у радах і не втручаються в управління.
          explanation: >-
            Шляйфер і Вішні протиставляють ринкові системи США і Великої Британії, де банкам обмежено володіння акціями, банкоцентричним
            системам Німеччини і Японії.
          source: shleifer-vishny-1997
        - model: german
          statement: «Домашній банк» — кредитор, акціонер і представник у наглядовій раді в одній особі; роль зменшується, але кредит лишається головним джерелом.
          explanation: >-
            За оглядом Шляйфера й Вішні, німецькі банки поєднували кредитування з володінням акціями і голосуванням за депонованими акціями
