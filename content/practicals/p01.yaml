trainer:
  kind: model-matrix
  models:
    - id: anglo-american
      title: Англо-американська модель
      short: Англо-американська
      term: anglo-american-model
      countries: [США, Велика Британія, Канада, Австралія]
      summary: >-
        Аутсайдерська система: розпорошена власність, інституційні інвестори як головні акціонери, однорівнева рада
        з більшістю незалежних директорів, глибокий ринок капіталу і активний ринок корпоративного контролю.
        Головний агентський конфлікт — між менеджментом і акціонерами.
      examples:
        - company: HSBC Holdings plc
          country: Велика Британія
          note: >-
            Станом на 06.05.2026 рада з 14 директорів, з них 11 незалежних невиконавчих; голова ради і головний виконавчий
            директор — різні особи, як рекомендує Кодекс корпоративного управління Великої Британії.
          url: https://www.hsbc.com/who-we-are/leadership-and-governance/board-of-directors
          checkedAt: '2026-09-16'
        - company: Microsoft Corporation
          country: США
          note: >-
            Чотири постійні комітети ради складаються лише з незалежних директорів; власна настанова щодо незалежності директорів.
            Найбільші акціонери — інституційні інвестори.
          url: https://www.microsoft.com/en-us/investor/corporate-governance/board-of-directors
          checkedAt: '2026-09-16'
    - id: german
      title: Німецька (континентальна) модель
      short: Німецька
      term: german-model
      countries: [Німеччина, Австрія, Нідерланди]
      summary: >-
        Інсайдерська система: концентрована власність стратегічних власників, дворівнева рада з правління й наглядової
        ради, законодавчо закріплена співучасть працівників, банківське фінансування. Головний конфлікт — між контролюючим
        акціонером і міноритаріями, врівноважений інтересами праці.
      examples:
        - company: Volkswagen AG
          country: Німеччина
          note: >-
            Права голосу на 31.12.2025: Porsche Automobil Holding SE 53,3 %, земля Нижня Саксонія 20,0 %, Qatar Holding 17,0 %,
            вільний обіг 9,7 %. Правління і наглядова рада; за законом про співучасть половина наглядової ради — представники працівників.
          url: https://www.volkswagen-group.com/en/shareholder-structure-15951
          checkedAt: '2026-09-16'
    - id: japanese
      title: Японська модель
      short: Японська
      term: japanese-model
      countries: [Японія]
      summary: >-
        Інсайдерська система групового типу: перехресне володіння акціями всередині груп (кейрецу), історична роль головного
        банку, довгострокові відносини з працівниками й партнерами; у радах історично переважали виконавчі директори, що виросли
        в компанії. Кодекс корпоративного управління біржі (2015, переглянутий 2018 і 2021 рр.) вимагає для ринку Prime щонайменше
        третину незалежних директорів і політику щодо перехресних пакетів.
      examples:
        - company: Toyota Motor Corporation
          country: Японія
          note: >-
            Володіла 24,66 % акцій Toyota Industries — компанії-засновниці групи, яка сама була її акціонером (перехресне володіння);
            у 2025–2026 рр. Toyota Industries приватизовано через тендерну пропозицію і 01.06.2026 делістинговано. Паралельно у 2025 р.
            збори Toyota Motor перевели компанію до структури з аудиторсько-наглядовим комітетом (98,80 % голосів «за»).
          url: https://www.toyota-industries.com/news/item/20260417_document_e01.pdf
          checkedAt: '2026-09-16'
    - id: family
      title: Сімейна модель
      short: Сімейна
      term: family-model
      countries: ['поширена в Азії, Латинській Америці, Південній Європі і Швейцарії; трапляється в Україні']
      summary: >-
        Контроль родини засновника через великий пакет, угоду про спільне голосування або акції з різними правами голосу;
        рада з членів родини й довірених осіб; мета — збереження контролю і передавання компанії наступному поколінню.
        Головний конфлікт — між родиною і зовнішніми інвесторами. Приклад описано за даними самої компанії.
      examples:
        - company: Roche Holding Ltd
          country: Швейцарія
          note: >-
            За даними компанії: пул нащадків засновника тримав понад 67 % голосів після викупу пакета Novartis (промова віцеголови ради
            15.03.2022) і 64,97 % на 31.12.2025 (Finance Report 2025); більшість капіталу — неголосуючі сертифікати участі зовнішніх
            інвесторів; угода про спільне голосування діє з 1948 р.
          url: https://assets.roche.com/f/176343/x/fca190f63e/fb25e.pdf
          checkedAt: '2026-09-17'

  features:
    - id: ownership-structure
      title: Структура власності
      cells:
        - model: anglo-american
          statement: Розпорошена — три найбільші акціонери типової лістингової компанії разом тримають лише близько третини капіталу, контролюючого власника немає.
          explanation: >-
            За Factbook 2023, найнижча концентрація власності — в Австралії, Фінляндії, Ірландії, США, Канаді та Великій Британії:
            три найбільші акціонери володіють у середньому 33–36 % капіталу. Саме така картина стоїть за працею Берлі й Мінза.
          source: oecd-factbook-2023
        - model: german
          statement: Концентрована — у більшості лістингових компаній три найбільші акціонери володіють понад половиною капіталу; серед них холдинги, засновники і публічні власники.
          explanation: >-
            У Німеччині три найбільші акціонери контролюють понад 50 % капіталу у 59 % лістингових компаній (табл. 1.1 Factbook 2023).
            Приклад — Volkswagen AG, де 53,3 % голосів у Porsche SE і 20,0 % у землі Нижня Саксонія.
          source: oecd-factbook-2023
        - model: japanese
          statement: Помірно концентрована з перехресним володінням — контролюючого акціонера часто немає, але значна частка акцій належить партнерським компаніям групи.
          explanation: >-
            В Японії три найбільші акціонери контролюють понад половину капіталу лише у 28 % лістингових компаній, водночас корпорації
            володіють 22 % капіталу ринку — ознака групових структур і перехресних пакетів (Factbook 2023, розд. 1.5, табл. 1.1).
          source: oecd-factbook-2023
        - model: family
          statement: Контроль зосереджений в одній групі пов’язаних між собою фізичних осіб — через угоду про спільне голосування або акції з різними правами голосу, навіть якщо їй належить менша частина капіталу.
          explanation: >-
            За даними Roche, група акціонерів з об’єднаними правами голосу тримала 64,97 % акцій на 31.12.2025, а більшість капіталу
            компанії — неголосуючі сертифікати участі; контроль відокремлений від частки в капіталі інструментами голосування.
          source: roche-finance-2025

    - id: key-owners
      title: Хто найбільші власники
      cells:
        - model: anglo-american
          statement: Інституційні інвестори — пенсійні, взаємні й індексні фонди; на найбільшому ринку моделі вони володіють щонайменше 70 % капіталу лістингових компаній.
          explanation: >-
            Factbook 2023 (розд. 1.5): інституційні інвестори — беззаперечно домінуючі власники в США. Тому «активний принципал»
            у цій моделі — фонд, який голосує за політикою залученості, а не окрема людина.
          source: oecd-factbook-2023
        - model: german
          statement: Стратегічні власники — промислові холдинги, засновники, регіональна влада; історично також банки і страховики.
          explanation: >-
            Структура Volkswagen AG (холдинг родин засновників, земля, суверенний фонд) — типовий набір стратегічних власників
            континентальної моделі; частка вільного обігу лише 9,7 %.
          source: vw-shareholders-2025
        - model: japanese
          statement: Інші компанії тієї самої групи та фінансові установи, які тримають пакети одне одного для стабільності відносин.
          explanation: >-
            Toyota Motor володіла 24,66 % акцій Toyota Industries — компанії-засновниці групи, яка сама була акціонером Toyota Motor;
            це класичне перехресне володіння, політику щодо якого Кодекс (принцип 1.4) вимагає розкривати й щорічно переоцінювати.
          source: toyota-industries-2026
          alsoSources: [jcgc-code-2021]
        - model: family
          statement: Група пов’язаних фізичних осіб тримає голоси, а зовнішні інвестори — капітал без контролю, наприклад через неголосуючі папери.
          explanation: >-
            За даними Roche, зовнішні інвестори володіють більшістю капіталу через неголосуючі сертифікати участі, а голоси зосереджені
            в пулі нащадків засновника, що діє з 1948 р.
          source: roche-finance-2025

    - id: role-of-banks
      title: Роль банків
      cells:
        - model: anglo-american
          statement: Банки — кредитори на ринкових умовах, а не власники; вони не входять до рад і не втручаються в управління.
          explanation: >-
            Шляйфер і Вішні протиставляють ринкові системи США і Великої Британії, де банкам обмежено володіння акціями, банкоцентричним
            системам Німеччини і Японії.
          source: shleifer-vishny-1997
        - model: german
          statement: Історично «домашній банк» поєднував кредитування, володіння акціями і голосування за депонованими акціями клієнтів; нині посередник голосує чужими акціями лише за дорученням і вказівками акціонера.
          explanation: >-
            За оглядом Шляйфера й Вішні (стан на 1990-ті), німецькі банки поєднували кредитування з володінням акціями і голосуванням за
            депонованими акціями, що давало їм місце в наглядових радах. Сьогодні § 135 Закону про АТ дозволяє посереднику голосувати
            чужими акціями лише за дорученням акціонера і за його вказівками або за заздалегідь розкритими пропозиціями.
          source: shleifer-vishny-1997
          alsoSources: [aktg-135]
        - model: japanese
          statement: «Головний банк» групи — кредитор, акціонер і рятівник у кризі; після 1990-х його роль послабилася, а перехресні пакети розпродаються.
          explanation: >-
            Система головного банку описана Шляйфером і Вішні як механізм моніторингу в Японії; принцип 1.4 Кодексу вимагає розкривати
            політику скорочення перехресних пакетів, що поступово розмиває цей зв’язок.
          source: shleifer-vishny-1997
          alsoSources: [jcgc-code-2021]
        - model: family
          statement: Банк — зовнішній кредитор; емісія голосуючих акцій розмиває контроль, тому власники воліють кредит або неголосуючі папери.
          explanation: >-
            За даними Roche, капітал від зовнішніх інвесторів залучено через неголосуючі сертифікати участі (702 562 700 шт. на 31.12.2025),
            а голосуючі акції лишилися в пулі; так контроль не розмивається.
          source: roche-finance-2025

    - id: board-structure
      title: Будова ради
      cells:
        - model: anglo-american
          statement: Однорівнева рада з більшістю незалежних невиконавчих директорів; голова ради зазвичай не є головним виконавчим директором.
          explanation: >-
            Кодекс Великої Британії 2024 р. вимагає поділу ролей голови ради і CEO та незалежності більшості ради; приклад — HSBC: 14 директорів,
            11 незалежних, голова і CEO — різні особи (станом на 06.05.2026).
          source: uk-cg-code-2024
          alsoSources: [hsbc-board-2026]
        - model: german
          statement: Дворівнева — один орган веде бізнес, інший його призначає й контролює; одна особа не може входити до обох одночасно.
          explanation: >-
            Німецький кодекс корпоративного управління описує правління (Vorstand) і наглядову раду (Aufsichtsrat) як окремі органи з різними
            повноваженнями, процедурами й винагородою.
          source: dcgk-2022
        - model: japanese
          statement: Історично в раді переважали виконавчі директори з-поміж працівників компанії; з 2021 р. компанії найвищого сегмента біржі мають щонайменше третину незалежних директорів і обирають одну з трьох законних структур органів.
          explanation: >-
            Принцип 4.8 Кодексу в редакції 2021 р. підняв вимогу для ринку Prime з двох незалежних директорів до третини ради. Паралельний
            факт: Toyota Motor у 2025 р. перейшла до структури з аудиторсько-наглядовим комітетом; причинного зв’язку з Кодексом джерела не встановлюють.
          source: jcgc-code-2021
          alsoSources: [toyota-voting-2025]
        - model: family
          statement: Рада з представників контролюючої групи та довірених осіб; незалежні директори з’являються з виходом на біржу або під тиском інвесторів.
          explanation: >-
            Factbook 2023 фіксує, що в юрисдикціях з контрольованими компаніями правила про незалежних директорів і представництво міноритаріїв
            у раді вводять саме як противагу контролюючому власнику.
          source: oecd-factbook-2023

    - id: employees
      title: Роль працівників
      cells:
        - model: anglo-american
          statement: Працівники — стейкхолдери без місця в раді; кодекс рекомендує механізм залучення персоналу — директора від персоналу, консультативну раду або відповідального невиконавчого директора.
          explanation: >-
            Кодекс Великої Британії рекомендує один із механізмів залучення працівників, але не закріплює за працівниками місць у раді.
          source: uk-cg-code-2024
        - model: german
          statement: Представники працівників за законом займають половину місць у контрольному органі компаній з понад 2 000 працівників і третину — у компаніях з понад 500 працівниками.
          explanation: >-
            Закон про співучасть 1976 р. (§ 1, § 7) встановлює паритет представників акціонерів і працівників у наглядовій раді компаній,
            що зазвичай мають понад 2 000 працівників; Закон про третинну участь 2004 р. — третину для компаній з понад 500 працівниками.
          source: mitbestg-1976
          alsoSources: [drittelbg-2004]
        - model: japanese
          statement: Довгостроковий найм і внутрішня кар’єра — менеджери виростають із працівників; формального представництва в раді немає.
          explanation: >-
            Шляйфер і Вішні описують японську систему як інсайдерську: менеджмент і працівники пов’язані довгостроковими відносинами, а
            зовнішні акціонери мали слабкий вплив.
          source: shleifer-vishny-1997
        - model: family
          statement: Патерналістські відносини — власники говорять про персонал як про власну відповідальність, а не як про сторону з правом представництва в органах.
          explanation: >-
            За даними компанії (промова віцеголови ради Roche на зборах 15.03.2022), родина говорить про відповідальність за персонал понад
            100 000 осіб як про власне зобов’язання; механізму представництва працівників у раді промова не згадує.
          source: roche-agm-2022

    - id: financing
      title: Джерела фінансування
      cells:
        - model: anglo-american
          statement: Ринок капіталу — емісія акцій і облігацій на глибокому фондовому ринку, найбільшому у світі за капіталізацією.
          explanation: >-
            Factbook 2023: США лишаються найбільшим ринком за капіталізацією, а публічний ринок акцій — основне джерело довгострокового
            капіталу для компаній цієї моделі.
          source: oecd-factbook-2023
        - model: german
          statement: Банківський кредит і нерозподілений прибуток; фондовий ринок менший відносно розміру економіки.
          explanation: >-
            Банкоцентрична система, за Шляйфером і Вішні, фінансує компанії через кредит і довгострокові відносини з банком, а не через
            емісію акцій розпорошеним інвесторам.
          source: shleifer-vishny-1997
        - model: japanese
          statement: Кредит головного банку і ресурси групи; за кількістю лістингових компаній ринок найбільший серед розвинених, але значна частина акцій — у перехресних пакетах.
          explanation: >-
            В Японії 3 904 лістингові компанії (табл. 1.1 Factbook 2023) — найбільше серед розвинених ринків, але 22 % капіталу належить
            корпораціям, що відображає групові структури.
          source: oecd-factbook-2023
        - model: family
          statement: Нерозподілений прибуток і кредит; вихід на біржу — лише без втрати контролю, через неголосуючі папери або подвійні класи акцій.
          explanation: >-
            За даними Roche, компанія залучила капітал зовнішніх інвесторів через неголосуючі сертифікати участі, зберігши голоси в пулі
            нащадків засновника; це типовий спосіб фінансування сімейної компанії на біржі.
          source: roche-finance-2025

    - id: disclosure
      title: Розкриття інформації
      cells:
        - model: anglo-american
          statement: Найширше — регулярна звітність, детальні звіти про винагороду, жорсткі санкції регулятора ринку; розпорошений інвестор захищений лише тим, що знає.
          explanation: >-
            Принципи G20/ОЕСР 2023 (розд. IV) описують розкриття як основу аутсайдерської системи: розпорошений акціонер захищений лише тим,
            що знає, тому вимоги до розкриття тут історично найжорсткіші.
          source: oecd-principles-2023
        - model: german
          statement: Обов’язкове розкриття для лістингових компаній плюс щорічна декларація відповідності кодексу за принципом «дотримуйся або пояснюй», передбачена законом.
          explanation: >-
            Німецький кодекс спирається на декларацію відповідності за § 161 Закону про АТ: відхилення від рекомендацій треба пояснити й розкрити.
          source: dcgk-2022
        - model: japanese
          statement: Історично обмежене; з 2021 р. компанії найвищого сегмента біржі розкривають кліматичні ризики за TCFD, політику щодо перехресних пакетів і публікують інформацію англійською.
          explanation: >-
            Редакція Кодексу 2021 р. запровадила для ринку Prime розкриття за TCFD або еквівалентом і англомовне розкриття; політика щодо
            перехресних пакетів розкривається за принципом 1.4 з 2015 р.
          source: jcgc-code-2021
          alsoSources: [fsa-cgc-revisions-2021]
        - model: family
          statement: Ключове для зовнішніх інвесторів розкриття — структура власності й угоди з пов’язаними сторонами, зокрема з контролюючим акціонером; усі юрисдикції вимагають їх розкривати.
          explanation: >-
            Factbook 2023 (розд. 3): усі 49 юрисдикцій вимагають розкривати угоди з пов’язаними сторонами за участю директорів, керівників
            і контролюючих акціонерів у річній звітності — саме там ховається ризик для зовнішніх інвесторів контрольованої компанії.
          source: oecd-factbook-2023

    - id: market-for-control
      title: Ринок корпоративного контролю
      cells:
        - model: anglo-american
          statement: Активний — ворожі поглинання й інвестори-активісти дисциплінують менеджмент; розпорошена власність робить компанію доступною для покупця.
          explanation: >-
            Шляйфер і Вішні розглядають поглинання як головний зовнішній механізм дисципліни менеджменту в США і Великій Британії.
          source: shleifer-vishny-1997
        - model: german
          statement: Обмежений — блокуючі пакети стратегічних власників роблять вороже поглинання майже неможливим без їхньої згоди.
          explanation: >-
            У Volkswagen AG 73,3 % голосів належать двом власникам (Porsche SE і земля Нижня Саксонія); купити контроль на ринку за такої
            структури неможливо без їхньої згоди.
          source: vw-shareholders-2025
        - model: japanese
          statement: Історично майже відсутній — перехресне володіння захищало від поглинань; політика скорочення пакетів і спеціальні комітети при угодах усередині групи поступово відкривають ринок.
          explanation: >-
            Принцип 1.4 Кодексу вимагає розкривати політику скорочення перехресних пакетів; випадок Toyota Industries 2025–2026 рр. показує, що
            навіть усередині групи тендерна пропозиція проходила через спецкомітет незалежних директорів і завершилася делістингом 01.06.2026.
          source: jcgc-code-2021
          alsoSources: [toyota-industries-2026]
        - model: family
          statement: Контроль не купиш на ринку — він закріплений угодою про спільне голосування контролюючої групи, тож зміна контролю можлива лише за її рішенням.
          explanation: >-
            За даними Roche, угода про спільне голосування діє з 1948 р., її строк у 2009 р. продовжено на невизначений період, а пул тримав
            64,97 % акцій на 31.12.2025 — жодна пропозиція з ринку не змінить контроль без рішення пулу.
          source: roche-finance-2025

    - id: minority-protection
      title: Головний агентський конфлікт і захист міноритаріїв
      cells:
        - model: anglo-american
          statement: Головний конфлікт — «менеджмент — акціонери»; захист — незалежна рада, суди, колективні позови й голосування інституційних інвесторів.
          explanation: >-
            Принципи G20/ОЕСР 2023 (розд. III і V) відводять інституційним інвесторам і незалежній раді роль головних дисциплінуючих сил
            там, де контролюючого власника немає.
          source: oecd-principles-2023
        - model: german
          statement: Головний конфлікт — «контролюючий акціонер — міноритарії», врівноважений участю працівників у контрольному органі; захист — права меншості в законі.
          explanation: >-
            Розділ II Принципів G20/ОЕСР 2023 присвячений рівному ставленню до акціонерів і захисту від зловживань контролюючих осіб — головній
            проблемі систем з концентрованою власністю; співучасть працівників додає до конфлікту третю сторону.
          source: oecd-principles-2023
          alsoSources: [mitbestg-1976]
        - model: japanese
          statement: Головний конфлікт — «інсайдери групи — зовнішні акціонери»; захист — незалежні директори і спеціальні комітети при угодах з материнською компанією.
          explanation: >-
            При тендерній пропозиції щодо Toyota Industries через конфлікт інтересів (Toyota Motor — найбільший акціонер) створили спеціальний комітет
            із трьох незалежних зовнішніх директорів — механізм, який Кодекс 2021 р. передбачає для лістингових дочірніх компаній.
          source: toyota-industries-2026
          alsoSources: [jcgc-code-2021]
        - model: family
          statement: Головний конфлікт — «контролююча група — зовнішні інвестори»; захист залежить від закону і біржі, бо рада зазвичай залежна від контролюючої групи.
          explanation: >-
            Factbook 2023 показує, що в юрисдикціях з переважанням контрольованих компаній регулятори вводять спеціальні правила про угоди з
            пов’язаними сторонами і представництво міноритаріїв у раді.
          source: oecd-factbook-2023

    - id: management-orientation
      title: Мета і горизонт компанії
      cells:
        - model: anglo-american
          statement: Головна мета — повернення на вкладений капітал тим, хто його надав; корпоративне управління визначають саме через це.
          explanation: >-
            Шляйфер і Вішні визначають корпоративне управління як способи, якими постачальники капіталу забезпечують повернення інвестицій, —
            формулювання, у центрі якого саме інвестор.
          source: shleifer-vishny-1997
        - model: german
          statement: Інтерес підприємства з урахуванням акціонерів, працівників та інших стейкхолдерів; орієнтир — сталий довгостроковий розвиток.
          explanation: >-
            Німецький кодекс орієнтує правління на інтерес підприємства з урахуванням акціонерів, працівників та інших стейкхолдерів і на сталий
            довгостроковий розвиток.
          source: dcgk-2022
        - model: japanese
          statement: Довгострокові відносини в групі, стабільність зайнятості й частки ринку важливіші за поточний прибуток.
          explanation: >-
            Інсайдерська система з перехресним володінням і головним банком, за Шляйфером і Вішні, винагороджує стабільність відносин, а не
            короткострокову доходність.
          source: shleifer-vishny-1997
        - model: family
          statement: Збереження контролю і передавання компанії наступному поколінню; репутація власників — частина капіталу.
          explanation: >-
            За даними компанії: «що добре для Roche — добре для нашої родини, а не навпаки» і згадка про п’яте й шосте покоління в пулі
            (промова віцеголови ради 15.03.2022) — самопрезентація, типова для сімейної моделі.
          source: roche-agm-2022

    - id: governance-instrument
      title: Головний інструмент регулювання
      cells:
        - model: anglo-american
          statement: Кодекс за принципом «дотримуйся або пояснюй», який видає регулятор фінансової звітності для компаній з лістингом.
          explanation: >-
            Кодекс Великої Британії 2024 р. (FRC) працює в режимі «дотримуйся або пояснюй» для компаній з лістингом; у США основну роль
            відіграють закони про цінні папери і корпоративне право штатів, які в цій матриці не розглядаються.
          source: uk-cg-code-2024
        - model: german
          statement: Закон про акціонерні товариства і закони про співучасть плюс кодекс зі щорічною декларацією відповідності.
          explanation: >-
            Обов’язковий рівень — Закон про АТ і Закон про співучасть 1976 р.; рекомендаційний — Кодекс з декларацією за § 161 Закону про АТ.
          source: dcgk-2022
          alsoSources: [mitbestg-1976]
        - model: japanese
          statement: Кодекс корпоративного управління біржі (2015, переглянутий 2018 і 2021 рр.) за принципом «дотримуйся або пояснюй».
          explanation: >-
            Кодекс видає Токійська фондова біржа як правило лістингу, а не закон; запроваджено 2015 р., переглянуто 2018 і 2021 рр.;
            працює через пояснення відхилень.
          source: jcgc-code-2021
        - model: family
          statement: Статут, акціонерна угода або угода про спільне голосування контролюючої групи; кодекси — лише за лістингу.
          explanation: >-
            За даними Roche, угода про спільне голосування пулу діє з 1948 р. і є справжнім «кодексом» контролю компанії.
          source: roche-finance-2025

  companyTasks:
    - id: volkswagen
      company: Volkswagen AG
      description: >-
        Автовиробник з Вольфсбурга. Права голосу на 31.12.2025: холдинг родин засновників — 53,3 %, федеральна земля — 20,0 %,
        суверенний фонд — 17,0 %, вільний обіг — 9,7 %. Органи: правління і наглядова рада; половина наглядової ради — представники
        працівників за законом. Щорічна декларація відповідності кодексу.
      answer: german
      keyFeatures: [ownership-structure, board-structure, employees]
      explanation: >-
        Концентрована власність стратегічних власників (холдинг, земля, фонд), дворівнева структура і законодавча співучасть працівників —
        три визначальні ознаки німецької моделі. Сімейний холдинг у структурі не робить компанію «сімейною моделлю»: контроль поділений
        із землею, а органи й співучасть визначає німецьке право.
      source: vw-shareholders-2025
    - id: toyota
      company: Toyota Motor Corporation
      description: >-
        Автовиробник володів 24,66 % акцій компанії-засновниці своєї групи, яка сама була його акціонером; у 2025–2026 рр. цю компанію
        приватизовано через тендерну пропозицію з участю спеціального комітету незалежних директорів і 01.06.2026 делістинговано.
        У 2023 р. один радник з голосування рекомендував голосувати проти голови ради, посилаючись на малу частку незалежних
        директорів; у 2024 р. інший радник — посилаючись на сертифікаційні порушення в групі. У 2025 р. збори перевели компанію
        до структури з аудиторсько-наглядовим комітетом. Паралельно біржовий кодекс вимагає щороку переоцінювати перехресні пакети.
      answer: japanese
      keyFeatures: [key-owners, board-structure, market-for-control]
      explanation: >-
        Перехресне володіння всередині групи, рада, яка лише поступово рухається до незалежності, і кодекс біржі як головний інструмент —
        ознаки японської моделі. Спеціальний комітет незалежних директорів при угоді з Toyota Industries показує, як модель змінюється;
        причинного зв’язку між Кодексом і змінами в раді Toyota джерела не встановлюють — це паралельні факти.
      source: toyota-industries-2026
    - id: dispersed
      company: Умовна компанія «Північна енергія»
      description: >-
        Акції в обігу на Нью-Йоркській фондовій біржі; найбільший акціонер — індексний фонд з 8 %, десять найбільших разом — 30 %.
        Однорівнева рада з 11 членів, з них 9 незалежних; голова ради і головний виконавчий директор — різні особи. Винагорода CEO
        на 80 % складається з акцій і опціонів. Інвестор-активіст з 3 % вимагає продати підрозділ і публікує відкритого листа раді.
      answer: anglo-american
      keyFeatures: [ownership-structure, board-structure, market-for-control]
      explanation: >-
        Розпорошена власність з інституційними інвесторами, однорівнева рада з більшістю незалежних, змінна винагорода в акціях і
        активний ринок корпоративного контролю (активіст) — усе це англо-американська модель. Головний конфлікт тут — між менеджментом
        і акціонерами, тому й механізми спрямовані на менеджмент.
