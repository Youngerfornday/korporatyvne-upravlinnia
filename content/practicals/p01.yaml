        - model: japanese
          statement: Історично велика рада з інсайдерів; тепер компанії ринку Prime мають щонайменше третину незалежних директорів і обирають одну з трьох структур органів.
          explanation: >-
            Перегляд Кодексу 2021 р. підняв вимогу для ринку Prime з двох незалежних директорів до третини ради і вимагає комітетів з номінацій
