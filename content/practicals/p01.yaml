# Практична 1 «Матриця моделей корпоративного управління»: дані тренажера model-matrix.
# Мета, результати, ПРН і рубрика — у реєстрі course.yaml (practicals[p01]). Тут — зміст: моделі, ознаки, клітинки з поясненням
# і джерелом, завдання «визнач модель», тема есе. Моделі описано як узагальнення; кожна клітинка має джерело зі списку sources.
# Формулювання клітинок не називають країн, органів і власників, які видавали б відповідь; назви — лише в поясненнях.
# Історичні характеристики (огляд 1997 р.) подано в минулому часі; сучасний стан — за джерелами 2021–2026 рр.
id: p01
title: Матриця моделей корпоративного управління
intro: >-
  Чотири моделі корпоративного управління — це чотири способи відповісти на одне питання: хто контролює компанію
  і як захищені ті, хто нею не керує. У тренажері ви зіставляєте формулювання ознак з моделями; після кожної відповіді
  відкривається пояснення і джерело. Перша спроба — навчальна, з розбором кожної клітинки; за рубрикою оцінюється друга.
  Далі — три компанії, для яких треба визначити модель і назвати дві ключові ознаки, і есе про українські акціонерні
  товариства. Зарахування — за рубрикою практичної в реєстрі курсу.
status: review
updatedAt: '2026-09-17'

