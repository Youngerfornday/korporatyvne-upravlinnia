        - model: family
          statement: Мінімально необхідне — родина цінує конфіденційність; повне розкриття лише в тих компаніях, які вийшли на біржу.
          explanation: >-
            Огляд ОЕСР 2023 пояснює, що в контрольованих компаніях ключове розкриття — це структура власності й угоди з пов’язаними сторонами,
