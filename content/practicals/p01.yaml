          checkedAt: '2026-09-17'

  features:
    - id: ownership-structure
      title: Структура власності
      cells:
        - model: anglo-american
          statement: Розпорошена — три найбільші акціонери типової лістингової компанії разом тримають лише близько третини капіталу; на найбільшому ринку моделі контроль трьох найбільших перевищує 50 % лише у 17 % компаній.
          explanation: >-
            За Factbook 2023 найнижча концентрація власності — в Австралії, Фінляндії, Ірландії, США, Канаді та Великій Британії
            (три найбільші акціонери — у середньому 33–36 % капіталу); Factbook 2025: у США три найбільші власники тримають понад
            50 % лише у 17 % лістингових компаній. Саме така картина стоїть за працею Берлі й Мінза.
          source: oecd-factbook-2023
          alsoSources: [oecd-factbook-2025]
        - model: german
          statement: Концентрована — у більшості лістингових компаній три найбільші акціонери володіють понад половиною капіталу; серед них холдинги, засновники і публічні власники.
          explanation: >-
            У Німеччині три найбільші акціонери контролюють понад 50 % капіталу у 59 % лістингових компаній (табл. 1.1 Factbook 2023);
            по Європі загалом — у 53 % (Factbook 2025). Приклад — Volkswagen AG, де 53,3 % голосів у Porsche SE і 20,0 % у землі Нижня Саксонія.
          source: oecd-factbook-2023
          alsoSources: [oecd-factbook-2025]
        - model: japanese
          statement: Помірно концентрована з перехресним володінням — контролюючого акціонера часто немає, але помітна частка капіталізації ринку належить партнерським компаніям, які тримають пакети одна одної.
          explanation: >-
            В Японії три найбільші акціонери контролюють понад половину капіталу лише у 28 % лістингових компаній, водночас корпорації
            володіють 22 % капіталу ринку (Factbook 2023, розд. 1.5, табл. 1.1); перехресне володіння — 6,3 % капіталізації, найвищий
            показник серед юрисдикцій ОЕСР (Working Paper № 27, табл. 2.3).
          source: oecd-factbook-2023
          alsoSources: [oecd-wp27-2022]
        - model: family
          statement: Контроль зосереджений у групі пов’язаних між собою фізичних осіб; у Західній Європі таких близько 44 % лістингових компаній — стільки ж, скільки з розпорошеною власністю, від 23 % до близько 60 % залежно від країни.
          explanation: >-
            За оглядом Villalonga і Amit (2020, табл. 1, дані Faccio і Lang по 5 232 компаніях 13 країн), у Західній Європі 44 %
            лістингових компаній — сімейні проти 45 % з розпорошеною власністю; від 23 % у Великій Британії до близько 60 % у Франції,
            Німеччині, Португалії та Італії. Ілюстрація — Roche: пул нащадків засновника тримав 64,97 % акцій на 31.12.2025.
          source: villalonga-amit-2020
          alsoSources: [roche-finance-2025]

    - id: key-owners
      title: Хто найбільші власники
      cells:
        - model: anglo-american
          statement: Інституційні інвестори — пенсійні, взаємні й індексні фонди; на найбільшому ринку моделі вони володіють щонайменше 70 % капіталу лістингових компаній.
          explanation: >-
            Factbook 2023 (розд. 1.5): інституційні інвестори — беззаперечно домінуючі власники в США. Тому «активний принципал»
            у цій моделі — фонд, який голосує за політикою залученості, а не окрема людина.
          source: oecd-factbook-2023
        - model: german
          statement: Стратегічні власники — промислові холдинги, засновники, регіональна влада; історично також банки і страховики.
          explanation: >-
            Структура Volkswagen AG (холдинг родин засновників, земля, суверенний фонд) — типовий набір стратегічних власників
            континентальної моделі; частка вільного обігу лише 9,7 %.
          source: vw-shareholders-2025
        - model: japanese
          statement: Інші компанії тієї самої групи та фінансові установи, які тримають пакети одне одного; кодекс біржі вимагає розкривати політику щодо таких пакетів і щороку оцінювати кожен.
          explanation: >-
            Toyota Motor володіла 24,66 % акцій Toyota Industries — компанії-засновниці групи, яка сама була акціонером Toyota Motor;
            принцип 1.4 чинного Кодексу (з 2015 р., посилений 2018 р.) вимагає розкривати політику щодо перехресного володіння і щорічно
            оцінювати кожен пакет проти вартості капіталу.
          source: toyota-industries-2026
          alsoSources: [jcgc-code-2026]
        - model: family
          statement: Стратегічні фізичні особи — засновники та їхні нащадки; у 16 юрисдикціях вони в середньому тримають понад 20 % акцій лістингових компаній, а у світі їм належить 7 % капіталізації.
          explanation: >-
            Working Paper ОЕСР № 27: стратегічні фізичні особи концентрують у середньому понад 20 % акцій у 16 юрисдикціях, зокрема у
            Франції, Італії, Німеччині та Іспанії; Factbook 2025: стратегічним особам і родинам належить 7 % світової капіталізації
            (у Європі — 9 %, у США — 5 %).
          source: oecd-wp27-2022
          alsoSources: [oecd-factbook-2025]

    - id: role-of-banks
      title: Роль банків
      cells:
        - model: anglo-american
          statement: Історично банкам обмежували володіння акціями; нині банки — кредитори на ринкових умовах без місця в радах, а головні власники — інституційні інвестори.
          explanation: >-
            Шляйфер і Вішні (1997) протиставляли ринкові системи США і Великої Британії, де банкам обмежено володіння акціями, банкоцентричним
            системам; сучасний стан — Factbook 2023: інституційні інвестори володіють щонайменше 70 % капіталу лістингових компаній США.
          source: shleifer-vishny-1997
          alsoSources: [oecd-factbook-2023]
        - model: german
          statement: Історично «домашній банк» поєднував кредитування, володіння акціями і голосування за депонованими акціями клієнтів; нині посередник голосує чужими акціями лише за дорученням і вказівками акціонера.
          explanation: >-
            За оглядом Шляйфера й Вішні (стан на 1990-ті), німецькі банки поєднували кредитування з володінням акціями і голосуванням за
            депонованими акціями, що давало їм місце в наглядових радах. Сьогодні § 135 Закону про АТ дозволяє посереднику голосувати
            чужими акціями лише за дорученням акціонера і за його вказівками або за заздалегідь розкритими пропозиціями.
          source: shleifer-vishny-1997
          alsoSources: [aktg-135]
        - model: japanese
          statement: Історично «головний банк» групи був кредитором, акціонером і рятівником у кризі; паралельно з 2015 р. кодекс біржі вимагає політику щодо перехресних пакетів, а їхня частка на кінець 2022 р. — 6,3 % капіталізації.
          explanation: >-
            Систему головного банку описали Шляйфер і Вішні як механізм моніторингу в Японії 1990-х. Паралельні факти без причинного
            зв’язку: принцип 1.4 Кодексу з 2015 р. вимагає розкривати політику щодо перехресного володіння (з 2018 р. — оцінювати кожен
            пакет проти вартості капіталу), а Working Paper № 27 фіксує перехресне володіння на рівні 6,3 % капіталізації Японії.
          source: shleifer-vishny-1997
          alsoSources: [jcgc-code-2026, oecd-wp27-2022]
        - model: family
          statement: Банк — зовнішній кредитор; емісія голосуючих акцій розмиває контроль, тому власники воліють кредит, піраміду, подвійні класи акцій або неголосуючі папери.
          explanation: >-
            Working Paper ОЕСР № 27 описує піраміди й подвійні класи акцій як механізми, що зберігають контроль за меншої частки в капіталі;
            ілюстрація — Roche, де капітал зовнішніх інвесторів залучено через неголосуючі сертифікати участі (702 562 700 шт. на 31.12.2025),
            а голосуючі акції лишилися в пулі.
          source: oecd-wp27-2022
          alsoSources: [roche-finance-2025]

    - id: board-structure
      title: Будова ради
      cells:
        - model: anglo-american
          statement: Однорівнева рада з більшістю незалежних невиконавчих директорів; голова ради зазвичай не є головним виконавчим директором.
          explanation: >-
            Кодекс Великої Британії 2024 р. вимагає поділу ролей голови ради і CEO та незалежності більшості ради; приклад — HSBC: 14 директорів,
            11 незалежних, голова і CEO — різні особи (станом на 06.05.2026).
          source: uk-cg-code-2024
          alsoSources: [hsbc-board-2026]
        - model: german
          statement: Дворівнева — один орган веде бізнес, інший його призначає й контролює; одна особа не може входити до обох одночасно.
          explanation: >-
            Німецький кодекс корпоративного управління описує правління (Vorstand) і наглядову раду (Aufsichtsrat) як окремі органи з різними
            повноваженнями, процедурами й винагородою.
          source: dcgk-2022
        - model: japanese
          statement: Історично в раді переважали виконавчі директори з-поміж працівників компанії; нині для найвищого сегмента біржі потрібна щонайменше третина незалежних директорів, а за наявності контролюючого акціонера — більшість або спеціальний комітет; структуру органів компанія обирає з трьох законних.
          explanation: >-
            Принцип 4.10 чинного Кодексу (21.07.2026): для ринку Prime — щонайменше третина незалежних директорів; для компаній Prime з
            контролюючим акціонером — більшість, незалежних від нього (або спеціальний комітет). Вимоги більшості для всіх компаній Prime
            в Кодексі немає. Паралельний факт: Toyota Motor у 2025 р. перейшла до структури з аудиторсько-наглядовим комітетом; причинного
            зв’язку з Кодексом джерела не встановлюють.
          source: jcgc-code-2026
          alsoSources: [toyota-voting-2025]
        - model: family
          statement: Засновники або їхні нащадки самі входять до ради чи менеджменту — так навіть у третині найбільших публічних компаній США; незалежні директори з’являються з виходом на біржу або під тиском інвесторів.
          explanation: >-
            Villalonga і Amit (2020, с. 244): засновники або їхні родини — ключові посадові особи, директори чи власники у третині компаній
            S&P 500 (Anderson і Reeb, 2003); Factbook 2025 (розд. 4.1.1): шість юрисдикцій прив’язують вимоги до незалежності ради до
            структури власності, тобто посилюють їх саме для контрольованих компаній.
          source: villalonga-amit-2020
          alsoSources: [oecd-factbook-2025]

    - id: employees
      title: Роль працівників
      cells:
        - model: anglo-american
          statement: Працівники — стейкхолдери без місця в раді; кодекс рекомендує механізм залучення персоналу — директора від персоналу, консультативну раду або відповідального невиконавчого директора.
          explanation: >-
            Кодекс Великої Британії рекомендує один із механізмів залучення працівників, але не закріплює за працівниками місць у раді.
          source: uk-cg-code-2024
        - model: german
          statement: Представники працівників за законом займають половину місць у контрольному органі компаній з понад 2 000 працівників і третину — у компаніях з понад 500 працівниками.
          explanation: >-
            Закон про співучасть 1976 р. (§ 1, § 7) встановлює паритет представників акціонерів і працівників у наглядовій раді компаній,
            що зазвичай мають понад 2 000 працівників; Закон про третинну участь 2004 р. — третину для компаній з понад 500 працівниками.
          source: mitbestg-1976
          alsoSources: [drittelbg-2004]
        - model: japanese
          statement: Історично — довічний найм і внутрішня кар’єра, менеджери виростали з працівників; чинний кодекс біржі називає працівників серед сторін, на потреби яких зважає управління, але представництва в раді не передбачає.
          explanation: >-
            Шляйфер і Вішні описували японську систему 1990-х як інсайдерську з довгостроковими відносинами менеджменту і працівників.
            Чинний Кодекс визначає корпоративне управління як ухвалення рішень «з належною увагою до потреб акціонерів, а також клієнтів,
            працівників і місцевих громад», однак місць працівникам у раді не відводить.
          source: shleifer-vishny-1997
          alsoSources: [jcgc-code-2026]
        - model: family
          statement: Довгостроковий неявний контракт — нижчі зарплати, але рідші звільнення; представництва працівників в органах немає, власники говорять про персонал як про власну відповідальність.
          explanation: >-
            Villalonga і Amit (2020, с. 248–249): сімейні фірми платять нижчі зарплати, але рідше звільняють, що є ознакою довгострокового
            неявного контракту з працівниками. Ілюстрація — промова віцеголови ради Roche 2022 р. про відповідальність за персонал понад 100 000 осіб.
          source: villalonga-amit-2020
          alsoSources: [roche-agm-2022]

    - id: financing
      title: Джерела фінансування
      cells:
        - model: anglo-american
          statement: Ринок капіталу — емісія акцій і облігацій на глибокому фондовому ринку, найбільшому у світі за капіталізацією.
          explanation: >-
            Factbook 2023: США лишаються найбільшим ринком за капіталізацією, а публічний ринок акцій — основне джерело довгострокового
            капіталу для компаній цієї моделі.
          source: oecd-factbook-2023
        - model: german
          statement: Історично — банківський кредит і нерозподілений прибуток; нині ринок акцій лишається невеликим відносно економіки — близько 800 лістингових компаній з капіталізацією близько 2 трлн дол. на кінець 2022 р.
          explanation: >-
            Банкоцентрична система, за Шляйфером і Вішні (1990-ті), фінансувала компанії через кредит і довгострокові відносини з банком;
            сучасний стан — табл. 1.1 Factbook 2023: у Німеччині 804 лістингові компанії з капіталізацією 1 993 млрд дол. США
            (для порівняння, в Японії — 3 904 і 5 367 млрд).
          source: shleifer-vishny-1997
          alsoSources: [oecd-factbook-2023]
        - model: japanese
          statement: Кредит головного банку і ресурси групи; за кількістю лістингових компаній ринок найбільший серед розвинених, але значна частина акцій — у перехресних пакетах.
          explanation: >-
            В Японії 3 904 лістингові компанії (табл. 1.1 Factbook 2023) — найбільше серед розвинених ринків, але 22 % капіталу належить
            корпораціям, що відображає групові структури.
          source: oecd-factbook-2023
        - model: family
          statement: «Терплячий капітал» власників, нерозподілений прибуток і кредит; вихід на біржу — без втрати контролю, через неголосуючі папери або подвійні класи акцій.
          explanation: >-
            Villalonga і Amit (2020): родини дають фірмам довгострокову орієнтацію і «терплячий капітал»; Working Paper № 27 описує подвійні
            класи акцій і піраміди як спосіб залучити капітал без втрати контролю. Ілюстрація — Roche з неголосуючими сертифікатами участі.
          source: villalonga-amit-2020
          alsoSources: [oecd-wp27-2022, roche-finance-2025]

    - id: disclosure
      title: Розкриття інформації
      cells:
        - model: anglo-american
          statement: Найширше — регулярна звітність, детальні звіти про винагороду, жорсткі санкції регулятора ринку; розпорошений інвестор захищений лише тим, що знає.
          explanation: >-
            Принципи G20/ОЕСР 2023 (розд. IV) описують розкриття як основу аутсайдерської системи: розпорошений акціонер захищений лише тим,
            що знає, тому вимоги до розкриття тут історично найжорсткіші.
          source: oecd-principles-2023
        - model: german
          statement: Обов’язкове розкриття для лістингових компаній плюс щорічна декларація відповідності кодексу за принципом «дотримуйся або пояснюй», передбачена законом.
          explanation: >-
            Німецький кодекс спирається на декларацію відповідності за § 161 Закону про АТ: відхилення від рекомендацій треба пояснити й розкрити.
          source: dcgk-2022
        - model: japanese
          statement: З 2015 р. розкривається політика щодо перехресних пакетів, з 2018 р. — результати щорічної оцінки кожного пакета проти вартості капіталу і стандарти голосування; з 2021 р. компанії найвищого сегмента розкривають кліматичні ризики за TCFD і публікують інформацію англійською.
          explanation: >-
            Принцип 1.4 з’явився в першій редакції Кодексу 2015 р.; редакція 2018 р. посилила його (оцінка кожного окремого пакета проти
            вартості капіталу, оприлюднення результатів, голосування за оприлюдненими стандартами); редакція 2021 р. додала для ринку Prime
            розкриття за TCFD або еквівалентом і англомовне розкриття; редакція 2026 р. зберігає це в чотирьох пунктах принципу 1.4.
          source: jcgc-code-2015
          alsoSources: [jcgc-code-2018, fsa-cgc-revisions-2021, jcgc-code-2026]
        - model: family
          statement: Для зовнішніх інвесторів вирішальне розкриття — акціонерні угоди, піраміди й кінцеві бенефіціари, бо саме через них тримають контроль; при цьому у 12 юрисдикціях розкриття акціонерних угод не обов’язкове, а у 13 — розкриття бенефіціарів.
          explanation: >-
            Working Paper ОЕСР № 27 (с. 20): прозорість акціонерних угод не є обов’язковою у 12 юрисдикціях, публічне розкриття бенефіціарної
            власності лістингових компаній — у 13; це прогалини, які б’ють по міноритаріях саме контрольованих компаній, де контроль
            тримають угодами, пірамідами й подвійними класами акцій. Ілюстрація — угода про спільне голосування пулу Roche, що діє з 1948 р.
          source: oecd-wp27-2022
          alsoSources: [roche-finance-2025]

    - id: market-for-control
      title: Ринок корпоративного контролю
      cells:
        - model: anglo-american
          statement: Активний — ворожі поглинання й інвестори-активісти дисциплінують менеджмент; розпорошена власність робить компанію доступною для покупця.
          explanation: >-
            Шляйфер і Вішні розглядають поглинання як головний зовнішній механізм дисципліни менеджменту в США і Великій Британії.
          source: shleifer-vishny-1997
        - model: german
          statement: Обмежений — блокуючі пакети стратегічних власників роблять вороже поглинання майже неможливим без їхньої згоди.
          explanation: >-
            У Volkswagen AG 73,3 % голосів належать двом власникам (Porsche SE і земля Нижня Саксонія); купити контроль на ринку за такої
            структури неможливо без їхньої згоди.
          source: vw-shareholders-2025
        - model: japanese
          statement: Історично майже відсутній — перехресне володіння захищало від поглинань; паралельно кодекс біржі вимагає політику скорочення пакетів, а угоди всередині групи проходять через спеціальні комітети незалежних директорів.
          explanation: >-
            Принцип 1.4 Кодексу вимагає розкривати політику щодо перехресних пакетів, зокрема їх скорочення; випадок Toyota Industries
            2025–2026 рр. показує, що навіть усередині групи тендерна пропозиція проходила через спецкомітет незалежних директорів і
            завершилася делістингом 01.06.2026. Це паралельні факти, а не наслідок один одного.
          source: jcgc-code-2026
          alsoSources: [toyota-industries-2026]
        - model: family
          statement: Контроль не купиш на ринку — його закріплено пірамідою, подвійним класом акцій або угодою про спільне голосування, тож зміна контролю можлива лише за рішенням контролюючої групи.
          explanation: >-
            Working Paper ОЕСР № 27 описує піраміди й подвійні класи акцій як механізми, що відокремлюють контроль від частки в капіталі;
            ілюстрація — Roche: угода про спільне голосування діє з 1948 р., у 2009 р. продовжена на невизначений строк, пул тримав 64,97 %
            акцій на 31.12.2025.
          source: oecd-wp27-2022
          alsoSources: [roche-finance-2025]

    - id: minority-protection
      title: Головний агентський конфлікт і захист міноритаріїв
      cells:
        - model: anglo-american
          statement: Головний конфлікт — «менеджмент — акціонери»; захист — незалежна рада, суди, колективні позови й голосування інституційних інвесторів.
          explanation: >-
            Принципи G20/ОЕСР 2023 (розд. III і V) відводять інституційним інвесторам і незалежній раді роль головних дисциплінуючих сил
            там, де контролюючого власника немає.
          source: oecd-principles-2023
        - model: german
          statement: Головний конфлікт — «контролюючий акціонер — міноритарії», врівноважений участю працівників у контрольному органі; захист — права меншості в законі.
          explanation: >-
            Розділ II Принципів G20/ОЕСР 2023 присвячений рівному ставленню до акціонерів і захисту від зловживань контролюючих осіб — головній
            проблемі систем з концентрованою власністю; співучасть працівників додає до конфлікту третю сторону.
          source: oecd-principles-2023
          alsoSources: [mitbestg-1976]
        - model: japanese
          statement: Головний конфлікт — «інсайдери групи — зовнішні акціонери»; захист — незалежні директори (більшість там, де є контролюючий акціонер) і спеціальні комітети при угодах з великим акціонером.
          explanation: >-
            Принцип 4.10 чинного Кодексу вимагає для компаній Prime з контролюючим акціонером більшості незалежних від нього директорів або
            спеціального комітету для правочинів із конфліктом інтересів. При тендерній пропозиції щодо Toyota Industries, де Toyota Motor
            мала 24,66 % і не контролювала компанію, спеціальний комітет із трьох незалежних зовнішніх директорів створили через конфлікт
            інтересів найбільшого акціонера.
          source: jcgc-code-2026
          alsoSources: [toyota-industries-2026]
        - model: family
          statement: Головний конфлікт — «контролююча група — зовнішні інвестори», типовий прояв — тунелювання прибутків усередині групи; захист — схвалення угод із пов’язаними сторонами незалежними директорами або міноритаріями, правило «більшість меншості» діє лише в 4 юрисдикціях.
          explanation: >-
            Villalonga і Amit (2020) називають тунелювання прибутків усередині груп зворотним боком сімейної власності; Working Paper № 27:
            контролююча особа може вилучати приватні вигоди коштом міноритаріїв, тому схвалення угод із пов’язаними сторонами незалежними
            директорами вимагає 21 юрисдикція, міноритаріями — 17, а правило «majority of the minority» — лише 4.
          source: oecd-wp27-2022
          alsoSources: [villalonga-amit-2020]

    - id: management-orientation
      title: Мета і горизонт компанії
      cells:
        - model: anglo-american
          statement: Головна мета — повернення на вкладений капітал тим, хто його надав; корпоративне управління визначають саме через це.
          explanation: >-
            Шляйфер і Вішні визначають корпоративне управління як способи, якими постачальники капіталу забезпечують повернення інвестицій, —
            формулювання, у центрі якого саме інвестор.
          source: shleifer-vishny-1997
        - model: german
          statement: Інтерес підприємства з урахуванням акціонерів, працівників та інших стейкхолдерів; орієнтир — сталий довгостроковий розвиток.
          explanation: >-
            Німецький кодекс орієнтує правління на інтерес підприємства з урахуванням акціонерів, працівників та інших стейкхолдерів і на сталий
            довгостроковий розвиток.
          source: dcgk-2022
        - model: japanese
          statement: Історично — стабільність відносин у групі й зайнятості понад поточний прибуток; чинна редакція кодексу біржі орієнтує раду на «зростання» — розподіл ресурсів, інвестиції й перегляд доцільності накопиченої готівки.
          explanation: >-
            Інсайдерська система 1990-х, за Шляйфером і Вішні, винагороджувала стабільність відносин, а не короткострокову доходність.
            Офіційний огляд редакції 2026 р. описує «growth-oriented governance»: рада визначає шлях зростання і постійно переглядає
            доцільність розподілу ресурсів, зокрема накопиченої готівки.
          source: shleifer-vishny-1997
          alsoSources: [fsa-tse-overview-2026]
        - model: family
          statement: Довгий горизонт і збереження компанії для наступного покоління; зворотний бік — гірші результати під керівництвом нащадків.
          explanation: >-
            Villalonga і Amit (2020, с. 248–253): родини дають фірмам довгострокову орієнтацію, але позитивний ефект сімейної власності
            поєднується з негативним ефектом контролю понад частку в капіталі та гіршими результатами компаній під керівництвом нащадків.
            Ілюстрація — «що добре для Roche — добре для нашої родини, а не навпаки» (промова 2022 р.).
          source: villalonga-amit-2020
          alsoSources: [roche-agm-2022]

    - id: governance-instrument
      title: Головний інструмент регулювання
      cells:
        - model: anglo-american
          statement: Кодекс за принципом «дотримуйся або пояснюй», який видає регулятор фінансової звітності для компаній з лістингом.
          explanation: >-
            Кодекс Великої Британії 2024 р. (FRC) працює в режимі «дотримуйся або пояснюй» для компаній з лістингом; у США основну роль
            відіграють закони про цінні папери і корпоративне право штатів, які в цій матриці не розглядаються.
          source: uk-cg-code-2024
        - model: german
          statement: Закон про акціонерні товариства і закони про співучасть плюс кодекс зі щорічною декларацією відповідності.
          explanation: >-
            Обов’язковий рівень — Закон про АТ і Закон про співучасть 1976 р.; рекомендаційний — Кодекс з декларацією за § 161 Закону про АТ.
          source: dcgk-2022
          alsoSources: [mitbestg-1976]
        - model: japanese
          statement: Кодекс корпоративного управління біржі (2015; переглянутий 2018, 2021 і 2026 рр.) за принципом «дотримуйся або пояснюй» з різним обсягом для сегментів ринку.
          explanation: >-
            Кодекс видає Токійська фондова біржа як правило лістингу, а не закон; чинна редакція — від 21.07.2026, звіти за нею — до липня 2027 р.
            Компанії ринків Prime і Standard пояснюють відхилення від будь-якого принципу, компанії ринку Growth — лише від загальних принципів.
          source: jcgc-code-2026
        - model: family
          statement: Статут і акціонерна угода або угода про спільне голосування контролюючої групи; кодекси — лише за лістингу, а розкриття самих угод обов’язкове не скрізь.
          explanation: >-
            Working Paper ОЕСР № 27 фіксує акціонерні угоди як інструмент контролю, розкриття якого не є обов’язковим у 12 юрисдикціях;
            ілюстрація — угода про спільне голосування пулу Roche, що діє з 1948 р.
          source: oecd-wp27-2022
          alsoSources: [roche-finance-2025]

  companyTasks:
    - id: volkswagen
      company: Volkswagen AG
      description: >-
        Автовиробник з Вольфсбурга. Права голосу на 31.12.2025: холдинг родин засновників — 53,3 %, федеральна земля — 20,0 %,
        суверенний фонд — 17,0 %, вільний обіг — 9,7 %. Органи: правління і наглядова рада; половина наглядової ради — представники
        працівників за законом. Щорічна декларація відповідності кодексу.
      answer: german
      keyFeatures: [ownership-structure, board-structure, employees]
      explanation: >-
        Концентрована власність стратегічних власників (холдинг, земля, фонд), дворівнева структура і законодавча співучасть працівників —
        три визначальні ознаки німецької моделі. Сімейний холдинг у структурі не робить компанію «сімейною моделлю»: контроль поділений
        із землею, а органи й співучасть визначає німецьке право.
      source: vw-shareholders-2025
    - id: toyota
      company: Toyota Motor Corporation
      description: >-
        Автовиробник володів 24,66 % акцій компанії-засновниці своєї групи, яка сама була його акціонером; у 2025–2026 рр. цю компанію
        приватизовано через тендерну пропозицію з участю спеціального комітету незалежних директорів і 01.06.2026 делістинговано.
        У 2023 р. один радник з голосування рекомендував голосувати проти голови ради, посилаючись на малу частку незалежних
        директорів; у 2024 р. інший радник — посилаючись на сертифікаційні порушення в групі. У 2025 р. збори перевели компанію
        до структури з аудиторсько-наглядовим комітетом. Паралельно біржовий кодекс вимагає щороку переоцінювати перехресні пакети
        і тримати в раді щонайменше третину незалежних директорів.
      answer: japanese
      keyFeatures: [key-owners, board-structure, market-for-control]
      explanation: >-
        Перехресне володіння всередині групи, рада, яка лише поступово рухається до незалежності, і кодекс біржі як головний інструмент —
        ознаки японської моделі. Спеціальний комітет незалежних директорів при угоді з Toyota Industries показує, як модель змінюється;
        причинного зв’язку між Кодексом і змінами в раді Toyota джерела не встановлюють — це паралельні факти.
      source: toyota-industries-2026
    - id: dispersed
      company: Умовна компанія «Північна енергія»
      description: >-
        Акції в обігу на Нью-Йоркській фондовій біржі; найбільший акціонер — індексний фонд з 8 %, десять найбільших разом — 30 %.
        Однорівнева рада з 11 членів, з них 9 незалежних; голова ради і головний виконавчий директор — різні особи. Інвестор-активіст
        з 3 % вимагає продати підрозділ і публікує відкритого листа раді; менеджмент відповідає, що це знизить довгострокову вартість.
      answer: anglo-american
      keyFeatures: [ownership-structure, board-structure, market-for-control]
      explanation: >-
        Розпорошена власність з інституційними інвесторами, однорівнева рада з більшістю незалежних і активний ринок корпоративного
        контролю (активіст, який тисне на раду публічно) — усе це англо-американська модель. Головний конфлікт тут — між менеджментом
        і акціонерами, тому й механізми спрямовані на менеджмент.
      source: oecd-factbook-2023

  essay:
    prompt: >-
      Яка модель корпоративного управління найближча до українських акціонерних товариств після Закону № 2465-IX і як вона враховує
      інтереси стейкхолдерів? Есе до 300 слів з тезою, щонайменше двома аргументами на основі ознак моделей і Принципів G20/ОЕСР 2023
      та оцінкою впливу на щонайменше дві групи стейкхолдерів.
    maxWords: 300
    expectations:
      - Чітка теза про модель (або поєднання моделей), а не переказ лекції.
      - Щонайменше два аргументи, що спираються на ознаки з матриці (структура власності, будова ради, роль працівників, розкриття) і на розділи Принципів G20/ОЕСР 2023.
      - Названо щонайменше дві групи стейкхолдерів і оцінено, як обрана модель впливає на їхні інтереси, з етичним аспектом (кому вигідно, хто несе ризик).
      - 'Норми права — лише чинні: Закон № 2465-IX, Кодекс НКЦПФР; без ВАТ/ЗАТ і Господарського кодексу.'
    hints:
      - Закон № 2465-IX дозволяє обрати однорівневу (рада директорів) або дворівневу (наглядова рада і виконавчий орган) структуру — ст. 4 (legal-baseline AT-03); у публічних товариствах незалежними мають бути не менше третини наглядової ради, але не менше двох осіб — ст. 72 ч. 4 (AT-49).
      - За звітом ОЕСР 2025 р., понад 60 % компаній, акції яких торгувалися на біржах України, мають єдиного власника з пакетом понад 50 % (проти близько 32 % у юрисдикціях Factbook 2022 р.); це лише біржові компанії — чи так само в решти АТ, перевірте на практичній 7 за розкриттям емітентів у базі SMIDA або в кейс-проєкті.
      - Кодекс НКЦПФР 2020 р. рекомендаційний і працює за принципом «дотримуйся або пояснюй» — інструмент, спільний для британської, німецької та японської моделей; але він відображає законодавство станом на 01.01.2020 і спирається на попередній закон про АТ, тому його «вимоги» звіряйте з Законом № 2465-IX.
      - Розділ VI Принципів G20/ОЕСР 2023 (сталий розвиток і стійкість) — місце, де стандарт говорить про інтереси стейкхолдерів; розділ II — про захист міноритаріїв від контролюючих осіб; Factbook 2025 називає конфлікт контролюючого і міноритарних акціонерів «горизонтальною» агентською проблемою.
