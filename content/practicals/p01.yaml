        - model: japanese
          statement: Довгостроковий найм і внутрішня кар’єра — менеджери виростають із працівників; формального представництва в раді немає.
          explanation: >-
            Шляйфер і Вішні описують японську систему як інсайдерську: менеджмент і працівники пов’язані довгостроковими відносинами, а
            зовнішні акціонери мали слабкий вплив.
