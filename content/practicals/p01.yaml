        - model: german
          statement: Обов’язкове розкриття для лістингових компаній плюс щорічна декларація відповідності кодексу за принципом «дотримуйся або пояснюй».
          explanation: >-
            Німецький кодекс спирається на декларацію відповідності за § 161 Закону про АТ: відхилення від рекомендацій треба пояснити й розкрити.
          source: dcgk-2022
        - model: japanese
          statement: Історично обмежене; з 2021 р. компанії ринку Prime розкривають кліматичні ризики за TCFD, політику щодо перехресних пакетів і публікують інформацію англійською.
          explanation: >-
            Перегляд Кодексу 2021 р. запровадив для ринку Prime розкриття за TCFD або еквівалентом, цілі різноманіття й англомовне розкриття.
