        - model: family
          statement: Рада з членів родини та довірених осіб; незалежні директори з’являються з виходом на біржу або під тиском інвесторів.
          explanation: >-
            Огляд ОЕСР 2023 фіксує, що в юрисдикціях з контрольованими компаніями правила про незалежних директорів і представництво міноритаріїв
