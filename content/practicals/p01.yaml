        - model: german
          statement: Дворівнева — правління веде бізнес, наглядова рада призначає й контролює його; одна особа не може входити до обох органів одночасно.
          explanation: >-
            Німецький кодекс корпоративного управління описує правління (Vorstand) і наглядову раду (Aufsichtsrat) як окремі органи з різними
            повноваженнями, процедурами й винагородою.
