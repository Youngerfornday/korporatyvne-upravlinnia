# Презентація теми 3 «Правове поле корпоративного бізнесу»: 28 слайдів на 2 академічні години (80 хв).
# Схема: src/content/schemas/slides.ts. Зміст — лише з лонгріда теми (lecture.mdx); норми — з docs/research/legal-baseline.md
# з кодом рядка; кожне число — з джерелом у sources (ID з sources.yaml). Текст слайда — тези; пояснення, приклад
# і питання до аудиторії — у notes.
topic: t03
slides:
  - id: title
    type: title
    subtitle: Які форми лишилися після 28.08.2025 і що писати в статуті
    sources: [law-4196-ix]
    notes: >-
      Відкрийте лекцію задачею, яку студенти впізнають. Троє випускників зібрали команду й знайшли інвестора, готового
      вкласти гроші в обмін на частку. Перше питання юриста: у якій формі реєструємо? За ним стоїть усе інше — скільки
      грошей покласти на старті, чи зможе засновник, який посварився з рештою, забрати свою частку і коли отримає гроші,
      чи побачать конкуренти умови домовленості з інвестором. Питання до аудиторії: хто з вас уже реєстрував ФОП або
      товариство і за яким критерієм обирав? Далі покажіть, що відповідь дає не бізнес-план, а три документи: закон,
      статут і корпоративний договір. І почнемо з новини, якої ще немає в більшості підручників: з 28 серпня 2025 р.
      правове поле українського бізнесу виглядає інакше.

  - id: outcomes
    type: outcomes
    title: Що ви зможете після лекції
    notes: >-
      Назвіть чотири результати й покажіть, де кожен перевіряється. Розрізняти типи АТ, ТОВ і ТДВ — у самоперевірці
      й у модульному тесті М1. Пояснювати наслідки втрати чинності Господарським кодексом — у питанні про дві дати.
      Аналізувати статистику Держстату — на практичній 2, де ви самі завантажите таблиці ЄДРПОУ. Обґрунтовувати вибір
      форми і умови статуту та корпоративного договору — там само, у завданні для стартапу з інвестором. Приклад
      результату: після лекції студент має за трьома критеріями пояснити, чому для бізнесу з капіталом у триста тисяч
      гривень акціонерна форма недоступна. Питання до аудиторії: який із результатів найближчий до вашої майбутньої роботи?

  - id: section-hk
    type: section
    number: 1
    title: Господарські товариства після втрати чинності Господарським кодексом
    notes: >-
      Перший розділ — про те, що саме зникло з правового поля торік і чому це змінює зміст самого курсу. Попередьте
      студентів: будь-який підручник, який пояснює корпоративні відносини через Господарський кодекс, від цього
      моменту читаємо лише як історію.

  - id: hk-repeal
    type: norm
    title: Господарський кодекс утратив чинність
    text: >-
      Господарський кодекс України № 436-IV втратив чинність з дня введення в дію Закону № 4196-IX, тобто
      з 28.08.2025. Подавати Господарський кодекс як чинну базу корпоративних відносин більше не можна.
    lawRef:
      act: Закон України «Про особливості регулювання діяльності юридичних осіб окремих організаційно-правових форм у перехідний період та об’єднань юридичних осіб» від 09.01.2025 № 4196-IX
      article: ст. 17 ч. 3 (GK-01)
      checkedAt: '2026-09-15'
      url: https://zakon.rada.gov.ua/laws/show/4196-20#n174
    sources: [law-4196-ix, hk-436-iv]
    notes: >-
      Пояснення: дві дати, які легко сплутати і сплутати не можна. Закон № 4196-IX ухвалено 9 січня 2025 р., він
      набрав чинності 28 лютого 2025 р., але введений у дію 28 серпня 2025 р. Набрання чинності означає, що акт
      з’явився в правовій системі; введення в дію — що його приписи почали діяти. Кодекс утратив чинність саме
      з другої дати. Приклад ціни помилки: студент, який у тесті вкаже 28.02.2025, помиляється не на пів року,
      а в розумінні того, як узагалі працює закон. Питання до аудиторії: чому законодавець розводить ці дати
      в часі? Відповідь: щоб дати бізнесу й державі час підготуватися до зміни правил.

  - id: hk-transition
    type: norm
    title: Перехідний період і заборона нових «підприємств»
    text: >-
      Перехідний період триває три роки з дня введення Закону в дію — з 28.08.2025 до 28.08.2028. Заборонено
      створювати юридичні особи у формах державного, комунального, приватного, дочірнього, іноземного підприємства,
      підприємства об’єднання громадян і споживчої кооперації, а також закріплювати майно на праві господарського
      відання чи оперативного управління.
    lawRef:
      act: Закон України «Про особливості регулювання діяльності юридичних осіб окремих організаційно-правових форм у перехідний період та об’єднань юридичних осіб» від 09.01.2025 № 4196-IX
      article: ст. 1; ст. 13 ч. 1, 3 (GK-02, GK-03)
      checkedAt: '2026-09-14'
      url: https://zakon.rada.gov.ua/laws/show/4196-20
    sources: [law-4196-ix]
    notes: >-
      Пояснення: зверніть увагу на точне формулювання — заборонено створювати нові. Ті юридичні особи, які вже
      зареєстровані у формі приватного чи дочірнього підприємства, не зникли й не стали незаконними, а перехідний
      період дає час привести справи до ладу. Приклад: сімейне «приватне підприємство», зареєстроване у 2008 р.,
      і далі працює, укладає договори й подає звітність, але відкрити поруч друге таке саме вже не можна. Питання
      до аудиторії: якщо ви радник власника такого підприємства, з чого почнете підготовку до 2028 року? Для
      державних і комунальних підприємств закон дає окремий маршрут перетворення — це тема 11.

  - id: forms-map
    type: figure
    title: Які форми лишилися
    figure: fig-01-forms-map.svg
    caption: 'Рисунок 1. Організаційно-правові форми господарських товариств після 28.08.2025; карміновим — форми, яких більше не створюють.'
    sources: [law-2465-ix, law-2275-viii, law-1576-xii]
    notes: >-
      Пояснення: пройдіть схему згори вниз. Основна конструкція приватного бізнесу з кількома власниками —
      господарське товариство: юридична особа, статутний капітал якої поділено на частки учасників. Кожна частка дає
      корпоративні права: участь в управлінні, дивіденди, частину майна при ліквідації та інформацію. Далі дві гілки:
      акціонерні товариства за Законом № 2465-IX і товариства з обмеженою та з додатковою відповідальністю за Законом
      № 2275-VIII. Застереження: Закон «Про господарські товариства» № 1576-XII у базі законодавства позначений як
      чинний, але щодо АТ, ТОВ і ТДВ уже не застосовується — для наших форм його не цитують. Приклад типової помилки
      зі старих джерел: «корпоративні підприємства за Господарським кодексом». Питання до аудиторії: чим корпоративні
      права відрізняються від самої частки? Відповідь: частку можна не відбирати, а права порушити — наприклад, роками
      не скликаючи зборів або не надаючи документів.

  - id: section-at
    type: section
    number: 2
    title: Акціонерне товариство за Законом № 2465-IX
    notes: >-
      Другий розділ — про форму, створену для залучення грошей від наперед невідомого кола інвесторів. Тут важливі
      три речі: типи товариства, поріг входу і режим акцій.

  - id: at-types
    type: norm
    title: Типів лише два — і «відкритих» серед них немає
    text: >-
      Акціонерні товариства бувають лише публічними або приватними; тип визначає статут. Публічним є товариство,
      щодо акцій якого була публічна пропозиція та/або акції якого допущені до торгів на організованому ринку
      капіталу. Зміна типу не є перетворенням. Публічне товариство створюється лише зміною типу з приватного або
      перетворенням іншого господарського товариства. Акціонер може бути один.
    lawRef:
      act: Закон України «Про акціонерні товариства» від 27.07.2022 № 2465-IX
      article: ст. 6 ч. 1–4; ст. 7; ст. 60 (AT-01, AT-02)
      checkedAt: '2026-09-14'
      url: https://zakon.rada.gov.ua/laws/show/2465-20
    sources: [law-2465-ix]
    notes: >-
      Пояснення: публічне товариство — не те, яке «велике» чи «державне». Ознака публічності — дія на ринку капіталу:
      публічна пропозиція акцій або допуск їх до торгів. Приватне — усе решта, і саме ПрАТ є типовою формою великого
      промислового бізнесу з кількома власниками. Друга важлива деталь: створити публічне товариство «з нуля» не
      можна, шлях завжди починається з приватного АТ або з іншого господарського товариства. І навпаки, зміна типу
      не є перетворенням: товариство не припиняється, правонаступника не створює, майно не переоформлює. Приклад
      помилки: «ВАТ реорганізували у ЗАТ» — такого немає з 2023 р., коли втратив чинність Закон № 514-VI. Питання
      до аудиторії: акціонерів в АТ може бути один — навіщо тоді взагалі норми про загальні збори? Відповідь: до
      товариства з одним акціонером вони не застосовуються, рішення оформлюється письмово і має статус протоколу.

  - id: at-capital
    type: norm
    title: Поріг входу в акціонерну форму
    text: >-
      Мінімальний статутний капітал акціонерного товариства становить 200 розмірів мінімальної заробітної плати,
      чинної на день створення (реєстрації) товариства. З 01.01.2026 місячна мінімальна заробітна плата дорівнює
      8 647 грн, отже для товариства, зареєстрованого у 2026 р., мінімум становить 1 729 400 грн.
    lawRef:
      act: Закон України «Про акціонерні товариства» від 27.07.2022 № 2465-IX; Закон України «Про Державний бюджет України на 2026 рік» від 03.12.2025 № 4695-IX
      article: ст. 16 ч. 1 Закону № 2465-IX; ст. 8 Закону № 4695-IX (AT-06, MZP-01)
      checkedAt: '2026-09-15'
      url: https://zakon.rada.gov.ua/laws/show/2465-20#n191
    sources: [law-2465-ix, law-4695-ix]
    notes: >-
      Пояснення: множник саме 200. Числа на кшталт «1250 мінімальних зарплат» зі старих методичок стосувалися
      законодавства, якого вже немає, і в тестах курсу вони неправильні. Друге застереження: береться мінімальна
      заробітна плата на день створення товариства, а не поточна, тому для АТ, зареєстрованого у 2015 р., сума інша,
      і щороку перераховувати капітал закон не вимагає. Приклад розрахунку на дошці: 200 × 8 647 грн = 1 729 400 грн.
      Питання до аудиторії: троє засновників мають 300 тис. грн — чи можуть вони зареєструвати АТ? Відповідь: ні,
      і саме цей поріг найчастіше вирішує вибір на користь ТОВ.

  - id: at-shares
    type: bullets
    title: Акції, структура управління і перехідні норми АТ
    bullets:
      - Усі акції іменні й лише електронні; облік — у депозитарній системі
      - Обмежувати кількість акцій або голосів одного акціонера заборонено
      - ПАТ зобов’язане мати допуск акцій до торгів і залишатися на організованому ринку
      - 'Структуру обирає статут: збори з радою і виконавчим органом або рада директорів'
      - У ПрАТ з кількістю акціонерів до десяти можливий одноосібний виконавчий орган
      - Статути мали бути приведені у відповідність до 31.12.2023
    sources: [law-2465-ix]
    notes: >-
      Пояснення: режим акцій жорсткий саме тому, що акція обертається вільно — покупець має бути впевнений, що
      купує. Паперових акцій в українському праві немає. Публічність — не самоназва, а обов’язок бути присутнім на
      організованому ринку з відповідними витратами на розкриття інформації. Про органи докладно — тема 5; тут
      достатньо запам’ятати, що вид структури обирає статут і що зміна виду структури не є реорганізацією. Приклад,
      який пояснює «дивні» товариства в реєстрі: акціонерні товариства, які на 1 січня 2023 р. не мали наглядової
      ради, вважаються такими, що обрали однорівневу структуру, доки не приведуть діяльність у відповідність.
      Питання до аудиторії: чому закон забороняє обмежувати кількість голосів одного акціонера?

  - id: section-tov
    type: section
    number: 3
    title: ТОВ і ТДВ за Законом № 2275-VIII
    notes: >-
      Третій розділ — про форму, яку обирає переважна більшість українського бізнесу. Ключ до неї: вхідний поріг
      нульовий, процедури легші, конструкція гнучка, але вихід учасника коштує товариству грошей.

  - id: tov-capital
    type: norm
    title: Статутний капітал ТОВ
    text: >-
      Статутний капітал складається з номінальної вартості часток учасників у гривнях. Мінімального розміру закон не
      встановлює. Вкладом можуть бути гроші, цінні папери, інше майно; негрошовий вклад оцінюють одностайним рішенням
      усіх учасників. Вклад вноситься повністю протягом шести місяців з дня державної реєстрації товариства, якщо
      статут не встановлює іншого строку.
    lawRef:
      act: Закон України «Про товариства з обмеженою та додатковою відповідальністю» від 06.02.2018 № 2275-VIII
      article: ст. 12 ч. 1–4; ст. 13; ст. 14 (TOV-03)
      checkedAt: '2026-09-14'
      url: https://zakon.rada.gov.ua/laws/show/2275-19
    sources: [law-2275-viii]
    notes: >-
      Пояснення: «мінімального розміру немає» означає буквально це — статутний капітал ТОВ може бути й одна гривня,
      і реєстратор його зареєструє. Але так робити не варто з двох причин. Перша: статутний капітал — перший сигнал
      для банку й контрагента. Друга: він задає пропорції, а отже ціну входу нового інвестора. Приклад: частка 1 %
      у товаристві з капіталом в одну гривню і частка 1 % у товаристві з капіталом мільйон дають однакову вагу
      голосу, але зовсім різну ціну. Питання до аудиторії: ще одна поширена помилка старих джерел — «у ТОВ не більше
      100 учасників». Чи є така норма? Відповідь: кількість учасників ТОВ не обмежується.

  - id: tov-vs-tdv
    type: two-columns
    title: ТОВ і ТДВ — одна конструкція, різна відповідальність
    left:
      heading: Товариство з обмеженою відповідальністю
      bullets:
        - Учасники не відповідають за зобов’язаннями товариства
        - Виняток — солідарна відповідальність у межах невнесеної частини вкладу
        - Товариство не відповідає за зобов’язаннями своїх учасників
        - 'Органи: збори учасників, директор або дирекція; наглядова рада — лише за статутом'
    right:
      heading: Товариство з додатковою відповідальністю
      bullets:
        - Той самий Закон № 2275-VIII і ті самі правила про капітал, частки й органи
        - Учасники додатково відповідають власним майном у розмірі за статутом
        - Сенс форми — довіра кредиторів і замовників
        - На практиці форма рідкісна
    sources: [law-2275-viii]
    notes: >-
      Пояснення: відповідальність у ТОВ влаштована дзеркально. Кредитор учасника не дійде до майна товариства,
      а кредитор товариства не дійде до майна учасника — крім однієї ситуації, коли вклад не внесено повністю.
      Це логічно: невнесений вклад є обіцянкою, на яку розраховували кредитори. У ТДВ межа зсунута: кредитор,
      якому не вистачило майна товариства, може дійти до особистого майна учасників у межах заздалегідь оголошеної
      суми. Приклад для обговорення: будівельна компанія, яка хоче виграти тендер великого замовника, оголошує
      додаткову відповідальність, щоб виглядати надійніше. Питання до аудиторії: якщо додаткова відповідальність
      підвищує довіру, чому ТДВ так мало? Відповідь шукатимемо в останньому розділі, де є цифри.

  - id: tov-meetings
    type: bullets
    title: Збори учасників ТОВ — механіка без кворуму
    bullets:
      - Поняття кворуму закон не встановлює — більшість рахується від голосів усіх учасників
      - Хто не прийшов, фактично голосує «проти», бо його голоси лишаються в знаменнику
      - Три чверті голосів усіх учасників — статут, капітал, реорганізація і ліквідація
      - Скликають збори учасники, які разом мають 10 % і більше статутного капіталу
      - Повідомляють не менше ніж за 30 днів, якщо статут не встановив іншого
      - Падіння чистих активів понад 50 % — збори протягом 60 днів
    sources: [law-2275-viii]
    notes: >-
      Пояснення: це головна процедурна відмінність від акціонерного товариства, де спершу рахують кворум від
      зареєстрованих. У ТОВ знаменник фіксований — усі учасники. Приклад: у товаристві четверо учасників з рівними
      частками, троє прийшли і всі троє «за» — це три чверті голосів усіх учасників, отже статут змінити вдалося; якби
      прийшли двоє, рішення не було б, хоч би як одностайно вони голосували. Застереження: правило чистих активів
      для ТОВ і для АТ сформульоване по-різному, плутати не можна — в АТ це три місяці з дати затвердження
      звітності, у ТОВ шістдесят днів з дня зниження. Питання до аудиторії: кому вигідне правило про знаменник?

  - id: incorporation-path
    type: figure
    title: Шлях створення — де форми розходяться
    figure: fig-02-incorporation-path.svg
    caption: 'Рисунок 2. Шлях створення ТОВ і акціонерного товариства: спільні кроки й точка розходження.'
    sources: [law-2465-ix, law-2275-viii]
    notes: >-
      Пояснення: перші три кроки майже однакові — рішення засновників і статут, статутний капітал, державна
      реєстрація з поданням відомостей про кінцевого бенефіціарного власника і структуру власності. Розходяться
      форми на п’ятому кроці: у ТОВ акцій немає, є частки, які продають з дотриманням переважного права інших
      учасників; в АТ акції іменні й електронні, обліковуються в депозитарній системі, а публічне товариство ще
      й проходить допуск акцій до торгів. Приклад: засновники, які планують за два роки продати компанію
      стратегічному інвесторові, мають подумати про цей крок уже на етапі реєстрації. Питання до аудиторії:
      на якому кроці ви б зупинилися, якби інвестор вимагав можливості швидко вийти з бізнесу?

  - id: section-tov-rights
    type: section
    number: 4
    title: Права учасників ТОВ — переважне право, вихід і дивіденди
    notes: >-
      Четвертий розділ — три права, які визначають, наскільки комфортно жити в товаристві разом з іншими людьми:
      право не пустити чужого, право піти самому і право отримати гроші.

  - id: tov-exit
    type: norm
    title: Вихід учасника залежить від розміру частки
    text: >-
      Учасник з часткою менше 50 % статутного капіталу виходить будь-коли без згоди інших. Учасник з часткою 50 %
      і більше виходить лише за згодою решти; статут одностайним рішенням може дозволити вихід без згоди. Вартість
      частки повідомляють протягом 30 днів і виплачують протягом одного року, якщо статут не встановлює іншого.
      Вихід, після якого не залишиться жодного учасника, заборонено.
    lawRef:
      act: Закон України «Про товариства з обмеженою та додатковою відповідальністю» від 06.02.2018 № 2275-VIII
      article: ст. 24 ч. 1–8 (TOV-06)
      checkedAt: '2026-09-15'
      url: https://zakon.rada.gov.ua/laws/show/2275-19#n137
    sources: [law-2275-viii]
    notes: >-
      Пояснення: логіка порога проста — коли йде власник контрольної частки, товариство може не пережити виплати,
      тому потрібна згода решти. Зверніть увагу на строк виплати: до року. Для засновника, який розраховував швидко
      забрати гроші, це неприємна новина, і саме цей строк стає першим предметом торгу при написанні статуту.
      Приклад для порівняння: акціонер з АТ не «виходить» — він продає акцію, і товариство про це навіть не питають.
      Звідси головна економічна відмінність двох форм: ТОВ захищає склад учасників ціною ліквідності, АТ захищає
      ліквідність ціною складу. Питання до аудиторії: ви інвестор з часткою 25 % — що додасте до статуту, аби
      не чекати грошей рік?

  - id: tov-preemption
    type: bullets
    title: Переважне право і дивіденди
    bullets:
      - Учасники мають переважне право купити частку, що продається третій особі, пропорційно часткам
      - Не скористалися протягом 30 днів — продавець вільний продати на повідомлених умовах
      - Статут може змінити порядок або скасувати переважне право — одностайно
      - Не застосовується при продажу на аукціоні або якщо так передбачає корпоративний договір
      - 'Дивіденди: з чистого прибутку, пропорційно часткам, грошима, за період кратний кварталу'
      - Виплата — не пізніше шести місяців з дня рішення, якщо статут не встановив іншого
    sources: [law-2275-viii]
    notes: >-
      Пояснення: економічний сенс переважного права очевидний — у товаристві, побудованому на особистій довірі,
      поява невідомого співвласника здатна зруйнувати бізнес. Тому закон дає учасникам перший шанс. Застереження
      про дивіденди: не можна ухвалювати рішення і платити, якщо товариство не розрахувалося з учасниками, які
      вийшли, або якщо майна не вистачає для прострочених вимог кредиторів; учасникові, який не вніс вклад,
      дивіденди не виплачують. Додайте ще один інструмент міноритарія: учасники з 10 % і більше статутного капіталу
      можуть вимагати аудиту фінансової звітності незалежним аудитором. Приклад: учасник з часткою 12 % роками не
      бачить прибутку — з чого почне? Питання до аудиторії: чи є в ТОВ спосіб змусити виплатити дивіденди?

  - id: section-charter
    type: section
    number: 5
    title: Статут і корпоративний договір
    notes: >-
      П’ятий розділ — про два документи, які пише сам бізнес. Головна ідея: статут публічний і однаковий для всіх,
      корпоративний договір закритий і діє між своїми сторонами.

  - id: three-levels
    type: figure
    title: Три рівні правил
    figure: fig-03-statute-vs-agreement.svg
    caption: 'Рисунок 3. Закон встановлює мінімум, статут робить вибір, корпоративний договір додає домовленість сторін.'
    sources: [law-2465-ix, law-2275-viii, nssmc-cg-code-2020]
    notes: >-
      Пояснення: щоб знайти межу між законом і вибором товариства, шукайте в тексті закону формулу «якщо статут не
      встановлює іншого» — кожна така фраза є дверима, які законодавець залишив відчиненими. Приклади дверей:
      вид структури управління АТ, наглядова рада в ТОВ, строк виплати частки учаснику, що вийшов, порядок
      переважного права, розширена компетенція зборів у ПрАТ. Приклади стін: обов’язки акціонерів встановлює лише
      закон, мінімальний капітал АТ статутом не зменшити, обмежувати кількість голосів одного акціонера не можна.
      Згадайте й третій, м’якший шар — Кодекс корпоративного управління НКЦПФР з режимом «дотримуйся або пояснюй»;
      застереження: Кодекс відображає законодавство станом на 01.01.2020, тому його розділ «Вимоги» звіряйте
      з чинним законом, а докладно про нього — тема 9. Питання до аудиторії: наведіть власний приклад норми,
      яку статутом змінити не можна.

  - id: shareholders-agreement
    type: norm
    title: Корпоративний договір — форма, межа і конфіденційність
    text: >-
      Договір укладають у письмовій формі, інакше він нікчемний; сторонами можуть бути також товариство і треті
      особи. Нікчемним є договір, який зобов’язує голосувати за вказівками органів управління товариства. Зміст
      конфіденційний: у ПАТ сторона повідомляє товариство протягом трьох робочих днів, а договір за участю держави
      чи громади з часткою від 25 % оприлюднюють протягом десяти днів.
    lawRef:
      act: Закон України «Про акціонерні товариства» від 27.07.2022 № 2465-IX; Закон України «Про товариства з обмеженою та додатковою відповідальністю» від 06.02.2018 № 2275-VIII
      article: ст. 29 Закону № 2465-IX; ст. 7 Закону № 2275-VIII (AT-14, TOV-04)
      checkedAt: '2026-09-14'
      url: https://zakon.rada.gov.ua/laws/show/2465-20
    sources: [law-2465-ix, law-2275-viii]
    notes: >-
      Пояснення: поверніться до стартапу з початку лекції. Інвестор дає гроші, але протягом трьох років частки не
      продають стороннім, а кандидатуру фінансового директора інвестор погоджує. Цим домовленостям не місце
      в статуті — не тому, що вони незаконні, а тому, що статут публічний і однаковий для всіх учасників,
      теперішніх і майбутніх. Про нікчемну умову скажіть окремо: заборона голосувати за вказівками органів
      управління б’є в суть корпоративного управління — інакше агент керував би принципалом, і механізм
      підзвітності з теми 1 перевернувся б. Приклад практики: умови tag-along і drag-along існують в українському
      праві не як окремі інститути, а як звичайні умови купівлі-продажу частки всередині корпоративного договору.
      Питання до аудиторії: що робити, якщо сторона просто порушила договір і проголосувала інакше?

  - id: section-choice
    type: section
    number: 6
    title: Вибір організаційно-правової форми — критерії і статистика
    notes: >-
      Шостий розділ — перевірка теорії реальністю. Подивимося, що насправді обирає український бізнес і чому,
      а заразом навчимося читати статистику обережно.

  - id: statistics
    type: bullets
    title: Що обирає український бізнес
    bullets:
      - '01.01.2020: 13 902 АТ, 674 437 ТОВ, 1 513 ТДВ'
      - '01.01.2026: 13 451 АТ, 836 712 ТОВ, 1 485 ТДВ'
      - 'Тренд: АТ — мінус 451, близько 3,2 %; ТОВ — плюс 162 275, близько 24,1 %'
      - Реєстрова кількість — зареєстровані, а не діючі суб’єкти
      - Дані не охоплюють окуповану територію АР Крим і м. Севастополя
      - Рядки за типами АТ у таблицях до 2021 р. і з 2022 р. непорівнянні
    sources: [ukrstat-opfg-2020, ukrstat-sdmx-2026, oecd-ukraine-2025]
    notes: >-
      Пояснення: акціонерна форма в Україні майже не зростає, а ТОВ зростає стабільно, і пояснення видно
      з попередніх розділів — поріг капіталу, депозитарна система, складніші процедури й розкриття. Найтонше
      застереження третє: у таблицях до 2021 р. є рядки «публічне» і «приватне акціонерне товариство», а з 2022 р. —
      «Відкрите» і «Закрите акціонерне товариство»; це рядки статистичного класифікатора, а не типи за законом.
      Заразом це чудова ілюстрація теми: назви «відкрите» і «закрите» живуть у класифікаторі, хоча в праві їх немає
      з 2023 р. Приклад для контексту: за звітом ОЕСР 2025 р. понад 60 % компаній, акції яких торгувалися на біржах
      України, мають єдиного власника з пакетом понад 50 %, але це дані лише про біржові компанії. Питання до
      аудиторії: за якими критеріями ви обрали б форму для свого бізнесу — назвіть три.

  - id: ownership-ubo
    type: figure
    title: Хто стоїть за товариством
    figure: fig-04-ownership-ubo.svg
    caption: 'Рисунок 4. Структура власності товариства і кінцеві бенефіціарні власники в Єдиному державному реєстрі.'
    sources: [law-361-ix, law-755-iv]
    notes: >-
      Пояснення: обрана форма і структура власності не залишаються приватною справою засновників. Юридичні особи
      зобов’язані мати інформацію про кінцевого бенефіціарного власника і структуру власності та подавати її до ЄДР,
      повідомляючи про зміни протягом 30 робочих днів. Відомості реєстру відкриті, крім реєстраційного номера
      облікової картки платника податків і паспортних даних. На схемі розберіть три ролі: фізична особа, яка
      контролює через ланцюг володіння; фізична особа, частка якої досягає порога прямо; номінальний утримувач,
      який має формальне володіння, але бенефіціаром бути не може. Приклад значення для практики: поки невідомо,
      хто стоїть за компанією-постачальником, не можна перевірити, чи є вона пов’язаною особою, а отже не працює
      контроль правочинів із заінтересованістю. Питання до аудиторії: кому ця відкритість корисна, крім держави?

  - id: case-tesla
    type: case
    title: Tesla — акціонери змінюють штат реєстрації
    case: tesla
    facts:
      - 30.01.2024 Court of Chancery Делаверу скасував пакет винагороди 2018 р. за стандартом entire fairness
      - '13.06.2024 річні збори схвалили перереєстрацію до Техасу: 2 000 873 803 «за» і 293 910 071 «проти»'
      - 02.12.2024 суд відмовив переглянути рішення на підставі ратифікації і присудив адвокатам 345 млн дол. США
      - 19.12.2025 Верховний суд Делаверу скасував засіб захисту, присудив 1 дол. США і зменшив гонорар до 54 млн
      - Питання entire fairness і ратифікації вищий суд остаточно не переглядав
    question: Що саме обирали акціонери Tesla, голосуючи за перереєстрацію, і чи можливий такий вибір для українського товариства?
    sources: [harvard-tornetta-2024, tesla-8k-2024, gibson-dunn-tesla-2025, tesla-10ka-2026]
    notes: >-
      Пояснення: обирали не форму — Tesla як була, так і лишилася корпорацією. Обирали право, за яким ця корпорація
      живе: норми про фідуціарні обов’язки директорів, стандарти перевірки угод з конфліктом інтересів, доступні
      акціонерам позови і суд, який усе це застосовує. У США корпоративне право встановлюють штати, і між ними є
      конкуренція за реєстрації; в Україні корпоративне право єдине для всієї держави, тож українське товариство
      не може обрати інші правила про вихід учасника чи про правочини із заінтересованістю. Наш аналог вибору —
      вибір між ТОВ і АТ, наповнення статуту, а для транскордонних груп — країна материнської компанії. Один виняток:
      сторони корпоративного договору в ТОВ можуть обрати право, яке застосовується до самого договору. Застереження:
      текст рішення Верховного суду Делаверу не відкрився, положення наведено за оглядом Gibson Dunn і формою 10-K/A.
      Питання до аудиторії: чи достатньо схвалення більшістю акціонерів, щоб зняти конфлікт інтересів контролюючої
      особи? Порівняйте з українською процедурою, де заінтересований акціонер не голосує (тема 6).

  - id: case-openai
    type: case
    title: OpenAI — некомерційний контроль і корпорація суспільної користі
    case: openai
    facts:
      - Вихідна структура — некомерційна рада як керівний орган усієї діяльності з обов’язком перед статутною місією
      - 17.11.2023 рада усунула генерального директора; 21.11.2023 досягнуто домовленості про його повернення
      - 08.03.2024 перевірка WilmerHale — приватна, на замовлення компанії, а не рішення суду
      - 05.05.2025 оголошено перетворення комерційної структури на корпорацію суспільної користі
      - '28.10.2025 рекапіталізація завершена: фонд — 26 %, Microsoft — близько 27 %, працівники та інвестори — 47 %'
      - 18.05.2026 позов Маска відхилено через пропуск строку позовної давності, по суті суд не висловлювався
    question: Яку проблему вирішувала конструкція «некомерційна організація контролює комерційну» і що змінила корпорація суспільної користі?
    sources: [cls-blue-sky-openai-2024, abc-openai-timeline-2023, aljazeera-openai-board-2024, techcrunch-openai-pbc-2025, techcrunch-openai-recap-2025, aljazeera-openai-verdict-2026]
    notes: >-
      Пояснення: вирішували ту саму задачу, що й будь-який установчий документ, тільки в крайній формі — як зробити,
      щоб мета компанії не зводилася до прибутку інвесторів. Відповідь: поставити над комерційним бізнесом
      некомерційну раду з фідуціарним обов’язком перед місією. Події листопада 2023 р. показали ціну такого дизайну:
      рада мала повноваження і скористалася ними, але формальні повноваження й фактична влада виявилися різними
      речами — працівники, стратегічний інвестор і ринок праці разом переважили рішення вищого за статутом органу.
      Корпорація суспільної користі — прибуткова корпорація, статут якої зобов’язує директорів враховувати визначену
      суспільну мету поряд з інтересами акціонерів; суспільна мета переїхала зі зовнішнього наглядача всередину
      статуту. Український кут: прямого аналога немає, найближче — зафіксувати мету й порядок призначення керівництва
      в статуті та корпоративному договорі. Питання до аудиторії: якій українській організації такий інструмент
      знадобився б найбільше?

  - id: case-privatbank
    type: case
    title: ПриватБанк — межі правового захисту
    case: privatbank
    facts:
      - 15.11.2023 апеляційний суд скасував рішення першої інстанції у справі про оскарження націоналізації
      - 26.02.2025 Верховний Суд залишив постанову апеляції в силі, провадження закрито
      - Законність рішень 2016 р. по суті в цих постановах не оцінювали
      - 10.11.2025 у Високому суді Англії та Уельсу стягнуто понад 3 млрд дол. США
      - 22.05.2026 Апеляційний суд Англії та Уельсу одноголосно відхилив апеляцію
    question: Якщо ви пишете статут і корпоративний договір, у якому суді та за яким правом ви розраховуєте їх захищати?
    sources: [suspilne-privatbank-2025, essex-court-privatbank-2025, blackstone-privatbank-2026]
    notes: >-
      Пояснення: правова форма і статут дають інструменти, але не гарантують результату — суд може й не дійти до
      суті спору. Паралельно з українськими провадженнями тривав процес в Англії та Уельсу, і там суми стягнуто.
      Для нашої теми звідси один практичний висновок: обираючи форму і пишучи установчі документи, варто одразу
      питати, де і за яким правом ці домовленості доведеться захищати. Застереження про статус фактів: дані про
      пов’язане кредитування, які ви бачили в темі 1, є позицією Національного банку, а не висновком суду.
      Приклад для обговорення: інвестор з Нідерландів вкладає гроші в українське ТОВ — які два пункти він поставить
      у корпоративний договір першими? Питання до аудиторії: чи допоміг би тут вибір права для корпоративного
      договору, про який ішлося в кейсі Tesla?

  - id: summary
    type: summary
    title: Що запам’ятати з теми 3
    bullets:
      - Господарський кодекс утратив чинність 28.08.2025 — з дня введення в дію Закону № 4196-IX
      - 'АТ має лише два типи: публічне і приватне; мінімум капіталу — 200 мінімальних зарплат'
      - 'ТОВ і ТДВ: мінімуму капіталу немає, кількість учасників не обмежена, наглядова рада за статутом'
      - Вихід з часткою менше 50 % вільний, з часткою 50 % і більше — за згодою інших
      - 'Статут публічний і робить вибір; корпоративний договір конфіденційний і зобов’язує сторони'
      - Незалежно від форми товариство розкриває кінцевого бенефіціарного власника в ЄДР
    sources: [law-4196-ix, law-2465-ix, law-2275-viii, law-361-ix]
    notes: >-
      Закрийте лекцію поверненням до стартапу з першого слайда. Троє засновників з інвестором майже напевно оберуть
      ТОВ: поріг входу нульовий, процедури швидші, розкриття мінімальне. Але тоді вони мають одразу домовитися про
      строк виплати частки при виході, про переважне право і про те, що з домовленостей з інвестором піде в статут,
      а що — в корпоративний договір. Саме це ви робитимете на практичній 2. Домашнє завдання: СРС 3.1 — таблиця
      порівняння ТОВ і АТ за шістьма рядками; СРС 3.2 — розрахунок за таблицями Держстату; СРС 3.3 — вісім умов
      стартапу, розподілених між статутом і договором. Питання до аудиторії наостанок: яку одну норму з теми ви
      вважаєте найнебезпечнішою для засновника, який про неї не знає?
