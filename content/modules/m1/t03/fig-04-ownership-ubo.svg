  <circle class="refc" cx="580" cy="28" r="11"/><text class="refn" x="580" y="32">2</text>
  <circle class="refc" cx="20" cy="124" r="11"/><text class="refn" x="20" y="128">3</text>
  <circle class="refc exam" cx="233" cy="124" r="11"/><text class="refn exam-n" x="233" y="128">4</text>
  <circle class="refc" cx="164" cy="224" r="11"/><text class="refn" x="164" y="228">5</text>
  <circle class="refc" cx="20" cy="318" r="11"/><text class="refn" x="20" y="322">6</text>
</svg>
