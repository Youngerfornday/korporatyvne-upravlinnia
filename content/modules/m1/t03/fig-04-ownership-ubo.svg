<svg xmlns="http://www.w3.org/2000/svg" id="fig-t03-4" class="scheme" viewBox="0 0 600 420" role="img" aria-labelledby="fig-t03-4-title fig-t03-4-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t03-4-title">Рисунок 4. Структура власності товариства і кінцеві бенефіціарні власники в ЄДР</title>
  <desc id="fig-t03-4-desc">Умовний приклад структури власності. Угорі ліворуч фізична особа А, якій належить 100 відсотків іноземної компанії Holding Ltd; цій компанії належить 55 відсотків статутного капіталу ТОВ «Альфа» в Україні. Угорі праворуч фізична особа Б, якій прямо належить 25 відсотків того самого ТОВ. Посередині карміновим позначено номінального утримувача з часткою 20 відсотків: формальне володіння він має, але кінцевим бенефіціарним власником бути не може. Отже, бенефіціарами є двоє: А — через ланцюг володіння, Б — прямо, бо обидві частки досягають порога в 25 відсотків. Унизу блок «Єдиний державний реєстр»: товариство подає відомості про кінцевого бенефіціарного власника і структуру власності, реєструє зміни протягом 30 робочих днів з дня їх виникнення, а самі відомості реєстру відкриті й безоплатні, крім реєстраційного номера облікової картки платника податків і паспортних даних.</desc>
  <style>
    #fig-t03-4 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t03-4 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t03-4 .t { fill: var(--ink, #0f1c2e); font-size: 14px; font-weight: 650; }
    #fig-t03-4 .s { fill: var(--ink-2, #445570); font-size: 11.5px; }
    #fig-t03-4 .lbl { fill: var(--ink-2, #445570); font-size: 12px; font-weight: 650; }
    #fig-t03-4 .arrow { stroke: var(--ink-2, #445570); stroke-width: 1.25; fill: none; }
    #fig-t03-4 .arrow-head { fill: var(--ink-2, #445570); }
    #fig-t03-4 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t03-4 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t03-4 .exam { stroke: var(--err, #b42318); }
    #fig-t03-4 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 11.5px; font-weight: 600; }
    #fig-t03-4 .refn.exam-n { fill: var(--err-ink, #8f1d14); }
  </style>

  <rect class="box box-owner" x="36" y="10" width="180" height="52" rx="6"/>
  <text class="t" x="52" y="32">Фізична особа А</text>
  <text class="s" x="52" y="50">кінцевий бенефіціар через ланцюг</text>

  <rect class="box box-owner" x="384" y="10" width="180" height="52" rx="6"/>
  <text class="t" x="400" y="32">Фізична особа Б</text>
  <text class="s" x="400" y="50">кінцевий бенефіціар прямо</text>

  <rect class="box" x="36" y="106" width="180" height="52" rx="6"/>
  <text class="t" x="52" y="128">Holding Ltd (Кіпр)</text>
  <text class="s" x="52" y="146">формальний власник частки</text>

  <rect class="box exam" x="250" y="106" width="180" height="52" rx="6"/>
  <text class="t" x="266" y="128">Номінальний утримувач</text>
  <text class="exam-t" x="266" y="146">бенефіціаром бути не може</text>

  <rect class="box box-owner" x="180" y="206" width="240" height="56" rx="6"/>
  <text class="t" x="300" y="230" text-anchor="middle">ТОВ «Альфа» (Україна)</text>
  <text class="s" x="300" y="249" text-anchor="middle">статутний капітал — 100 %</text>

  <path class="arrow" d="M126 62 L126 102"/>
  <polygon class="arrow-head" points="126,108 122,100 130,100"/>
  <text class="lbl" x="134" y="88">100 %</text>

  <path class="arrow" d="M126 158 L126 234 L174 234"/>
  <polygon class="arrow-head" points="180,234 172,230 172,238"/>
  <text class="lbl" x="134" y="200">55 %</text>

  <path class="arrow" d="M340 158 L340 200"/>
  <polygon class="arrow-head" points="340,206 336,198 344,198"/>
  <text class="lbl" x="348" y="186">20 %</text>

  <path class="arrow" d="M474 62 L474 234 L426 234"/>
  <polygon class="arrow-head" points="420,234 428,230 428,238"/>
  <text class="lbl" x="482" y="150">25 %</text>

  <path class="arrow" d="M300 262 L300 294"/>
  <polygon class="arrow-head" points="300,300 296,292 304,292"/>

  <rect class="box" x="36" y="300" width="528" height="100" rx="6"/>
  <text class="t" x="52" y="324">Єдиний державний реєстр</text>
  <text class="s" x="52" y="346">товариство подає відомості про кінцевого бенефіціарного власника і структуру власності</text>
  <text class="s" x="52" y="364">зміни реєструють протягом 30 робочих днів з дня їх виникнення</text>
  <text class="s" x="52" y="382">відомості відкриті й безоплатні, крім РНОКПП і паспортних даних</text>

