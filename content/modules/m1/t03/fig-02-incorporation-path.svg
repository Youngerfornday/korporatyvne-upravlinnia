<svg xmlns="http://www.w3.org/2000/svg" id="fig-t03-2" class="scheme" viewBox="0 0 600 424" role="img" aria-labelledby="fig-t03-2-title fig-t03-2-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t03-2-title">Рисунок 2. Шлях створення ТОВ і акціонерного товариства</title>
  <desc id="fig-t03-2-desc">Дві паралельні колонки — ТОВ ліворуч і акціонерне товариство праворуч — і п’ять спільних кроків. Крок 1: рішення засновників про створення і затвердження статуту; для АТ статут одразу визначає тип товариства і вид структури управління. Крок 2: статутний капітал — для ТОВ мінімуму немає, вклад вноситься протягом шести місяців з реєстрації, для АТ мінімум становить 200 мінімальних зарплат на день створення, тобто 1 729 400 гривень у 2026 році. Крок 3: державна реєстрація в Єдиному державному реєстрі з поданням відомостей про кінцевого бенефіціарного власника і структуру власності — однаково для обох форм. Крок 4: органи управління — у ТОВ загальні збори учасників і директор, наглядова рада лише якщо її передбачив статут; в АТ статут обирає дворівневу структуру із загальними зборами, наглядовою радою і виконавчим органом або однорівневу з радою директорів. Крок 5 відрізняється: у ТОВ акцій немає, частку продають з дотриманням переважного права інших учасників, а в АТ акції іменні й електронні, обліковуються в депозитарній системі, і публічне товариство додатково має пройти допуск акцій до торгів на організованому ринку. Останній крок для АТ позначено карміновим як найбільшу відмінність між формами.</desc>
