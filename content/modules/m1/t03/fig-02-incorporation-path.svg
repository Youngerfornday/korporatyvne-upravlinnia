  <rect class="box box-owner" x="36" y="10" width="258" height="32" rx="6"/>
  <text class="head" x="165" y="31" text-anchor="middle">ТОВ і ТДВ</text>
  <rect class="box box-owner" x="306" y="10" width="258" height="32" rx="6"/>
  <text class="head" x="435" y="31" text-anchor="middle">Акціонерне товариство</text>

  <rect class="box" x="36" y="54" width="258" height="58" rx="6"/>
  <text class="t" x="52" y="75">Рішення засновників</text>
  <text class="s" x="52" y="95">створення і затвердження статуту</text>
  <rect class="box" x="306" y="54" width="258" height="58" rx="6"/>
  <text class="t" x="322" y="75">Рішення про створення</text>
  <text class="s" x="322" y="95">статут одразу визначає тип і структуру</text>

  <rect class="box" x="36" y="124" width="258" height="58" rx="6"/>
  <text class="t" x="52" y="145">Статутний капітал</text>
  <text class="s" x="52" y="165">мінімуму немає; вклад — 6 місяців</text>
  <rect class="box" x="306" y="124" width="258" height="58" rx="6"/>
  <text class="t" x="322" y="145">Статутний капітал</text>
  <text class="s" x="322" y="165">200 МЗП — 1 729 400 грн у 2026 р.</text>

  <rect class="box box-owner" x="36" y="194" width="528" height="58" rx="6"/>
  <text class="t" x="52" y="215">Державна реєстрація — однакова для обох форм</text>
  <text class="s" x="52" y="235">ЄДР: статут, відомості про кінцевого бенефіціарного власника і структуру власності</text>

  <rect class="box" x="36" y="264" width="258" height="58" rx="6"/>
  <text class="t" x="52" y="285">Органи</text>
  <text class="s" x="52" y="305">збори учасників і директор; НР — за статутом</text>
  <rect class="box" x="306" y="264" width="258" height="58" rx="6"/>
  <text class="t" x="322" y="285">Органи</text>
  <text class="s" x="322" y="305">збори + НР + ВО або рада директорів</text>

  <rect class="box" x="36" y="334" width="258" height="64" rx="6"/>
  <text class="t" x="52" y="355">Акцій немає — лише частки</text>
  <text class="s" x="52" y="374">частку продають з дотриманням</text>
  <text class="s" x="52" y="390">переважного права інших учасників</text>
  <rect class="box exam" x="306" y="334" width="258" height="64" rx="6"/>
  <text class="t" x="322" y="355">Акції та депозитарна система</text>
  <text class="exam-t" x="322" y="374">акції іменні й лише електронні; ПАТ</text>
  <text class="exam-t" x="322" y="390">проходить допуск акцій до торгів</text>

