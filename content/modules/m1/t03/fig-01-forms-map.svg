  <circle class="refc" cx="16" cy="112" r="11"/><text class="refn" x="16" y="116">2</text>
  <circle class="refc" cx="584" cy="112" r="11"/><text class="refn" x="584" y="116">3</text>
  <circle class="refc" cx="16" cy="228" r="11"/><text class="refn" x="16" y="232">4</text>
  <circle class="refc" cx="584" cy="228" r="11"/><text class="refn" x="584" y="232">5</text>
  <circle class="refc exam" cx="16" cy="334" r="11"/><text class="refn exam-n" x="16" y="338">6</text>
</svg>
