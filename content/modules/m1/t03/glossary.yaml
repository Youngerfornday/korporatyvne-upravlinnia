# Глосарій теми 3 «Правове поле корпоративного бізнесу». ID і назви — з реєстру glossaryTerms у course.yaml.
# forms — словоформи для пошуку й підказок (називний, родовий, множина); seeAlso — лише зареєстровані терміни.
topic: t03
terms:
  - id: business-company
    term: Господарське товариство
    definition: >-
      Юридична особа, статутний капітал якої поділено на частки учасників і яка відповідає за своїми зобов’язаннями
      власним майном. Після втрати чинності Господарським кодексом 28.08.2025 це основна конструкція приватного
      бізнесу з кількома власниками: акціонерні товариства за Законом № 2465-IX, товариства з обмеженою і з
      додатковою відповідальністю за Законом № 2275-VIII.
    synonyms: [товариство, компанія з поділеним на частки капіталом]
    forms:
      - господарське товариство
      - господарського товариства
      - господарському товариству
      - господарським товариством
      - господарські товариства
      - господарських товариств
    seeAlso: [joint-stock-company, limited-liability-company, additional-liability-company, corporate-rights]

  - id: joint-stock-company
    term: Акціонерне товариство
    definition: >-
      Господарське товариство, статутний капітал якого поділено на акції — іменні електронні цінні папери, що
      обертаються без згоди інших акціонерів. Мінімальний статутний капітал — 200 розмірів мінімальної заробітної
      плати на день створення товариства. Закон знає лише два типи — публічне і приватне; акціонер може бути й один.
    synonyms: [АТ, акціонерна компанія]
    forms:
      - акціонерне товариство
      - акціонерного товариства
      - акціонерному товариству
      - акціонерним товариством
      - акціонерні товариства
      - акціонерних товариств
      - АТ
    seeAlso: [business-company, public-joint-stock-company, private-joint-stock-company, authorized-capital]

  - id: public-joint-stock-company
    term: Публічне акціонерне товариство
    definition: >-
      Тип акціонерного товариства, щодо акцій якого була здійснена публічна пропозиція та/або акції якого допущені
      до торгів на організованому ринку капіталу. Ознака публічності — дія на ринку капіталу, а не розмір чи форма
      власності. Створюється лише зміною типу з приватного або перетворенням іншого господарського товариства;
      зобов’язане мати допуск акцій до торгів і розкриває інформацію в найбільшому обсязі.
    synonyms: [ПАТ, публічне товариство]
    forms:
      - публічне акціонерне товариство
      - публічного акціонерного товариства
      - публічному акціонерному товариству
      - публічні акціонерні товариства
      - ПАТ
    seeAlso: [joint-stock-company, private-joint-stock-company, corporate-agreement]

  - id: private-joint-stock-company
    term: Приватне акціонерне товариство
    definition: >-
      Тип акціонерного товариства, щодо акцій якого не було публічної пропозиції і акції якого не допущені до торгів
      на організованому ринку. Типова форма великого бізнесу з кількома власниками: обіг акцій вільний, але коло
      власників визначене, а вимоги до розкриття інформації нижчі, ніж у публічного товариства. Статут приватного
      товариства може розширити компетенцію загальних зборів.
    synonyms: [ПрАТ, приватне товариство]
    forms:
      - приватне акціонерне товариство
      - приватного акціонерного товариства
      - приватному акціонерному товариству
      - приватні акціонерні товариства
      - ПрАТ
    seeAlso: [joint-stock-company, public-joint-stock-company, articles-of-association]

  - id: limited-liability-company
    term: Товариство з обмеженою відповідальністю
    definition: >-
      Господарське товариство, статутний капітал якого поділено на частки, а учасники не відповідають за його
      зобов’язаннями — крім тих, хто не вніс вклад повністю: вони солідарно відповідають у межах невнесеної частини.
      Мінімального розміру статутного капіталу закон не встановлює, кількість учасників не обмежується, наглядова
      рада утворюється лише за статутом. Найпоширеніша форма українського бізнесу.
    synonyms: [ТОВ, товариство з обмеженою відповідальністю (ТОВ)]
    forms:
      - товариство з обмеженою відповідальністю
      - товариства з обмеженою відповідальністю
      - товариству з обмеженою відповідальністю
      - товариством з обмеженою відповідальністю
      - ТОВ
    seeAlso: [business-company, additional-liability-company, participant-withdrawal, authorized-capital]

  - id: additional-liability-company
    term: Товариство з додатковою відповідальністю
    definition: >-
      Господарське товариство, яке живе за тими самими правилами, що й ТОВ, з однією відмінністю: крім вкладу,
      учасники солідарно несуть додаткову (субсидіарну) відповідальність за зобов’язаннями товариства своїм майном
      у розмірі, однаково кратному для всіх до вартості внесеного кожним вкладу; кратність визначає статут, бо закон
      конкретного числа не встановлює (ст. 56 Закону № 2275-VIII). За банкрутства одного з учасників його
      відповідальність розподіляється між іншими пропорційно часткам. На практиці форма рідкісна: на понад вісімсот
      тисяч ТОВ в Україні припадає менше двох тисяч ТДВ.
    synonyms: [ТДВ]
    forms:
      - товариство з додатковою відповідальністю
      - товариства з додатковою відповідальністю
      - товариству з додатковою відповідальністю
      - товариством з додатковою відповідальністю
      - ТДВ
    seeAlso: [limited-liability-company, business-company, authorized-capital]

  - id: authorized-capital
    term: Статутний капітал
    definition: >-
      Зафіксована в статуті й у реєстрі сума, на яку учасники зобов’язалися внести вклади, і водночас межа, нижче
      якої товариство не розподіляє прибуток. Визначає пропорції часток, а отже — вагу голосу і ціну входу нового
      інвестора. Для акціонерного товариства мінімум становить 200 розмірів мінімальної заробітної плати на день
      створення; для ТОВ і ТДВ мінімуму немає, а вклад вноситься протягом шести місяців з дня державної реєстрації.
    synonyms: [зареєстрований капітал, статутний фонд (застаріле)]
    forms:
      - статутний капітал
      - статутного капіталу
      - статутному капіталу
      - статутним капіталом
    seeAlso: [joint-stock-company, limited-liability-company, corporate-rights]

  - id: articles-of-association
    term: Статут
    definition: >-
      Єдиний установчий документ господарського товариства: його затверджують засновники, подають державному
      реєстратору, і він визначає внутрішній порядок життя товариства там, де закон залишає вибір. Орієнтир для
      пошуку таких місць — формула закону «якщо статут не встановлює іншого». Статут публічний, тому індивідуальні
      домовленості власників у нього не вміщують — для них є корпоративний договір.
    synonyms: [установчий документ, статут товариства]
    forms: [статут, статуту, статутом, статуті, статути, статутів]
    seeAlso: [corporate-agreement, business-company, corporate-rights]

  - id: corporate-agreement
    term: Корпоративний договір
    definition: >-
      Письмовий договір, за яким учасники (акціонери) зобов’язуються здійснювати корпоративні права узгоджено:
      голосувати певним чином у визначених ситуаціях, купувати чи продавати частки на обумовлених умовах або
      утримуватися від відчуження. Недодержання письмової форми робить його нікчемним; нікчемною є й умова
      голосувати за вказівками органів управління товариства. Зміст конфіденційний — крім факту укладення в ПАТ
      і договорів за участю держави чи громади з часткою від 25 % (ст. 29 Закону № 2465-IX, ст. 7 Закону № 2275-VIII).
    synonyms: [акціонерний договір, договір між учасниками, shareholders agreement]
    forms:
      - корпоративний договір
      - корпоративного договору
      - корпоративному договору
      - корпоративним договором
      - корпоративні договори
      - корпоративних договорів
    seeAlso: [articles-of-association, corporate-rights, public-joint-stock-company]

  - id: corporate-rights
    term: Корпоративні права
    definition: >-
      Сукупність правомочностей, що належать особі як учаснику (засновнику, акціонеру, пайовику) юридичної особи
      відповідно до закону та установчих документів товариства; набуваються з моменту набуття права власності на
      частку, акцію чи пай (ст. 96-1 Цивільного кодексу). Перелік правомочностей: участь в управлінні, участь у
      розподілі прибутку, вихід у випадках закону і установчого документа, відчуження частки або цінних паперів,
      інформація про діяльність, ліквідаційна квота. Права можна порушити, не відібравши частки, — наприклад, роками
      не скликаючи зборів. Окреме визначення для цілей оподаткування дає п. 14.1.90 Податкового кодексу.
    synonyms: [права учасника товариства, права акціонера]
    forms:
      - корпоративні права
      - корпоративних прав
      - корпоративними правами
      - корпоративним правам
      - корпоративне право учасника
    seeAlso: [business-company, authorized-capital, participant-withdrawal, corporate-agreement]

  - id: participant-withdrawal
    term: Вихід учасника з товариства
    definition: >-
      Припинення участі в ТОВ або ТДВ за заявою самого учасника з виплатою йому вартості частки. Учасник з часткою
      менше 50 % виходить будь-коли без згоди інших; з часткою 50 % і більше — лише за згодою решти, якщо статут
      одностайним рішенням не дозволив інше. Вартість частки повідомляють протягом 30 днів і виплачують протягом
      року (ст. 24 Закону № 2275-VIII). Вихід, після якого не залишиться жодного учасника, заборонено. В акціонерному товаристві виходу немає —
      акціонер продає акції.
    synonyms: [вихід з ТОВ, припинення участі в товаристві]
    forms:
      - вихід учасника з товариства
      - виходу учасника з товариства
      - вихід учасника
      - вихід з товариства
      - виходу з товариства
    seeAlso: [limited-liability-company, corporate-rights, additional-liability-company]

  - id: public-benefit-corporation
    term: Корпорація суспільної користі
    definition: >-
      Форма прибуткової корпорації у праві США (public benefit corporation, PBC), статут якої додатково зобов’язує
      директорів зважати на визначену суспільну мету поряд з інтересами акціонерів. Прямого аналога в українському
      праві немає: господарські товариства створюються заради прибутку, а неприбуткові організації його не
      розподіляють. Відома з реструктуризації OpenAI 2025 р., коли комерційну структуру перетворили на PBC під
      контролем некомерційної організації.
    synonyms: [PBC, public benefit corporation, корпорація суспільного блага]
    forms:
      - корпорація суспільної користі
      - корпорації суспільної користі
      - корпорацію суспільної користі
      - корпорацією суспільної користі
      - PBC
    seeAlso: [joint-stock-company, articles-of-association, business-company]
