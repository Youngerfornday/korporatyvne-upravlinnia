# Презентація теми 2 «Моделі корпоративного управління та міжнародні стандарти»: 28 слайдів на 2 академічні години.
# Схема: src/content/schemas/slides.ts. Зміст — лише з лонгріда теми (lecture.mdx); норми — з docs/research/legal-baseline.md
# з кодом рядка; кожне число — з джерелом у sources (ID з sources.yaml). Текст слайда — тези; пояснення, приклад
# і питання до аудиторії — у notes.
topic: t02
slides:
  - id: title
    type: title
    subtitle: Хто контролює компанію і як захищені ті, хто нею не керує
    sources: [franks-mayer-1992]
    notes: >-
      Почніть із задачі, яку студент може уявити. Аналітик за один вечір читає три річні звіти автовиробників.
      У першому — рада з чотирнадцяти директорів, одинадцять з яких незалежні, а голова ради й головний виконавчий
      директор — різні люди. У другому — два окремі органи: правління веде бізнес, наглядова рада з двадцяти осіб
      його контролює, і половина цієї ради — представники працівників. У третьому — компанія, яка володіє чвертю
      акцій власної компанії-засновниці. Питання до аудиторії: три компанії роблять те саме і борються за тих самих
      покупців — чому ж керуються вони так по-різному? Відповідь шукаємо впродовж лекції.

  - id: outcomes
    type: outcomes
    title: Що ви зможете після лекції
    notes: >-
      Назвіть чотири результати й покажіть, де кожен перевіряється. Ознаки чотирьох моделей і структура Принципів
      G20/ОЕСР — у самоперевірці лонгріда й тренувальному тесті. Уміння визначити модель за описом компанії —
      у практичній 1, де ви складатимете матрицю ознак і визначатимете модель трьох компаній. Етапи розвитку
      корпоративного управління в Україні — у розборі українського кейсу наприкінці лекції. Питання до аудиторії:
      яку з чотирьох моделей ви очікуєте зустріти в компанії, де працюватимете після випуску?

  # 1. Інсайдерські й аутсайдерські системи
  - id: section-systems
    type: section
    number: 1
    title: Інсайдерські й аутсайдерські системи
    notes: >-
      Перш ніж перелічувати моделі, домовмося про вісь, уздовж якої вони шикуються. Питання одне: хто здатний
      змусити менеджмент діяти інакше — сторонні щодо компанії сили чи ті, хто вже всередині.

  - id: two-systems
    type: two-columns
    title: Дві системи, дві логіки контролю
    left:
      heading: Аутсайдерська система
      bullets:
        - Багато біржових компаній, власність розпорошена
        - 'Контролюють сторонні: акціонери, незалежна рада, покупець на біржі, регулятор'
        - Головний конфлікт — менеджмент проти акціонерів
    right:
      heading: Інсайдерські системи
      bullets:
        - Біржових компаній менше, великі пакети часто в інших компаній
        - 'Контролює той, хто вже всередині: власник, банк, партнер по групі, працівники'
        - Головний конфлікт — ті, хто контролює, проти решти інвесторів
    sources: [franks-mayer-1992, shleifer-vishny-1997]
    notes: >-
      Пояснення: поділ сформулювали Джуліан Франкс і Колін Маєр у 1992 р. В аутсайдерських системах Великої Британії
      та США контроль забезпечує ринок, в інсайдерських системах континентальної Європи і Японії — органи й комітети,
      у яких сидять ті самі великі власники. Огляд Шляйфера й Вішні 1997 р. описує ту саму різницю через фінансування:
      ринкові системи проти банкоцентричних; історичні характеристики подаємо в минулому часі. Приклад: якщо у вас
      0,001 % акцій, вивчати звітність нераціонально — вигоду від вашого контролю поділять усі, а витрати понесете
      тільки ви. Питання до аудиторії: хто в такій компанії насправді має стимул стежити за менеджментом?

  - id: concentration-data
    type: bullets
    title: Контрольованих компаній у світі більше, ніж розпорошених
    bullets:
      - 'Дані: 46 086 лістингових компаній зі 98 ринків, кінець 2024 р.'
      - У 44 % компаній світу три найбільші власники разом тримають понад 50 % капіталу
      - Європа — 53 %, Латинська Америка — 71 %, США — лише 17 %
      - У США в 53 % компаній три найбільші тримають разом від 10 % до 29 %
      - 'Власники у світі: інституційні інвестори 47 %, родини і стратегічні особи 7 %'
    sources: [oecd-factbook-2025]
    notes: >-
      Пояснення: картина Берлі й Мінза з теми 1 — про розпорошену власність — описує не світ, а радше один його кут.
      За даними OECD Corporate Governance Factbook 2025 типова компанія у світі має контролюючого власника.
      У Європі стратегічним фізичним особам і родинам належить 9 % капіталізації, у США — 5 %. Приклад: саме тому
      механізми, розраховані на конфлікт «менеджмент — акціонери», у більшості юрисдикцій б’ють повз ціль.
      Питання до аудиторії: якщо у вашій компанії є власник з 60 % голосів, від кого треба захищати інвестора?

  - id: cr3
    type: formula
    title: Проста міра, яка розводить дві системи
    formula: CR3 = частка 1-го + частка 2-го + частка 3-го найбільшого власника
    explanation:
      - 'Порогом у звітах ОЕСР слугує 50 %: більше — компанію вважають контрольованою'
      - Рахувати можна за капіталом або за голосами; для різних класів акцій результат відрізняється
      - 'Volkswagen AG, права голосу на 31.12.2025: 53,3 % + 20,0 % + 17,0 % = 90,3 %'
      - Компанія з індексним фондом на 8 % і десятьма найбільшими на 30 % не дотягне й до чверті
    sources: [oecd-factbook-2025, vw-shareholders-2025]
    notes: >-
      Пояснення: щоб порівнювати компанії, а не країни, потрібна одна проста міра — сумарна частка трьох найбільших
      власників. Саме її використовує ОЕСР. Приклад: у Volkswagen AG вільний обіг становить 9,7 % голосів, тож купити
      контроль на біржі неможливо — ринок корпоративного контролю там просто не працює. Питання до аудиторії:
      порахуйте CR3 для компанії, де найбільший акціонер має 8 %, — і скажіть, який механізм захисту інвестора
      в ній працюватиме найкраще.

  # 2. Чотири моделі
  - id: section-models
    type: section
    number: 2
    title: Чотири моделі корпоративного управління
    notes: >-
      Тепер розкладемо цю вісь на чотири впізнавані конструкції. Наголосіть одразу: модель визначає не країна
      реєстрації, а структура власності й спосіб, у який утримують контроль.

  - id: models-map
    type: figure
    title: Карта систем корпоративного управління
    figure: fig-01-systems-map.svg
    caption: Дві вісі класифікації — концентрація власності й роль банків і пов’язаних компаній — дають чотири моделі.
    sources: [oecd-factbook-2023, oecd-wp27-2022]
    notes: >-
      Пояснення: пройдіть схему згори вниз, для кожної моделі називаючи три речі — хто контролює, звідки капітал,
      який конфлікт головний. За даними Factbook 2023 у Німеччині три найбільші акціонери тримають понад 50 %
      капіталу у 59 % лістингових компаній, в Японії — лише у 28 %, хоча корпораціям там належить 22 % капіталу ринку.
      Приклад: японська компанія без контролюючого акціонера все одно інсайдерська, бо контроль тримає група.
      Питання до аудиторії: до якої смуги на цій карті ви віднесете українське акціонерне товариство?

  - id: anglo-american
    type: bullets
    title: Англо-американська модель
    bullets:
      - Розпорошена власність; головні акціонери — пенсійні, взаємні й індексні фонди
      - 'Однорівнева рада: виконавчі директори ведуть бізнес, невиконавчі наглядають'
      - Більшість незалежних директорів; голова ради і головний виконавчий директор — різні особи
      - 'HSBC Holdings plc на 06.05.2026: 14 директорів, з них 11 незалежних невиконавчих'
      - Зовнішня дисципліна — ринок корпоративного контролю, поглинання
    sources: [hsbc-board-2026, uk-cg-code-2024, oecd-factbook-2025]
    notes: >-
      Пояснення: індексний фонд не може продати акцію, коли йому не подобається менеджмент, — індекс зобов’язує
      тримати папір. Єдиний інструмент, що лишається, — голос на зборах; звідси політики залученості, радники
      з голосування й кампанії інвесторів-активістів, яким присвячено розділ III Принципів G20/ОЕСР 2023.
      Приклад: за даними Factbook 2025 інституційні інвестори володіють 47 % світового капіталу лістингових компаній.
      Питання до аудиторії: чому в цій моделі низька ціна акції є особистим ризиком для директора?

  - id: german
    type: bullets
    title: Німецька модель
    bullets:
      - Концентрована власність стратегічних власників — холдингів, засновників, публічної влади
      - 'Дворівнева структура: правління веде бізнес, наглядова рада його призначає й контролює'
      - Понад 2 000 працівників — половина наглядової ради від персоналу; понад 500 — третина
      - Історично — банківський кредит і «домашній банк» у наглядовій раді
      - 'Сьогодні: посередник голосує чужими акціями лише за дорученням і вказівками акціонера'
    sources: [oecd-factbook-2023, dcgk-2022, mitbestg-1976, drittelbg-2004, aktg-135, shleifer-vishny-1997]
    notes: >-
      Пояснення: паритет у наглядовій раді встановлює німецький Закон про співучасть 1976 р. (§ 1, § 7), третину —
      Закон про третинну участь 2004 р. Німецький кодекс корпоративного управління описує правління і наглядову раду
      як органи з різними повноваженнями, процедурами й винагородою. Обережно з тезою «банк голосує за вас
      автоматично»: § 135 німецького Закону про акціонерні товариства дозволяє посереднику голосувати чужими акціями
      лише за дорученням акціонера і за його вказівками або за заздалегідь розкритими пропозиціями. Питання
      до аудиторії: що співучасть працівників дає інвесторові і що вона в нього забирає?

  - id: board-structures
    type: figure
    title: Дві структури управління акціонерним товариством
    figure: fig-02-board-structures.svg
    caption: Розділення нагляду й управління є в обох; змінюється лише те, чи проходить межа між органами, чи всередині одного органу.
    sources: [law-2465-ix, dcgk-2022]
    notes: >-
      Пояснення: у дворівневій структурі наглядач сидить в іншому органі, ніж той, кого він наглядає, — конфлікт
      ролей знімається конструкцією, а не доброю волею. В однорівневій межа проходить усередині ради директорів,
      тому кодекси вимагають більшості незалежних і розведення посад голови ради та головного виконавчого директора.
      Приклад: українське право дозволяє обрати будь-яку з двох структур статутом. Питання до аудиторії: яку
      структуру ви порадите товариству з двома акціонерами і одним директором — і чому?

  - id: japanese
    type: bullets
    title: Японська модель — контроль групи
    bullets:
      - Кейрецу — група компаній, пов’язаних взаємними пакетами, постачанням і спільним банком
      - 'Контролюючого акціонера може не бути: у 28 % компаній три найбільші тримають понад половину'
      - Корпораціям належить 22 % капіталу ринку; перехресне володіння — 6,3 % капіталізації
      - Дружній акціонер на зборах партнера робить поглинання ззовні майже неможливим
      - Історично роль зовнішнього наглядача брав «головний банк» групи
    sources: [oecd-factbook-2023, oecd-wp27-2022, shleifer-vishny-1997, toyota-industries-2026, toyota-voting-2025]
    notes: >-
      Пояснення: механіка проста. Якщо компанія A тримає пакет компанії B, а B — пакет A, то на зборах кожної є
      акціонер, який голосуватиме за менеджмент. Приклад: Toyota Motor Corporation володіла 24,66 % акцій
      Toyota Industries — компанії-засновниці групи, яка сама була її акціонером; у 2025–2026 рр. цю компанію
      приватизували, а для оцінки умов угоди створили спеціальний комітет із трьох незалежних зовнішніх директорів.
      Паралельно у 2025 р. збори Toyota Motor 98,80 % голосів перевели компанію до структури «компанія
      з аудиторсько-наглядовим комітетом». Це паралельні факти: причинного зв’язку джерела не встановлюють.
      Питання до аудиторії: який механізм захисту інвестора слабне найпомітніше за перехресного володіння?

  - id: japanese-code
    type: bullets
    title: Кодекс корпоративного управління Японії
    bullets:
      - Видає Токійська фондова біржа; редакції 2015, 2018, 2021 і чинна від 21.07.2026
      - Ринок Prime — щонайменше третина незалежних директорів
      - Більшість незалежних — лише для компаній Prime з контролюючим акціонером або спеціальний комітет
      - Комітети з номінацій і винагород компаній Prime — більшість незалежних
      - Перехресні пакети розкривають з 2015 р.; з 2018 р. оцінюють кожен проти вартості капіталу
    sources: [jcgc-code-2026, jcgc-code-2015, jcgc-code-2018, fsa-cgc-revisions-2021, fsa-tse-overview-2026]
    notes: >-
      Пояснення: старе твердження «японські ради без зовнішніх директорів» сьогодні хибне. Обережно і з новим
      штампом: заголовки медіа влітку 2026 р. писали, що для ринку Prime потрібна більшість незалежних директорів, —
      офіційний текст кодексу цього не підтверджує. Теза про більшість є лише орієнтиром на майбутнє в огляді,
      що супроводжує редакцію. Приклад: перегляд 2021 р. додав матрицю навичок ради, цілі різноманіття
      й розкриття кліматичних ризиків. Питання до аудиторії: чому вимога оцінювати кожен перехресний пакет проти
      вартості капіталу небезпечна саме для групового контролю?

  - id: family
    type: bullets
    title: Сімейна модель
    bullets:
      - 'Родина утримує контроль незалежно від частки: угода про голосування, піраміда, класи акцій'
      - Західна Європа — близько 44 % сімейних компаній проти 45 % з розпорошеною власністю
      - Без Великої Британії співвідношення стає 56 % проти 28 %
      - Родина серед ключових осіб приблизно в третині компаній S&P 500
      - 'Сильний бік — довгий горизонт; слабкий — тунелювання і результати під керівництвом нащадків'
    sources: [villalonga-amit-2020, oecd-factbook-2025, oecd-wp27-2022]
    notes: >-
      Пояснення: за даними Factbook 2025 стратегічним фізичним особам і родинам належить 7 % світової капіталізації.
      Родини дають фірмам «терплячий капітал», платять нижчі зарплати, але рідше звільняють. Обережно з популярною
      тезою «лише 30 % сімейних фірм доживають до другого покоління»: у рецензованому огляді Вілалонги й Аміта прямо
      зазначено, що вона не підтверджена емпіричними даними. Приклад механізмів контролю — піраміди й подвійні класи
      акцій з робочого документа ОЕСР. Питання до аудиторії: чим сімейна компанія небезпечна для міноритарія
      і чим вона для нього приваблива?

  - id: independent-directors
    type: norm
    title: 'Незалежні директори: загальне правило і правило для держави'
    text: >-
      У публічному товаристві незалежними директорами має бути не менше однієї третини складу наглядової ради,
      але не менше двох осіб. В акціонерному товаристві, у якому державі належить 50 % і більше акцій, незалежні
      директори мають становити більшість складу наглядової ради; на банки це правило не поширюється.
    lawRef:
      act: Закон України «Про акціонерні товариства» від 27.07.2022 № 2465-IX
      article: ст. 72 ч. 4 (AT-49)
      checkedAt: '2026-09-15'
      url: https://zakon.rada.gov.ua/laws/show/2465-20#n875
    sources: [law-2465-ix]
    notes: >-
      Пояснення: правило для товариств з державною часткою суворіше, і зрозуміло чому — там, де власник один
      і він же держава, третини незалежних замало. Те саме встановлює Закон «Про управління об’єктами державної
      власності» для наглядових рад державних підприємств: від 5 до 9 осіб, більшість незалежних, строк три роки.
      Приклад: саме за цим правилом формували наглядову раду «Енергоатому» у 2026 р. — чотири незалежні члени
      і три представники держави. Питання до аудиторії: чому незалежна більшість потрібніша там, де акціонер один?

  # 3. Міжнародні стандарти і кодекси
  - id: section-standards
    type: section
    number: 3
    title: Міжнародні стандарти і кодекси
    notes: >-
      Від опису практики переходимо до орієнтирів. Принципи адресовані державам, кодекси — компаніям, і працюють
      вони різними способами: перші через законодавця, другі через обов’язок пояснити відхилення.

  - id: oecd-principles
    type: figure
    title: Шість розділів Принципів G20/ОЕСР 2023
    figure: fig-03-oecd-principles.svg
    caption: Кожен розділ відповідає на питання, поставлене однією з моделей; розділ VI — новий у редакції 2023 р.
    sources: [oecd-principles-2023]
    notes: >-
      Пояснення: уперше Принципи видано 1999 р., попередня редакція вийшла 2015 р., чинна опублікована 11.09.2023 —
      її прийняла Рада ОЕСР на міністерському рівні в червні 2023 р. і схвалили лідери G20 у вересні того ж року.
      Принципи не є обов’язковими. Розділ II — відповідь інсайдерським системам, розділ III — аутсайдерським,
      розділи I і IV потрібні всім. Обережно: твердження про «п’ять принципів ОЕСР» описує редакцію 1999 р.
      Питання до аудиторії: у якому розділі шукати захист міноритарія від контролюючого власника?

  - id: soe-guidelines
    type: norm
    title: Настанови ОЕСР щодо КУ державних підприємств
    text: >-
      Настанови доповнюють Принципи G20/ОЕСР і мають сім розділів: обґрунтування державної власності; роль держави
      як власника; державні підприємства на ринку; рівне ставлення до акціонерів та інших інвесторів; розкриття,
      прозорість і підзвітність; склад і відповідальність рад державних підприємств; державні підприємства
      і сталий розвиток.
    lawRef:
      act: OECD Guidelines on Corporate Governance of State-Owned Enterprises 2024
      article: розділи I–VII (MS-02)
      checkedAt: '2026-09-15'
      url: https://www.oecd.org/en/publications/oecd-guidelines-on-corporate-governance-of-state-owned-enterprises-2024_18a24f43-en.html
    sources: [oecd-soe-guidelines-2024]
    notes: >-
      Пояснення: уперше Настанови розроблено 2005 р., переглянуто 2015 р., чинна редакція — 2024 р.
      Держава як домінуючий власник успадковує всі проблеми інсайдерської системи і додає власну —
      політичні цілі, які змінюються швидше, ніж працює рада. Документ опубліковано 28.10.2024. Приклад:
      розділ VI про склад і відповідальність рад державних підприємств — саме та логіка, яку український закон
      втілив у вимозі незалежної більшості. Питання до аудиторії: хто в державній компанії грає роль міноритарія,
      якщо міноритаріїв немає зовсім?

  - id: codes
    type: bullets
    title: Кодекси і режим «дотримуйся або пояснюй»
    bullets:
      - Кодекс — звід рекомендованих практик від регулятора, біржі або об’єднання
      - Виконання забезпечує не санкція за відхилення, а обов’язок публічно його пояснити
      - Перший кодекс — звіт комітету Кедбері, грудень 1992 р., Велика Британія
      - 'Кодекс Великої Британії 2024 р.: п’ять розділів, застосовується з 01.01.2025'
      - 'SRD II зробила «м’яке право» частиною жорсткого: політика залученості інвесторів'
    sources: [cadbury-report-1992, uk-cg-code-2024, srd-ii-2017]
    notes: >-
      Пояснення: жорстка норма однаково не підійде компанії з тисячею акціонерів і компанії з трьома, а повна
      свобода не дасть інвесторові орієнтира. Режим пояснення перекладає оцінку на ринок. Приклад: Директива
      про права акціонерів у редакції SRD II вимагає політики залученості від інституційних інвесторів саме
      в режимі «дотримуйся або пояснюй», а також прозорості радників з голосування, голосування щодо політики
      і звіту про винагороду та затвердження правочинів з пов’язаними сторонами; строк транспозиції — до 10.06.2019.
      Питання до аудиторії: чи є пояснення відхилення поразкою компанії?

  - id: cg-report-ua
    type: norm
    title: Звіт про корпоративне управління — обов’язок пояснювати в Україні
    text: >-
      Звіт про корпоративне управління містить посилання на кодекс, який застосовує емітент (власний, кодекс
      оператора ринку чи об’єднання або Кодекс НКЦПФР), і пояснення відхилень від нього та причин незастосування
      окремих положень, а також інформацію про загальні збори, склад ради, виконавчого органу і комітетів,
      характеристики внутрішнього контролю, власників значних пакетів і обмеження прав голосу.
    lawRef:
      act: Закон України «Про ринки капіталу та організовані товарні ринки» від 23.02.2006 № 3480-IV
      article: ст. 127 ч. 3 (RK-13)
      checkedAt: '2026-09-15'
      url: https://zakon.rada.gov.ua/laws/show/3480-15#n4344
    sources: [law-3480-iv, nssmc-cg-code-2020]
    notes: >-
      Пояснення: рекомендаційну частину дає Кодекс корпоративного управління НКЦПФР (рішення № 118 від 12.03.2020)
      із сімома розділами, обов’язкову — закон. Застереження: Кодекс відображає законодавство станом на 01.01.2020
      і спирається на попередній закон про акціонерні товариства, тому його розділ «Вимоги» треба звіряти з чинним
      законом. Приклад: за звітом ОЕСР 2025 р. агрегованої інформації про дотримання Кодексу 2020 р. немає —
      жоден орган не збирає зведених даних. Питання до аудиторії: чи працює режим пояснення, якщо пояснення ніхто
      не читає?

  # 4. Україна
  - id: section-ukraine
    type: section
    number: 4
    title: Україна — етапи і модель
    notes: >-
      Останній блок: як українське корпоративне управління дійшло до чинного стану і до якої з моделей воно ближче.

  - id: ukraine-timeline
    type: figure
    title: Етапи розвитку корпоративного управління в Україні
    figure: fig-04-ukraine-timeline.svg
    caption: Кожен крок або змінював перелік форм і органів, або додавав прозорості — разом вони наближали конструкцію до орієнтирів ОЕСР.
    sources: [law-3587-ix, law-4196-ix, nssmc-cg-code-2020]
    notes: >-
      Пояснення: пройдіть таймлайн по кроках. 1991 р. — перший перелік форм, який для акціонерних товариств
      і товариств з обмеженою відповідальністю вже не застосовується. 2008 р. — публічні й приватні товариства
      замість відкритих і закритих. 2011 р. — регулятор змінив назву з ДКЦПФР на НКЦПФР. 2020 р. — перший
      національний кодекс. 2021 р. — звіт про корпоративне управління став складовою річної інформації емітента.
      2023 р. — чинна база курсу. 2024 р. — реформа державного сектору. 2025 р. — Господарський кодекс втратив
      чинність 28.08.2025. Питання до аудиторії: який із цих кроків найбільше змінив становище міноритарія?

  - id: board-structure-choice
    type: norm
    title: Українське право дозволяє обрати структуру управління
    text: >-
      Структуру управління визначає статут. За однорівневої структури діють загальні збори і рада директорів,
      до складу якої входять виконавчі і невиконавчі директори; частина невиконавчих може бути незалежними.
      За дворівневої структури діють загальні збори, наглядова рада і виконавчий орган. Зміна виду структури
      не є реорганізацією товариства.
    lawRef:
      act: Закон України «Про акціонерні товариства» від 27.07.2022 № 2465-IX
      article: ст. 4 ч. 1–6 (AT-03)
      checkedAt: '2026-09-14'
      url: https://zakon.rada.gov.ua/laws/show/2465-20
    sources: [law-2465-ix]
    notes: >-
      Пояснення: виняток щодо невиконавчих директорів у раді директорів установлює окремий випадок закону.
      Це і є українська відповідь на суперечку моделей — закон не нав’язує ані німецької, ані
      англо-американської конструкції. Приклад: для товариства з двома акціонерами і директором природніша
      однорівнева структура, для товариства із зовнішніми інвесторами й потребою в незалежному нагляді —
      дворівнева. Питання до аудиторії: чому законодавець вирішив не обирати за товариство?

  - id: ukraine-model
    type: bullets
    title: До якої моделі ближче Україна
    bullets:
      - Інструменти запозичено з усіх трьох моделей — вибір структури, незалежні директори, кодекс
      - Структура власності робить систему інсайдерською
      - Понад 60 % біржових компаній мають єдиного власника з пакетом понад 50 %
      - У юрисдикціях Factbook цей показник був близько 32 % у 2022 р.
      - 'Держава — найбільший власник: майже 50 % акцій і облігацій у біржових торгах'
    sources: [oecd-ukraine-2025, nssmc-cg-code-2020]
    notes: >-
      Пояснення: формально закон універсальний, фактично працюють механізми, розраховані на інсайдерські системи, —
      контроль правочинів із заінтересованістю, незалежні директори, права меншості. Застереження: дані ОЕСР
      стосуються лише компаній, акції яких торгувалися на біржах, а таких небагато; переносити їх на решту
      акціонерних товариств не можна. Для порівняння: у юрисдикціях Factbook держава володіла 11 % торгованих
      паперів. Питання до аудиторії: які з механізмів курсу ви назвете першочерговими для такої структури власності?

  - id: case-soe
    type: case
    title: Наглядові ради державних енергокомпаній
    case: soe-board-reform
    facts:
      - 22.02.2024 ухвалено Закон № 3587-IX; розроблявся з ЄС, ЄБРР, МВФ, ОЕСР і посольством США
      - 10.11.2025 НАБУ і САП повідомили про схему з відкатами 10–15 % (позиція обвинувачення)
      - 11.11.2025 уряд достроково припинив повноваження наглядової ради «Енергоатому»
      - 31.12.2025 номінаційний комітет зі спостерігачами від ЄС, ЄБРР та IFC обрав чотирьох незалежних
      - 28.01.2026 призначено раду з семи осіб — чотири незалежні й три представники держави
    question: Які ознаки інсайдерської системи видно в цьому кейсі і які інструменти Настанов ОЕСР у ньому застосовано?
    sources: [rada-law-3587-2024, law-185-v, nabu-midas-2025, lb-energoatom-board-2025, lb-energy-boards-plan-2025, lb-nomination-committee-2025, rbc-energoatom-board-2026, kmu-energoatom-gts-2026]
    notes: >-
      Пояснення: компанія з єдиним власником — крайній випадок інсайдерської системи. Конфлікту «менеджмент —
      акціонери» тут майже немає, бо менеджмент призначає власник; міноритаріїв немає зовсім, тому їхнє місце
      займають кредитори, міжнародні партнери й платники податків. Застосовані інструменти: незалежна більшість
      у раді, конкурсний добір через номінаційний комітет, незалежні спостерігачі, аудит і комплаєнс.
      17.11.2025 уряд затвердив план оновлення рад енергокомпаній, а 01.07.2026 завершив формування рад
      «Енергоатому» й Оператора ГТС. Найкрихкіше місце — дострокове припинення повноважень усього складу ради.
      Питання до аудиторії: рада, яку можна замінити швидко, наглядає краще чи обережніше?

  - id: case-volkswagen
    type: case
    title: Volkswagen AG — німецька модель у розрізі
    case: volkswagen
    facts:
      - 'Права голосу на 31.12.2025: холдинг 53,3 %, земля 20,0 %, фонд 17,0 %, вільний обіг 9,7 %'
      - Наглядова рада з 20 членів, половина — представники працівників
      - Спеціальний закон підвищує поріг для рішень зборів з трьох чвертей до понад чотирьох п’ятих
      - 30.09.2025 Федеральний верховний суд визнав нікчемними рішення зборів 2021 р.
      - '18.06.2026 збори схвалили нове врегулювання зі страховиками — 97,46 % поданих голосів'
    question: Які три ознаки німецької моделі видно в цій компанії, кого вони захищають і що роблять неможливим?
    sources: [vw-shareholders-2025, vw-agm-2026, vw-law-reuters-2024, vw-bgh-2025]
    notes: >-
      Пояснення: CR3 = 90,3 % голосів, вільний обіг менший за десяту частину — купити контроль на біржі неможливо,
      тому дисципліну забезпечують дворівнева структура і співучасть працівників. Рішення суду 2025 р. показує,
      що формальні права акціонерів мають значення навіть там, де результат голосування визначено наперед:
      зборам не вистачило належного порядку денного і повної інформації. Застереження: чинність вироку щодо
      колишніх менеджерів і стан процесу колишнього голови правління не підтверджено, його вина судом не встановлена;
      положення спеціального закону наведено за поясненням агентства. Питання до аудиторії: що в цій конструкції
      реально захищає власника дрібного пакета?

  - id: check-question
    type: question
    prompt: Компанія має 900 акціонерів; найбільший з них — індексний фонд, а десять найбільших разом не мають і третини капіталу; рада з дев’яти директорів, сім із них незалежні; інвестор-активіст публічно вимагає продати підрозділ. Яка це модель?
    options:
      - Англо-американська — розпорошена власність і однорівнева рада з більшістю незалежних
      - Німецька — наявність незалежних директорів і публічний тиск на раду
      - Сімейна — індексний фонд фактично є стратегічним власником
      - Японська — активіст діє як партнер по групі
    notes: >-
      Правильна відповідь — перша. Три ознаки збігаються: низька концентрація, один орган з більшістю незалежних
      і зовнішня дисципліна з боку інвестора-активіста. Розберіть хибні варіанти: німецьку модель упізнають
      за концентрованою власністю, двома органами і представниками працівників; стратегічний власник — той, хто
      утримує контроль, а частка в кілька відсотків контролю не дає; японську — за перехресним володінням усередині групи.
      Питання до аудиторії: які дві додаткові дані ви попросите, щоб перевірити свою відповідь?

  - id: summary
    type: summary
    title: Що варто забрати із заняття
    bullets:
      - Моделі розводить одне питання — хто контролює і як захищені ті, хто не контролює
      - CR3 понад 50 % означає контрольовану компанію і конфлікт «власник — міноритарії»
      - Дворівнева і однорівнева структури розв’язують ту саму задачу розділення нагляду й управління
      - Принципи G20/ОЕСР 2023 мають шість розділів; шостий — про сталий розвиток і стійкість
      - Кодекси працюють через обов’язок пояснити відхилення, а не через санкцію
      - Україна взяла інструменти всіх моделей, але за структурою власності лишається інсайдерською
    sources: [oecd-factbook-2025, oecd-ukraine-2025]
    notes: >-
      Підсумуйте лекцію одним рухом: спершу дивимося на власність, потім на органи, потім на те, чим забезпечується
      дисципліна, і лише наприкінці — на країну. Домашнє завдання: СРС 2.1 — конспект по двох реченнях на кожну
      модель; СРС 2.2 — порівняльна таблиця за п’ятьма ознаками з джерелами, підготовка до практичної 1;
      СРС 2.3 — тренувальний тест теми. Питання до аудиторії: яку ознаку ви перевірятимете першою, коли наступного
      разу відкриєте річний звіт незнайомої компанії?
