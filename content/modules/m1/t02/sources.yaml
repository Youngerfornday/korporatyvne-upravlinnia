    note: 'Розд. 1.2.1 (с. 29–31): 46 086 лістингових компаній з 98 ринків на кінець 2024 р.; у 44 % компаній світу три найбільші власники тримають понад 50 % капіталу (Європа 53 %, Латинська Америка 71 %, США 17 %; у США в 53 % компаній три найбільші тримають 10–29 %); структура власників — інституційні інвестори 47 %, інший вільний обіг 27 %, публічний сектор 10 %, корпорації 9 %, стратегічні фізичні особи й родини 7 % (Європа 9 %, США 5 %).'

  - id: oecd-factbook-2023
