sources:
  # Класифікація систем і теорія
  - id: franks-mayer-1992
    type: article
    title: 'Corporate Control: A Synthesis of the International Evidence'
    authors: [Franks J., Mayer C.]
    publisher: London Business School, IFA Working Paper
    year: 1992
    language: en
    url: https://lbsresearch.london.edu/id/eprint/4224/
    checkedAt: '2026-09-17'
    note: 'Джерело поділу на аутсайдерські системи Великої Британії і США та інсайдерські системи континентальної Європи і Японії: у перших багато біржових компаній з розпорошеною власністю й дисципліною ринку, у других — менше компаній і великі пакети в руках інших компаній, а контроль здійснюється через органи й комітети.'

  - id: shleifer-vishny-1997
    type: article
    title: A Survey of Corporate Governance
    authors: [Shleifer A., Vishny R. W.]
    publisher: 'The Journal of Finance, vol. 52, no. 2, pp. 737–783'
    year: 1997
    language: en
    url: https://dash.harvard.edu/entities/publication/73120379-1d3b-6bd4-e053-0100007fdf3b
    checkedAt: '2026-09-16'
    note: 'Протиставлення ринкових систем США і Великої Британії банкоцентричним системам Німеччини та Японії станом на 1990-ті; поглинання як головний зовнішній механізм дисципліни менеджменту. Історичні характеристики подано в минулому часі.'

  - id: villalonga-amit-2020
    type: article
    title: Family ownership
    authors: [Villalonga B., Amit R.]
    publisher: 'Oxford Review of Economic Policy, vol. 36, no. 2, pp. 241–257'
    year: 2020
    language: en
    url: https://faculty.wharton.upenn.edu/wp-content/uploads/2020/04/Family_Ownership.pdf
    checkedAt: '2026-09-17'
    note: 'Рецензований огляд про сімейні фірми: Західна Європа — 44 % сімейних проти 45 % з розпорошеною власністю (табл. 1, дані Faccio і Lang по 5 232 компаніях 13 країн), без Великої Британії — 56 % проти 28 %; розкид від 23 % до близько 60 %; родина серед ключових осіб у третині компаній S&P 500; «терплячий капітал», нижчі зарплати і рідші звільнення; тунелювання і гірші результати під керівництвом нащадків; теза «30 % доживають до другого покоління» емпірично не підтверджена (с. 247).'

  # Дані про структуру власності
  - id: oecd-factbook-2025
    type: report
    title: OECD Corporate Governance Factbook 2025
    authors: [OECD]
