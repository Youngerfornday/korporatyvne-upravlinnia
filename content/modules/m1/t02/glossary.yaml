# Глосарій теми 2 «Моделі корпоративного управління та міжнародні стандарти».
# ID і назви — з реєстру glossaryTerms у course.yaml. forms — словоформи для пошуку й підказок;
# seeAlso — лише зареєстровані терміни курсу.
topic: t02
terms:
  - id: outsider-system
    term: Аутсайдерська система корпоративного управління
    definition: >-
      Система, у якій власність розпорошена, а менеджмент дисциплінують сили, зовнішні щодо компанії:
      голосування розпорошених акціонерів та інституційних інвесторів, рада з більшістю незалежних
      директорів, можливість поглинання на біржі й жорсткі вимоги регулятора до розкриття інформації.
      Типова для Великої Британії і США; головний агентський конфлікт у ній — між менеджментом і акціонерами.
    synonyms: [аутсайдерська модель, ринкова система корпоративного управління, outsider system]
    forms:
      - аутсайдерська система
      - аутсайдерської системи
      - аутсайдерську систему
      - аутсайдерські системи
      - аутсайдерських систем
    seeAlso: [insider-system, anglo-american-model, one-tier-board-structure, corporate-governance]

  - id: insider-system
    term: Інсайдерська система корпоративного управління
    definition: >-
      Система, у якій контроль над компанією належить тим, хто вже перебуває всередині відносин з нею:
      контролюючому акціонеру, родині засновника, державі, компаніям тієї самої групи, банку-кредитору,
      представникам працівників у раді. Біржових компаній тут менше, власність концентрована, а зміна
      контролю через ринок майже неможлива; головний конфлікт — між тими, хто контролює, і рештою інвесторів.
    synonyms: [інсайдерська модель, інсайдерська система, insider system]
    forms:
      - інсайдерська система
      - інсайдерської системи
      - інсайдерську систему
      - інсайдерські системи
      - інсайдерських систем
    seeAlso: [outsider-system, german-model, japanese-model, family-model, principal-principal-conflict]

  - id: anglo-american-model
    term: Англо-американська модель корпоративного управління
    definition: >-
      Аутсайдерська модель з розпорошеною власністю, у якій головними акціонерами є інституційні інвестори,
      компанія фінансується переважно через ринок акцій і облігацій, діє однорівнева рада з більшістю
      незалежних директорів і розведеними посадами голови ради та головного виконавчого директора,
      а зовнішню дисципліну забезпечує ринок корпоративного контролю. Поширена у США, Великій Британії,
      Канаді та Австралії.
    synonyms: [англосаксонська модель, ринкова модель корпоративного управління]
    forms:
      - англо-американська модель
      - англо-американської моделі
      - англо-американську модель
      - англо-американською моделлю
    seeAlso: [outsider-system, one-tier-board-structure, corporate-governance-code, agency-problem]

  - id: german-model
    term: Німецька модель корпоративного управління
    definition: >-
      Інсайдерська модель континентального типу: концентрована власність стратегічних власників
      (промислових холдингів, засновників, публічної влади), дворівнева структура управління з правлінням
      і наглядовою радою, законодавчо закріплена співучасть працівників у наглядовій раді та історично
      значна роль банківського кредиту. Поширена в Німеччині, Австрії, Нідерландах.
    synonyms: [континентальна модель, німецько-континентальна модель, рейнська модель]
    forms:
      - німецька модель
      - німецької моделі
      - німецьку модель
      - німецькою моделлю
    seeAlso: [insider-system, two-tier-board-structure, codetermination, supervisory-board]

  - id: japanese-model
    term: Японська модель корпоративного управління
    definition: >-
      Інсайдерська модель групового типу: контроль тримають не окремий власник, а компанії однієї групи
      через взаємні пакети акцій, історично — з головним банком у ролі кредитора, акціонера й наглядача;
      ради традиційно формувалися з директорів, що виросли всередині компанії. Головним інструментом
      регулювання є кодекс корпоративного управління біржі, який працює в режимі «дотримуйся або пояснюй».
    synonyms: [японська модель, модель кейрецу]
    forms:
      - японська модель
      - японської моделі
      - японську модель
      - японською моделлю
    seeAlso: [insider-system, keiretsu, comply-or-explain, corporate-governance-code]

  - id: family-model
    term: Сімейна модель корпоративного управління
    definition: >-
      Модель, у якій контроль над компанією утримує родина засновника — незалежно від того, яка частка
      капіталу їй належить: через великий пакет, угоду про спільне голосування, піраміду холдингів
      або акції з різними правами голосу. Члени родини зазвичай входять до ради й менеджменту, рішення
      мають довгий горизонт, а головний конфлікт виникає між контролюючою родиною і зовнішніми інвесторами.
    synonyms: [модель сімейного контролю, родинна модель]
    forms:
      - сімейна модель
      - сімейної моделі
      - сімейну модель
      - сімейною моделлю
      - сімейні компанії
    seeAlso: [insider-system, principal-principal-conflict, ultimate-beneficial-owner, minority-shareholder]

  - id: keiretsu
    term: Кейрецу
    definition: >-
      Японська група формально незалежних компаній, пов’язаних взаємними пакетами акцій, стійкими
      відносинами постачання й спільним банком. Перехресне володіння всередині групи дає менеджменту
      кожної компанії лояльні голоси на загальних зборах, тому зміна контролю ззовні стає майже неможливою.
    synonyms: [перехресне володіння в японській групі, keiretsu]
    forms: [кейрецу, кейрецу-група, перехресне володіння, перехресного володіння, перехресні пакети]
    seeAlso: [japanese-model, insider-system, market-for-corporate-control]

  - id: codetermination
    term: Співучасть працівників в управлінні
    definition: >-
      Закріплене законом право працівників мати своїх представників у контрольному органі компанії.
      У німецькому праві реалізоване двома законами: у компаніях, що зазвичай мають понад 2 000 працівників,
      наглядова рада складається з рівної кількості представників акціонерів і працівників, а в компаніях
      з понад 500 працівниками працівникам належить третина місць.
    synonyms: [співучасть в управлінні, участь працівників у наглядовій раді, Mitbestimmung]
    forms:
      - співучасть працівників
      - співучасті працівників
      - співучастю працівників
      - участь працівників в управлінні
    seeAlso: [german-model, two-tier-board-structure, stakeholder, supervisory-board]

  - id: one-tier-board-structure
    term: Однорівнева структура управління
    definition: >-
      Структура управління акціонерним товариством, за якої діють загальні збори і один колегіальний орган —
      рада директорів. Розділення ролей проходить усередині неї: виконавчі директори ведуть поточну
      діяльність, а невиконавчі, зокрема незалежні, наглядають і не втручаються в поточні рішення.
      За Законом України «Про акціонерні товариства» вид структури визначає статут, а його зміна
      не є реорганізацією товариства.
    synonyms: [однорівнева модель управління, унітарна рада, one-tier board]
    forms:
      - однорівнева структура
      - однорівневої структури
      - однорівневу структуру
      - однорівневою структурою
    seeAlso: [two-tier-board-structure, board-of-directors, independent-director, anglo-american-model]

  - id: two-tier-board-structure
    term: Дворівнева структура управління
    definition: >-
      Структура управління акціонерним товариством, за якої діють загальні збори, наглядова рада
      і виконавчий орган — колегіальний або одноосібний. Нагляд і поточне управління розведено
      по різних органах, і член наглядової ради не може одночасно входити до виконавчого органу.
      Історично склалася в німецькому праві; українське право дозволяє товариству обрати її статутом.
    synonyms: [дворівнева модель управління, двопалатна структура, two-tier board]
    forms:
      - дворівнева структура
      - дворівневої структури
      - дворівневу структуру
      - дворівневою структурою
    seeAlso: [one-tier-board-structure, supervisory-board, executive-body, german-model]

  - id: g20-oecd-principles
    term: Принципи корпоративного управління G20/ОЕСР
    definition: >-
      Найавторитетніший міжнародний орієнтир у сфері корпоративного управління, уперше виданий 1999 р.
      Чинна редакція опублікована 11.09.2023 і складається з шести розділів: основа ефективної системи;
      права і рівне ставлення до акціонерів; інституційні інвестори, ринки й посередники; розкриття
      інформації і прозорість; відповідальність ради; сталий розвиток і стійкість. Принципи не є
      обов’язковими — це орієнтир для законодавців, регуляторів і бірж, на який спираються національні кодекси.
    synonyms: [Принципи ОЕСР, Принципи G20/ОЕСР 2023, G20/OECD Principles of Corporate Governance]
    forms:
      - Принципи корпоративного управління
      - Принципів корпоративного управління
      - Принципами G20/ОЕСР
      - Принципи ОЕСР
    seeAlso: [corporate-governance, corporate-governance-code, comply-or-explain, stakeholder]

  - id: corporate-governance-code
    term: Кодекс корпоративного управління
    definition: >-
      Звід рекомендованих практик корпоративного управління для компаній, який видає регулятор, біржа
      або професійне об’єднання. Виконання забезпечується не санкцією за відхилення, а обов’язком
      публічно пояснити його. Перший такий документ опубліковано у Великій Британії в грудні 1992 р.;
      в Україні діє Кодекс корпоративного управління, затверджений рішенням НКЦПФР № 118 від 12.03.2020.
    synonyms: [кодекс КУ, кодекс кращих практик корпоративного управління]
    forms:
      - кодекс корпоративного управління
      - кодексу корпоративного управління
      - кодексом корпоративного управління
      - кодекси корпоративного управління
    seeAlso: [comply-or-explain, g20-oecd-principles, corporate-governance-report, corporate-governance]

  - id: comply-or-explain
    term: Принцип «дотримуйся або пояснюй»
    definition: >-
      Режим виконання кодексу корпоративного управління, за яким компанія або дотримується рекомендації,
      або публічно розкриває, якого саме положення не застосовує, з поясненням причин і описом
      альтернативної практики. В Україні правовою основою обов’язку пояснювати відхилення є норма
      про звіт про корпоративне управління у складі річної інформації емітента.
    synonyms: ['«дотримуйся або поясни»', comply or explain, режим пояснення відхилень]
    forms:
      - дотримуйся або пояснюй
      - принцип «дотримуйся або пояснюй»
      - принципу «дотримуйся або пояснюй»
      - режим «дотримуйся або пояснюй»
    seeAlso: [corporate-governance-code, corporate-governance-report, information-disclosure, g20-oecd-principles]
