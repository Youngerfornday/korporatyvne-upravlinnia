# Глосарій теми 1 «Корпорація і корпоративне управління». ID і назви — з реєстру glossaryTerms у course.yaml.
# forms — словоформи для пошуку й підказок (називний, родовий, множина); seeAlso — лише зареєстровані терміни.
topic: t01
terms:
  - id: corporation
    term: Корпорація
    definition: >-
      Форма організації бізнесу, у якій підприємство є окремою юридичною особою, капітал поділено на частки (акції),
      учасники відповідають за його зобов’язання лише своїм внеском, частки можна вільно відчужувати, а управління
      зосереджене в органах товариства, а не в кожному власнику. В українському праві цим ознакам найповніше відповідає
      акціонерне товариство.
    synonyms: [акціонерне товариство (в широкому сенсі), корпоративне підприємство]
    forms: [корпорація, корпорації, корпорацію, корпорацією, корпорацій, корпораціям, корпораціями]
    seeAlso: [corporate-governance, separation-of-ownership-and-control, joint-stock-company]

  - id: corporate-governance
    term: Корпоративне управління
    definition: >-
      Система відносин між виконавчим менеджментом, радою, акціонерами та іншими стейкхолдерами компанії, а також
      сукупність правил і механізмів, через які визначають цілі компанії, засоби їх досягнення й контроль за результатами.
      Це не «управління корпорацією» як менеджмент, а рамка, у якій менеджмент працює і звітує.
    synonyms: [корпоративне врядування, corporate governance]
    forms: [корпоративне управління, корпоративного управління, корпоративному управлінню, корпоративним управлінням]
    seeAlso: [agency-problem, stakeholder, g20-oecd-principles, corporate-governance-code]

  - id: separation-of-ownership-and-control
    term: Відокремлення власності від контролю
    definition: >-
      Ситуація, коли ті, хто вклав капітал і несе ризик (акціонери), не ухвалюють поточних рішень, а ті, хто ухвалює
      рішення (менеджмент), не володіють істотною часткою капіталу. Описана Берлі й Мінзом у 1932 р. на прикладі
      великих американських корпорацій з розпорошеною власністю; є коренем агентської проблеми.
    synonyms: [розрив між власністю і контролем, розділення власності й управління]
    forms:
      - відокремлення власності від контролю
      - відокремлення власності і контролю
      - відокремленням власності від контролю
      - розрив власності й контролю
    seeAlso: [agency-problem, principal, agent, outsider-system]

  - id: agency-problem
    term: Агентська проблема
    definition: >-
      Конфлікт інтересів, що виникає, коли одна сторона (агент) діє від імені іншої (принципала), має власні цілі
      й знає про свої дії більше, ніж принципал. У корпорації це насамперед конфлікт між менеджментом і акціонерами,
      а за концентрованої власності — між контролюючим і міноритарними акціонерами.
    synonyms: [агентський конфлікт, проблема принципала — агента]
    forms: [агентська проблема, агентської проблеми, агентську проблему, агентською проблемою, агентські проблеми, агентський конфлікт]
    seeAlso: [principal, agent, agency-costs, information-asymmetry, principal-principal-conflict]

  - id: principal
    term: Принципал
    definition: >-
      Сторона, яка доручає іншій особі діяти у своїх інтересах і несе наслідки її рішень. У корпоративному управлінні
      принципалом щодо менеджменту є акціонери (в особі загальних зборів і ради), а щодо контролюючого акціонера —
      міноритарні акціонери, кредитори й вкладники, чиї кошти він фактично контролює.
    synonyms: [довіритель]
    forms: [принципал, принципала, принципалу, принципалом, принципали, принципалів, принципалами]
    seeAlso: [agent, agency-problem, shareholder]

  - id: agent
    term: Агент
    definition: >-
      Особа, якій принципал доручив діяти від свого імені й розпоряджатися його ресурсами. У корпорації агентами
      є виконавчий орган і члени ради; вони мають фідуціарні обов’язки — діяти добросовісно і в інтересах товариства,
      а не у власних.
    synonyms: [виконавець доручення, представник]
    forms: [агент, агента, агенту, агентом, агенти, агентів, агентами]
    seeAlso: [principal, agency-problem, agency-costs]

  - id: agency-costs
    term: Агентські витрати
    definition: >-
      Сукупна ціна агентської проблеми для принципала. За Дженсеном і Меклінгом (1976) складається з витрат на
      моніторинг агента (аудит, наглядова рада, звітність), витрат на гарантування з боку агента (bonding: опціони,
      обмеження, страхування відповідальності) і залишкових втрат — збитків від рішень агента, яких не вдалося
      запобігти навіть після моніторингу й гарантій.
    synonyms: [витрати агентських відносин, agency costs]
    forms: [агентські витрати, агентських витрат, агентським витратам, агентськими витратами]
    seeAlso: [agency-problem, information-asymmetry, supervisory-board]

  - id: information-asymmetry
    term: Інформаційна асиметрія
    definition: >-
      Нерівність знань між сторонами відносин: менеджмент знає про справжній стан бізнесу, ризики й якість власних
      рішень більше, ніж акціонери, кредитори чи регулятор. Саме асиметрія перетворює розбіжність інтересів на
      реальну проблему, бо принципал не може безкоштовно перевірити агента.
    synonyms: [асиметрія інформації, інформаційна нерівність]
    forms: [інформаційна асиметрія, інформаційної асиметрії, інформаційну асиметрію, інформаційною асиметрією, асиметрія інформації]
    seeAlso: [agency-problem, agency-costs, comply-or-explain]

  - id: principal-principal-conflict
    term: Конфлікт мажоритарних і міноритарних акціонерів
    definition: >-
      Різновид агентської проблеми за концентрованої власності: контролюючий акціонер через раду й менеджмент
      розпоряджається грошовими потоками всієї компанії, а міноритарії несуть ризик пропорційно своїй частці, не маючи
      контролю. Типові прояви — правочини з пов’язаними особами за неринковими цінами, невиплата дивідендів, розмивання
      часток. Інша назва — конфлікт «принципал — принципал».
    synonyms: [конфлікт «принципал — принципал», конфлікт контролюючого акціонера і міноритаріїв, principal-principal conflict]
    forms:
      - конфлікт мажоритарних і міноритарних акціонерів
      - конфлікту мажоритарних і міноритарних акціонерів
      - конфлікт мажоритаріїв і міноритаріїв
      - конфлікт принципал — принципал
    seeAlso: [agency-problem, minority-shareholder, controlling-stake, ultimate-beneficial-owner]

  - id: ultimate-beneficial-owner
    term: Кінцевий бенефіціарний власник
    definition: >-
      Фізична особа, яка в кінцевому підсумку володіє компанією або контролює її — прямо чи через ланцюжок інших
      компаній, довірчих конструкцій або домовленостей — і отримує вигоду від її діяльності. Розкриття кінцевих
      бенефіціарів дає змогу побачити, хто насправді стоїть за формальними акціонерами, і виявити пов’язаних осіб.
    synonyms: [бенефіціарний власник, контролер, кінцевий бенефіціар, UBO]
    forms:
      - кінцевий бенефіціарний власник
      - кінцевого бенефіціарного власника
      - кінцеві бенефіціарні власники
      - кінцевих бенефіціарних власників
      - бенефіціар
      - бенефіціара
    seeAlso: [principal-principal-conflict, controlling-stake, shareholder]

  - id: stakeholder
    term: Стейкхолдер
    definition: >-
      Особа або група, яка може впливати на досягнення цілей компанії або на яку впливає її діяльність: акціонери,
      працівники, кредитори, вкладники, постачальники, клієнти, держава і громада. Термін закріпив Едвард Фрімен (1984);
      у Принципах G20/ОЕСР 2023 інтереси стейкхолдерів розглянуто в розділі про сталий розвиток і стійкість.
    synonyms: [заінтересована сторона, зацікавлена сторона, група інтересів]
    forms: [стейкхолдер, стейкхолдера, стейкхолдеру, стейкхолдером, стейкхолдери, стейкхолдерів, стейкхолдерам, стейкхолдерами, заінтересовані сторони]
    seeAlso: [stakeholder-theory, shareholder-primacy, corporate-governance]

  - id: stakeholder-theory
    term: Теорія стейкхолдерів
    definition: >-
      Погляд, за яким менеджмент і рада мають ухвалювати рішення з урахуванням інтересів усіх груп, від яких залежить
      довгостроковий успіх компанії, а не лише акціонерів. Не заперечує прибутку, але вважає його результатом
      збалансованих відносин зі стейкхолдерами, а не єдиною метою.
    synonyms: [стейкхолдерський підхід, теорія заінтересованих сторін]
    forms: [теорія стейкхолдерів, теорії стейкхолдерів, теорію стейкхолдерів, теорією стейкхолдерів, стейкхолдерський підхід]
    seeAlso: [stakeholder, shareholder-primacy, corporate-governance]

  - id: shareholder-primacy
    term: Концепція пріоритету акціонерів
    definition: >-
      Погляд, за яким головна мета корпорації — довгострокова вартість для акціонерів, а інтереси інших сторін
      враховуються настільки, наскільки цього вимагають закон і договори. Аргумент прихильників — саме акціонери
      несуть залишковий ризик і мають чіткий критерій для оцінювання менеджменту; аргумент критиків — вартість для
      акціонерів у короткій перспективі може створюватися коштом працівників, кредиторів і суспільства.
    synonyms: [пріоритет акціонерів, shareholder primacy, акціонерна модель]
    forms:
      - концепція пріоритету акціонерів
      - концепції пріоритету акціонерів
      - концепцію пріоритету акціонерів
      - пріоритет акціонерів
      - пріоритету акціонерів
    seeAlso: [stakeholder-theory, stakeholder, anglo-american-model]
