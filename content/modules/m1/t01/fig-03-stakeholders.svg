<svg xmlns="http://www.w3.org/2000/svg" id="fig-t01-3" class="scheme" viewBox="0 0 600 440" role="img" aria-labelledby="fig-t01-3-title fig-t01-3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t01-3-title">Рисунок 3. Карта стейкхолдерів компанії та їхніх інтересів</title>
  <desc id="fig-t01-3-desc">У центрі — блок «Компанія». Навколо нього вісім блоків, з’єднаних лініями з центром: акціонери (дохід на капітал, контроль), кредитори й вкладники (повернення коштів), менеджмент (винагорода, свобода дій), працівники (зайнятість, оплата, безпека), клієнти (якість, ціна), постачальники (стабільні замовлення, оплата), держава (податки, дотримання закону), громада (робочі місця, довкілля). Карміновим виділено кредиторів і вкладників — групу, чиї кошти найлегше поставити під ризик непомітно для них.</desc>
  <style>
    #fig-t01-3 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-3 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t01-3 .t { fill: var(--ink, #0f1c2e); font-size: 15px; font-weight: 650; }
    #fig-t01-3 .n { fill: var(--ink, #0f1c2e); font-size: 13.5px; font-weight: 650; }
    #fig-t01-3 .s { fill: var(--ink-2, #445570); font-size: 11px; }
    #fig-t01-3 .link { stroke: var(--ink-2, #445570); stroke-width: 1; fill: none; }
    #fig-t01-3 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-3 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t01-3 .exam { stroke: var(--err, #b42318); }
    #fig-t01-3 .exam-t { fill: var(--err-ink, #8f1d14); }
  </style>

  <path class="link" d="M300 190 L106 60"/>
  <path class="link" d="M300 190 L300 60"/>
  <path class="link" d="M300 190 L494 60"/>
  <path class="link" d="M300 190 L106 220"/>
  <path class="link" d="M300 190 L494 220"/>
  <path class="link" d="M300 190 L106 380"/>
  <path class="link" d="M300 190 L300 380"/>
  <path class="link" d="M300 190 L494 380"/>

  <rect class="box box-owner" x="210" y="164" width="180" height="52" rx="6"/>
  <text class="t" x="300" y="195" text-anchor="middle">Компанія</text>

  <rect class="box" x="16" y="34" width="180" height="52" rx="6"/>
  <text class="n" x="106" y="55" text-anchor="middle">Акціонери</text>
  <text class="s" x="106" y="74" text-anchor="middle">дохід на капітал · контроль</text>

  <rect class="box" x="210" y="34" width="180" height="52" rx="6"/>
  <text class="n" x="300" y="55" text-anchor="middle">Менеджмент</text>
  <text class="s" x="300" y="74" text-anchor="middle">винагорода · свобода дій</text>

  <rect class="box exam" x="404" y="34" width="180" height="52" rx="6"/>
  <text class="n exam-t" x="494" y="55" text-anchor="middle">Кредитори і вкладники</text>
  <text class="s" x="494" y="74" text-anchor="middle">повернення коштів</text>

  <rect class="box" x="16" y="194" width="180" height="52" rx="6"/>
  <text class="n" x="106" y="215" text-anchor="middle">Працівники</text>
  <text class="s" x="106" y="234" text-anchor="middle">зайнятість · оплата · безпека</text>

  <rect class="box" x="404" y="194" width="180" height="52" rx="6"/>
  <text class="n" x="494" y="215" text-anchor="middle">Держава</text>
  <text class="s" x="494" y="234" text-anchor="middle">податки · дотримання закону</text>

  <rect class="box" x="16" y="354" width="180" height="52" rx="6"/>
  <text class="n" x="106" y="375" text-anchor="middle">Постачальники</text>
  <text class="s" x="106" y="394" text-anchor="middle">замовлення · оплата в строк</text>

  <rect class="box" x="210" y="354" width="180" height="52" rx="6"/>
  <text class="n" x="300" y="375" text-anchor="middle">Клієнти</text>
  <text class="s" x="300" y="394" text-anchor="middle">якість · ціна · безпека</text>

  <rect class="box" x="404" y="354" width="180" height="52" rx="6"/>
  <text class="n" x="494" y="375" text-anchor="middle">Громада</text>
  <text class="s" x="494" y="394" text-anchor="middle">робочі місця · довкілля</text>

  <circle class="refc" cx="16" cy="34" r="11"/><text class="refn" x="16" y="38">1</text>
  <circle class="refc" cx="210" cy="34" r="11"/><text class="refn" x="210" y="38">2</text>
  <circle class="refc exam" cx="404" cy="34" r="11"/><text class="refn exam-n" x="404" y="38">3</text>
  <circle class="refc" cx="16" cy="194" r="11"/><text class="refn" x="16" y="198">4</text>
  <circle class="refc" cx="404" cy="194" r="11"/><text class="refn" x="404" y="198">5</text>
  <circle class="refc" cx="16" cy="354" r="11"/><text class="refn" x="16" y="358">6</text>
  <circle class="refc" cx="210" cy="354" r="11"/><text class="refn" x="210" y="358">7</text>
  <circle class="refc" cx="404" cy="354" r="11"/><text class="refn" x="404" y="358">8</text>
</svg>
