# Презентація теми 1 «Корпорація і корпоративне управління»: 28 слайдів на 2 академічні години (80 хв).
# Схема: src/content/schemas/slides.ts. Зміст — лише з лонгріда теми (lecture.mdx); норми — з docs/research/legal-baseline.md
# з кодом рядка; кожне число — з джерелом у sources (ID з sources.yaml). Текст слайда — тези; пояснення, приклад
# і питання до аудиторії — у notes.
topic: t01
slides:
  - id: title
    type: title
    subtitle: Чому власники не керують, а керівники не володіють
    sources: [nbu-privatbank-2016]
    notes: >-
      Відкрийте лекцію історією, до якої курс повертатиметься не раз. 18 грудня 2016 р. Національний банк визнав
      ПриватБанк неплатоспроможним, а уряд того ж дня ухвалив рішення про перехід банку у стовідсоткову державну
      власність. Наступного дня Голова НБУ повідомила: понад 97 % корпоративного кредитного портфеля банку становили
      кредити компаніям, пов’язаним з його акціонерами. Це позиція регулятора, а не висновок суду. Питання до аудиторії:
      як так виходить, що гроші мільйонів вкладників опиняються під контролем кількох осіб, і що саме мало б цьому
      запобігти? Відповідь шукаємо впродовж лекції: від конструкції корпорації до конфліктів, які вона породжує,
      і механізмів, які їх стримують.

  - id: outcomes
    type: outcomes
    title: Що ви зможете після лекції
    notes: >-
      Назвіть чотири результати й покажіть, де кожен перевіряється. Сутність корпорації і корпоративного управління —
      у самоперевірці лонгріда й тренувальному тесті. Розрізнення двох агентських конфліктів і наслідки слабкого
      управління — у розборі кейсів ПриватБанку й Enron наприкінці лекції. Порівняння пріоритету акціонерів
      і стейкхолдерського підходу — у питанні про етичний вибір. Приклад: після лекції студент має за двома
      питаннями відрізнити конфлікт «менеджмент — акціонери» від конфлікту «принципал — принципал»: хто фактично
      ухвалює рішення і хто від них втрачає. Питання до аудиторії: який із результатів найближчий до вашої майбутньої
      роботи менеджера?

  # 1. Корпорація як форма організації бізнесу
  - id: section-corporation
    type: section
    number: 1
    title: Корпорація як форма організації бізнесу
    notes: >-
      Почнімо з конструкції: чим корпорація відрізняється від бізнесу однієї людини і чому саме ця форма здатна збирати
      капітал у величезних масштабах.

  - id: corporation-features
    type: bullets
    title: Три ознаки корпорації
    bullets:
      - 'Обмежена відповідальність: учасник ризикує лише тим, що вклав'
      - 'Вільне відчуження часток: акцію продають без згоди інших акціонерів'
      - 'Централізоване управління: рішення ухвалюють органи, а не всі власники разом'
      - Ознаки тримають одна одну — без будь-якої з них конструкція не працює
      - 'Ціна конструкції: власники капіталу не ухвалюють рішень'
    notes: >-
      Пояснення: три ознаки випливають одна з одної. Якби відповідальність була необмеженою, ніхто не купував би акцію
      незнайомої компанії; якби частки не можна було продати, ніхто не вклав би гроші на невизначений строк; якби кожен
      власник мав право втручатися в поточні рішення, компанія з тисячею акціонерів не працювала б узагалі. Приклад:
      підприємець, який тримає кав’ярню як ФОП, сам вклав гроші, сам варить каву і відповідає за оренду й борги всім
      своїм майном, аж до власного авто. Той, хто будує завод, збирає гроші сотень людей, які не бачили одне одного,
      не збираються керувати заводом і не готові ризикувати більшим, ніж вклали. Питання до аудиторії: яка з трьох
      ознак безпосередньо породжує відокремлення власності від контролю? Відповідь: централізоване управління — рішення
      делеговано органам товариства.

  - id: joint-stock-company-types
    type: norm
    title: В Україні корпорація — це акціонерне товариство
    text: >-
      Акціонерні товариства бувають лише публічними або приватними; тип визначає статут. Публічним є товариство,
      щодо акцій якого була здійснена публічна пропозиція або акції якого допущені до торгів на організованому ринку
      капіталу. Публічну пропозицію власних акцій може робити лише публічне товариство. Зміна типу товариства
      не є його перетворенням.
    lawRef:
      act: Закон України «Про акціонерні товариства» від 27.07.2022 № 2465-IX
      article: ст. 6 ч. 1–4 (AT-01)
      checkedAt: '2026-09-14'
      url: https://zakon.rada.gov.ua/laws/show/2465-20
    sources: [law-2465-ix]
    notes: >-
      Пояснення: в українському праві ознакам корпорації найповніше відповідає акціонерне товариство. Закон № 2465-IX,
      чинний з 2023 р., знає лише публічні й приватні товариства; «відкриті» й «закриті» АТ залишилися в законі 2008 р.,
      який втратив чинність. Господарський кодекс втратив чинність 28.08.2025 з дня введення в дію Закону № 4196-IX
      (legal-baseline GK-01), тож «корпоративні підприємства за Господарським кодексом» — застаріле твердження.
      Приклад: власник простої акції має право на участь в управлінні, дивіденди, частину майна при ліквідації
      та інформацію; одна голосуюча акція дає один голос, крім кумулятивного голосування (ст. 27 ч. 1–2,
      legal-baseline AT-13). Питання до аудиторії: право на управління в переліку стоїть першим — як часто і в який
      спосіб акціонер його реалізує? Відповідь: не щодня й не одноосібно, а голосуванням на загальних зборах. Саме тут
      починається розрив, про який далі.

  # 2. Відокремлення власності від контролю
  - id: section-separation
    type: section
    number: 2
    title: Відокремлення власності від контролю
    notes: >-
      Від конструкції переходимо до її ціни: хто в корпорації насправді ухвалює рішення, якщо власників тисячі.

  - id: separation-figure
    type: figure
    title: Власники не керують, керівники не володіють
    figure: fig-01-separation.svg
    caption: 'Рисунок 1. Відокремлення власності від контролю: суцільні стрілки — повноваження, пунктирні — звітність.'
    sources: [berle-means-1932]
    notes: >-
      Пояснення: у 1932 р. Адольф Берлі й Гардінер Мінз вивчили двісті найбільших нефінансових корпорацій США
      і показали, що в значній частині з них жоден акціонер не мав пакета, достатнього для контролю, а компаніями
      керував менеджмент, який володів мізерною часткою акцій або не володів ними взагалі. Власність — це право
      на залишковий дохід і залишкове майно; контроль — право вирішувати, як використовувати активи. Пройдіть схему
      згори вниз: акціонери на загальних зборах обирають раду, рада призначає й контролює виконавчий орган, звітність
      іде вгору. Приклад: менеджер, який розпоряджається чужими грошима, має власні інтереси — високу винагороду,
      комфортний офіс, розширення компанії заради статусу, спокійне життя без ризикованих, але вигідних акціонерам
      проєктів. Питання до аудиторії: у кав’ярні обидва права в одних руках — у якій точці схеми вони розходяться?

  - id: concentrated-ownership
    type: bullets
    title: Контролюючий власник — норма, а не виняток
    bullets:
      - 'ОЕСР, 2023: у 25 з 44 юрисдикцій три найбільші акціонери в середньому мають понад 50 % капіталу'
      - 'ОЕСР, 2025: у 44 % лістингових компаній світу три найбільші власники — понад 50 % (Європа 53 %, США 17 %)'
      - 'Україна: понад 60 % біржових компаній мають єдиного власника з пакетом понад 50 %'
      - 'Два варіанти розриву: менеджмент проти тисяч власників або власник, який керує, проти решти'
      - Обидва варіанти породжують агентську проблему, але різну
    sources: [oecd-factbook-2023, oecd-factbook-2025, oecd-ukraine-2025]
    notes: >-
      Пояснення: картина Берлі й Мінза — це США 1930-х років, і вона не універсальна. Навіть там, де концентрація
      найнижча (Австралія, Фінляндія, Ірландія, США, Канада, Велика Британія), три найбільші акціонери тримають
      у середньому 33–36 % капіталу. За даними Factbook 2023, у Німеччині три найбільші акціонери володіють понад
      половиною капіталу в 59 % лістингових компаній, у Польщі — у 73 %, у Японії — лише у 28 %. Приклад: за звітом
      ОЕСР 2025 р. про фінансові ринки України, понад 60 % компаній, акції яких торгувалися на біржі, мають єдиного
      власника з пакетом понад 50 % — проти близько 32 % у юрисдикціях Factbook 2022 р. Застереження: це дані лише
      про біржові компанії; чи так само виглядає решта акціонерних товариств, досліджень немає — це перевіряють
      на практичній 7 за розкриттям емітентів у базі SMIDA. Питання до аудиторії: якщо власник сам призначає
      менеджмент, чиї інтереси тепер під загрозою?

  # 3. Агентська теорія
  - id: section-agency
    type: section
    number: 3
    title: 'Агентська теорія: принципал, агент, інформаційна асиметрія'
    notes: >-
      Дженсен і Меклінг дали розриву Берлі й Мінза точну мову. Тепер назвемо сторони, джерело конфлікту і його ціну.

  - id: agency-costs-formula
    type: formula
    title: Агентська проблема і її ціна
    formula: Агентські витрати = Витрати на моніторинг + Витрати на гарантування + Залишкові втрати
    explanation:
      - 'Принципал доручає агентові діяти від свого імені: акціонери — менеджменту'
      - Інтереси розходяться, а інформаційна асиметрія не дає бачити дії й знання агента
      - 'Моніторинг оплачує принципал: рада, аудит, звітність'
      - 'Гарантування бере на себе агент: договірні обмеження, гарантія або застава'
      - Залишкові втрати — шкода від рішень агента, яких не вдалося запобігти
    sources: [jensen-meckling-1976]
    notes: >-
      Пояснення: у 1976 р. Майкл Дженсен і Вільям Меклінг описали корпорацію через агентські відносини — договір,
      за яким принципал доручає агентові роботу від свого імені й передає частину повноважень ухвалювати рішення.
      Обидві сторони максимізують власну користь, тому агент не завжди діє в інтересах принципала. Інформаційна
      асиметрія має два прояви: прихована дія (принципал не відрізнить невдачу через ринок від невдачі через
      недбалість) і прихована інформація (агент вирішує, чи повідомляти те, що знає). Це не розрахункова формула
      з числами, а склад витрат. Приклад: опціони й бонуси — не гарантування, бо їх призначає принципал, щоб зблизити
      інтереси; це його витрати на стимулювання й контракт. Питання до аудиторії: до якої складової належить згода
      менеджера не укладати угод з пов’язаними особами без згоди ради? Відповідь: гарантування.

  - id: agency-costs-figure
    type: figure
    title: Нагляд зменшує залишкові втрати, але не обнуляє їх
    figure: fig-02-agency-costs.svg
    caption: 'Рисунок 2. Агентські витрати за Дженсеном і Меклінгом: моніторинг і гарантування зменшують залишкові втрати, але обнулити їх не можуть.'
    sources: [jensen-meckling-1976]
    notes: >-
      Пояснення: мета корпоративного управління — мінімум суми трьох складових, а не мінімум якоїсь однієї. Платити
      за моніторинг варто, поки кожна додаткова гривня зменшує залишкові втрати більш ніж на гривню; у певний момент
      ще одна гривня на аудит коштує більше, ніж втрати, яких вона запобігає. Приклад: незалежний директор, аудиторський
      комітет і розкриття інформації — це моніторинг, за який платять акціонери. Компанія без ради і без аудиту
      не «економить» — вона переносить усю суму в залишкові втрати, де та невидима до першого скандалу. Питання
      до аудиторії: чи є кредитори банку принципалами? Відповідь: їх іноді описують як квазіпринципалів, але формально
      їхні відносини з компанією боргові, а не агентські.

  # 4. Два конфлікти
  - id: section-conflicts
    type: section
    number: 4
    title: 'Два конфлікти: «менеджмент — акціонери» і «мажоритарій — міноритарії»'
    notes: >-
      Класична агентська проблема — лише один із двох конфліктів. Для України важливіший другий.

  - id: two-conflicts
    type: two-columns
    title: Два агентські конфлікти
    left:
      heading: Менеджмент — акціонери
      bullets:
        - Типовий для розпорошеної власності
        - Надмірна винагорода, «побудова імперії», окопування, маніпуляції звітністю
        - Втрачають усі акціонери разом
        - 'Захист: незалежна рада, аудит, винагорода за довгострокову вартість'
    right:
      heading: Мажоритарій — міноритарії
      bullets:
        - Типовий для концентрованої власності
        - 'Дохід в обхід дивідендів: завищені ціни закупівель, кредити пов’язаним особам'
        - Втрачають ті, хто не контролює
        - 'Захист: незалежні голоси в раді, контроль пов’язаних правочинів, права меншості'
    notes: >-
      Пояснення: контролюючий акціонер сам призначає раду й менеджмент, тому проблема «менеджмент проти акціонерів»
      для нього майже не існує. Натомість виникає конфлікт «принципал — принципал»: обидві сторони — власники, але одна
      контролює всі грошові потоки, а інша несе ризик пропорційно своїй частці без впливу на рішення. Проблема не в тому,
      що мажоритарій отримує більше дивідендів, — він і вклав більше, — а в доході в обхід дивідендів. Приклад:
      закупівля сировини в компанії мажоритарія за завищеною ціною, продаж продукції його ж компанії за заниженою,
      розмивання часток міноритаріїв додатковою емісією на користь «своїх», роки без дивідендів. Питання до аудиторії:
      поставте до будь-якого кейсу два питання — хто фактично ухвалює рішення і хто від них втрачає: усі акціонери
      разом чи лише ті, хто не контролює?

  - id: minority-protection
    type: bullets
    title: Захист того, хто володіє, але не контролює
    bullets:
      - 'Контроль визначають пакети: значний — від 5 %, контрольний — понад 50 %, домінуючий — понад 95 %'
      - Незалежні члени наглядової ради ПАТ — не менше третини, але не менше двох осіб
      - 'Правочини із заінтересованістю: до 10 % активів — рада, понад 10 % — загальні збори'
      - Кумулятивне голосування дає меншості шанс провести до ради свого представника
      - 'Кінцевий бенефіціарний власник: ознака прямого впливу — не менше 25 % капіталу або голосів'
    sources: [law-2465-ix, law-361-ix]
    notes: >-
      Пояснення: закон описує контроль не через посади, а через пакети акцій (ст. 2 ч. 1 п. 5, 7–9, legal-baseline
      AT-69); від порогів залежать право вимагати скликання зборів, обов’язкова оферта решті акціонерів і примусовий
      викуп. Незалежні директори тут потрібні не так для нагляду за менеджментом, як для голосу, що не залежить
      від контролюючого акціонера (ст. 72 ч. 4, legal-baseline AT-49). У правочинах із заінтересованістю — зокрема
      з акціонером, який має 25 % і більше голосуючих акцій, — заінтересовані члени ради й акціонери не голосують,
      а рада залучає незалежного аудитора чи оцінювача; правила не застосовуються до правочинів менше 1 % вартості
      активів, якщо статут не встановив меншого порога (ст. 107, legal-baseline AT-64, AT-65). Кумулятивне голосування
      множить голоси на кількість місць у раді, і їх можна віддати одному кандидату (legal-baseline AT-39). Приклад:
      акціонером за реєстром може бути компанія з Кіпру, якою володіє компанія з Британських Віргінських островів,
      якою володіє траст; без розкриття бенефіціара (Закон № 361-IX, legal-baseline UBO-01) не перевірити, чи є
      постачальник пов’язаною особою. Відомості реєстру про бенефіціарів відкриті, крім реєстраційного номера
      і паспортних даних (Закон № 755-IV, legal-baseline UBO-04). Питання до аудиторії: який механізм дає міноритарію
      змогу вийти з компанії, коли контроль змінився? Відповідь: обов’язкова оферта і право вимагати викупу.

  # 5. Стейкхолдери
  - id: section-stakeholders
    type: section
    number: 5
    title: 'Стейкхолдери: пріоритет акціонерів чи теорія стейкхолдерів'
    notes: >-
      Досі ми дивилися на корпорацію очима акціонера. Але від заводу залежать не лише ті, хто купив його акції.

  - id: stakeholders-figure
    type: figure
    title: Стейкхолдери компанії та їхні інтереси
    figure: fig-03-stakeholders.svg
    caption: 'Рисунок 3. Карта стейкхолдерів компанії: інтереси не збігаються — саме тому потрібні правила їх узгодження.'
    sources: [freeman-1984]
    notes: >-
      Пояснення: у 1984 р. Едвард Фрімен назвав стейкхолдером будь-яку групу або особу, яка може впливати на досягнення
      цілей організації або на яку впливає їх досягнення. Пройдіть карту: акціонери чекають залишкового доходу
      і контролю, менеджмент — винагороди і свободи дій, працівники — зайнятості, оплати й безпеки, держава — податків
      і дотримання закону, постачальники — стабільних замовлень, клієнти — якості й ціни, громада — робочих місць
      і довкілля. Приклад: кредитори й вкладники виділені карміновим — їхні кошти найлегше поставити під ризик
      непомітно для них, що й показує кейс ПриватБанку. Питання до аудиторії: інтереси яких двох груп на карті
      найчастіше суперечать одне одному?

  - id: primacy-vs-stakeholders
    type: two-columns
    title: Пріоритет акціонерів чи теорія стейкхолдерів
    left:
      heading: Пріоритет акціонерів
      bullets:
        - Мета — довгострокова вартість для акціонерів у межах закону й договорів
        - Акціонери отримують дохід останніми — найбільше заінтересовані в ефективності
        - Один зрозумілий критерій оцінки менеджменту
        - 'Межа: виправдання шкоди іншим'
    right:
      heading: Теорія стейкхолдерів
      bullets:
        - Успіх неможливий без працівників, клієнтів, постачальників і громади
        - Прибуток — результат відносин, а не єдина мета
        - 'Коротку вигоду можна створити коштом інших: безпеки, довкілля, кредиторів'
        - 'Межа: виправдання безвідповідальності менеджменту'
    sources: [friedman-1970, freeman-1984, business-roundtable-2019, oecd-principles-2023]
    notes: >-
      Пояснення: найвідоміше формулювання пріоритету акціонерів належить Мілтону Фрідману, який у 1970 р. написав,
      що соціальна відповідальність бізнесу — збільшувати прибуток у межах правил гри, а менеджер, який витрачає гроші
      акціонерів на суспільні цілі, розпоряджається чужими коштами без згоди власників. Ще один аргумент: менеджер,
      підзвітний усім, не підзвітний нікому. Теорія стейкхолдерів не заперечує прибуток — вона заперечує, що прибуток
      виправдовує все. Приклад: у 2019 р. Business Roundtable оприлюднило заяву про мету корпорації, яку підписав
      181 генеральний директор, із зобов’язаннями перед клієнтами, працівниками, постачальниками, громадами
      й акціонерами; критики відповіли, що права директорів і практика винагороди не змінилися. Третій погляд —
      освічений пріоритет акціонерів: мета — довгострокова вартість, якої не досягти без урахування стейкхолдерів;
      цим шляхом ідуть Принципи G20/ОЕСР 2023. Питання до аудиторії: наведіть рішення, яке створює вартість
      для акціонерів у короткій перспективі коштом інших стейкхолдерів.

  # 6. Корпоративне управління як система
  - id: section-system
    type: section
    number: 6
    title: 'Корпоративне управління як система: Принципи G20/ОЕСР 2023'
    notes: >-
      Тепер можна дати визначення поняттю, яке дало назву курсу, і побачити, з яких шарів складається система.

  - id: governance-definition
    type: bullets
    title: Що таке корпоративне управління
    bullets:
      - Система відносин між менеджментом, радою, акціонерами та іншими стейкхолдерами
      - Правила й механізми, через які визначають цілі, засоби їх досягнення й контроль за результатами
      - Менеджмент веде бізнес; корпоративне управління — в чиїх інтересах і під чиїм наглядом
      - 'Правовий шар: закони й регулятори встановлюють мінімум'
      - 'Рекомендаційний шар: кодекси за принципом «дотримуйся або пояснюй»'
      - 'Внутрішній шар: статут, положення про органи, корпоративний договір, політики'
    sources: [oecd-principles-2023, nssmc-cg-code-2020]
    notes: >-
      Пояснення: робоче визначення курсу — переказ формулювання з розділу «Про Принципи» Принципів G20/ОЕСР. Це не
      «управління корпорацією»: менеджмент — те, як компанія працює; корпоративне управління — те, як компанією керують
      ті, хто в ній не працює: як обирають менеджмент, ставлять йому цілі, стежать за результатом і розподіляють
      вигоди. Закон закріплює ядро системи: наглядова рада захищає права всіх акціонерів, у межах компетенції управляє
      товариством і контролює та регулює діяльність виконавчого органу (ст. 69 ч. 1, legal-baseline AT-46); статут
      обирає дворівневу або однорівневу структуру (ст. 4, legal-baseline AT-03). Приклад: в Україні рекомендаційний
      шар — Кодекс корпоративного управління НКЦПФР 2020 р.; компанія або виконує рекомендацію, або публічно пояснює,
      чому ні (legal-baseline KKU-04). Питання до аудиторії: знайдіть у формулюванні про наглядову раду агентську
      теорію — кого рада захищає і за ким стежить?

  - id: oecd-principles
    type: norm
    title: Шість розділів Принципів G20/ОЕСР 2023
    text: >-
      I — основа ефективної системи корпоративного управління. II — права акціонерів, рівне ставлення до них
      і ключові функції власності. III — інституційні інвестори, фондові ринки та інші посередники. IV — розкриття
      інформації і прозорість. V — відповідальність ради. VI — сталий розвиток і стійкість.
    lawRef:
      act: G20/OECD Principles of Corporate Governance 2023 (OECD Publishing, опубліковано 11.09.2023)
      article: розділи I–VI (MS-01)
      checkedAt: '2026-09-14'
      url: https://www.oecd.org/en/publications/g20-oecd-principles-of-corporate-governance-2023_ed750b30-en.html
    sources: [oecd-principles-2023]
    notes: >-
      Пояснення: Принципи вперше видано 1999 р., переглянуто 2015 р., а чинна редакція опублікована 11 вересня 2023 р.
      Вони не є обов’язковими — це орієнтир для законодавців, регуляторів і бірж, тому «п’ять принципів ОЕСР 1999 року»
      зі старих підручників не використовуємо. Зв’яжіть розділи з лекцією: I і IV зменшують інформаційну асиметрію;
      II захищає того, хто володіє, але не контролює; V описує головний інструмент моніторингу — раду; III з’явився,
      бо сучасний акціонер — найчастіше пенсійний або інвестиційний фонд; VI — відповідь на суперечку про стейкхолдерів.
      Приклад: Кодекс НКЦПФР побудовано на редакції Принципів 2015 р., а його «Вимоги» спираються на закон 2008 р.,
      тож їх треба звіряти з чинним Законом № 2465-IX (legal-baseline KKU-05). Питання до аудиторії: який розділ
      безпосередньо захищає міноритаріїв від зловживань контролюючих осіб? Відповідь: розділ II.

  # 7. Корпоративне управління і вартість
  - id: section-value
    type: section
    number: 7
    title: Корпоративне управління і вартість компанії
    notes: >-
      Лишилося питання, яке ставить кожен практик: навіщо все це коштом акціонерів?

  - id: value-channels-figure
    type: figure
    title: Чотири канали впливу на вартість
    figure: fig-04-value-channels.svg
    caption: Рисунок 4. Канали впливу корпоративного управління на вартість компанії. Кожен канал працює в обидва боки.
    sources: [shleifer-vishny-1997]
    notes: >-
      Пояснення: рада, аудит, незалежні директори й розкриття коштують грошей, але підвищують вартість чотирма каналами.
      Грошові потоки: контроль пов’язаних правочинів збільшує частину прибутку, яка дістається всім інвесторам. Якість
      рішень: рада з незалежними членами ставить незручні питання до помилки, а не після. Вартість капіталу: інвестор,
      який не довіряє управлінню, вимагає вищої доходності — це премія за ризик бути обдуреним; огляд Шляйфера й Вішні
      1997 р. описує корпоративне управління як способи, якими постачальники капіталу забезпечують собі повернення
      інвестицій. Доступ до капіталу: прозора структура власності відкриває біржу, міжнародні банки й фонди. Приклад:
      фонд, який за своїми правилами не купує акції компаній без незалежних директорів, до компанії із заплутаним
      контролем просто не прийде. Питання до аудиторії: через який канал слабке управління безпосередньо підвищує
      вартість капіталу? Відповідь: інвестори вимагають вищої премії за ризик.

  - id: weak-governance-cost
    type: bullets
    title: Ціну слабкого управління платять ті, хто не контролював
    bullets:
      - Слабке управління руйнує вартість тими самими чотирма каналами
      - 'ПриватБанк: нестача капіталу на 1 грудня 2016 р. — 148 млрд грн (дані НБУ)'
      - 'Enron: банкрутство 2 грудня 2001 р. і закон Сарбейнза — Окслі'
      - Платять міноритарії, кредитори, вкладники, працівники і держава
    sources: [nbu-privatbank-2016, minfin-privatbank-2025, crs-enron-chronology, crs-sox-2002, gao-enron-401k-2002]
    notes: >-
      Пояснення: ціна слабкого корпоративного управління вимірюється не лише в грошах акціонерів. У випадку ПриватБанку
      докапіталізацію оплатили платники податків — після того, що суд в Англії згодом назвав схемою привласнення
      коштів контролюючими акціонерами. У випадку Enron слабке управління завершилося банкрутством і новим
      законодавством: вимоги закону Сарбейнза — Окслі відтоді виконує кожна публічна компанія США. Приклад: працівники
      Enron втратили не лише роботу — на кінець 2000 р. 63 % активів їхнього пенсійного плану 401(k) становили акції
      самої компанії. Питання до аудиторії: хто в кожному з двох випадків контролював рішення, а хто заплатив?
      Перейдімо до кейсів.

  # Кейси
  - id: case-privatbank
    type: case
    title: 'ПриватБанк: пов’язане кредитування і ціна контролю'
    case: privatbank
    facts:
      - '18.12.2016: банк визнано неплатоспроможним; уряд ухвалив перехід у 100 % власність держави'
      - 'Кошти фізичних осіб — 151,2 млрд грн, або 84 % коштів клієнтів (на 31.12.2016)'
      - 'Позиція НБУ: понад 97 % корпоративного портфеля — кредити пов’язаним компаніям'
      - 'Високий суд Англії, 30.07.2025: відповідачі привласнили майже 2 млрд дол. США'
      - '10.11.2025 стягнуто понад 3 млрд дол. США; 22.05.2026 апеляцію відхилено'
    question: Які пари відносин є в цій історії, які з них агентські і які механізми корпоративного управління не спрацювали?
    sources: [nbu-privatbank-2016, privatbank-fs-2017, minfin-privatbank-2025, essex-court-privatbank-2025, blackstone-privatbank-2026, forbes-privatbank-2026, suspilne-privatbank-2025]
    notes: >-
      Пояснення: це не випадок Берлі й Мінза, а концентрована власність — контролюючі акціонери фактично керували банком.
      Розведіть пари: акціонери — менеджмент (агентська пара, але менеджмент підконтрольний власникам, тому конфлікту
      майже не було); контролюючий акціонер — міноритарії (конфлікт «принципал — принципал»); банк — вкладники
      й кредитори (відносини боргу й довіри, а не доручення, проте ризик падає саме на них); держава — регулятор
      і гарант вкладів, який платить, коли решта механізмів не спрацювала. Не спрацювали контроль правочинів
      із пов’язаними особами, поки рада й менеджмент підпорядковувалися тим самим особам, що й позичальники; розкриття
      кінцевих бенефіціарів позичальників; нагляд регулятора, який завершився виведенням банку з ринку. Чи міг нагляд
      подіяти раніше — питання для обговорення, а не встановлений факт. Обережно з висновками: частка пов’язаних
      кредитів — позиція НБУ; встановлений судом факт — схема «рециркуляції кредитів» 2013–2014 рр. і стягнення.
      Заява банку, що рішення остаточне і він розпочинає стягнення активів, — позиція сторони. В Україні 26.02.2025 Верховний Суд залишив у силі закриття провадження за позовом колишніх власників, але
      законність рішень 2016 р. по суті суди не оцінювали. Питання до аудиторії: хто в цій історії принципал, а хто
      агент, і чи є такі в парі «банк — вкладник»?

  - id: case-enron
    type: case
    title: 'Enron: рада, яка дозволила конфлікт інтересів'
    case: enron
    facts:
      - 'Власність розпорошена: усі директори й топменеджери — 3,44 % голосуючих акцій'
      - 'Кінець 2000 р.: 63 % активів пенсійного плану 401(k) — акції самої Enron'
      - Рада тричі дала винятки з кодексу поведінки для фондів LJM фінансового директора
      - '8.11.2001 — перерахування прибутку за 1997–2001 рр.; 2.12.2001 — банкрутство'
      - 'Підкомітет Сенату США (8.07.2002, не суд): серед шести висновків — брак незалежності'
      - '30.07.2002 — закон Сарбейнза — Окслі: незалежний аудиторський комітет'
    question: Чому в публічній компанії з радою директорів, кодексом поведінки й відомим аудитором агентська проблема дійшла до банкрутства?
    sources: [enron-proxy-2001, gao-enron-401k-2002, crs-enron-chronology, senate-enron-board-2002, crs-sox-2002, doj-enron-verdicts-2006]
    notes: >-
      Пояснення: класичний конфлікт «менеджмент — акціонери» публічної компанії: менеджмент розпоряджався активами
      й інформацією, а акціонери дізналися про справжній стан справ лише з перерахування звітності. Позабалансові
      структури приховували борги й збитки — це інформаційна асиметрія в чистому вигляді. Фінансовий директор Ендрю
      Фастов одночасно керував компанією і фондами LJM1, LJM2 і LJM3, які укладали угоди з Enron, тобто був агентом
      обох сторін угоди; рада не заборонила це, а дозволила як виняток. У раді з 15 осіб лише двоє були виконавчими,
      але, за висновками підкомітету, фінансові зв’язки з компанією мала більшість зовнішніх директорів. Обережно
      з висновками: звіт Сенату — висновки органу розслідування, а не рішення суду; 25.05.2006 присяжні визнали винними
      колишніх керівників Кеннета Лея і Джеффрі Скіллінга. Приклад: працівники втратили двічі — роботу і пенсійні
      заощадження, складені переважно з акцій роботодавця. Питання до аудиторії: порівняйте з ПриватБанком — хто
      ухвалював рішення і хто втрачав у кожному кейсі?

  # Питання до аудиторії
  - id: question-conflict
    type: question
    prompt: Контролюючий акціонер закуповує сировину для товариства у власної фірми за цінами, вищими за ринкові, і роками не виплачує дивіденди. Який це конфлікт?
    options:
      - Конфлікт «менеджмент — акціонери»
      - Конфлікт мажоритарних і міноритарних акціонерів
      - 'Конфлікту немає: мажоритарій вклав більше'
    notes: >-
      Дайте хвилину на голосування руками, потім попросіть обґрунтувати кожен варіант. Правильна відповідь — конфлікт
      мажоритарних і міноритарних акціонерів: дохід від завищених цін отримує лише контролюючий акціонер, а міноритарії
      несуть збиток пропорційно своїй частці. Проти цього конфлікту працює контроль правочинів із заінтересованістю.
      Чому не перший варіант: менеджмент тут виконує волю контролюючого власника, а втрачають не всі акціонери, а ті,
      хто не контролює. Чому не третій: мажоритарій має право на більшу частку дивідендів, але не на дохід в обхід
      решти акціонерів.

  - id: question-ethics
    type: question
    prompt: Закриття збиткового заводу в мономісті підвищить прибуток на акцію, але без роботи залишаться 1 200 працівників. Яке рішення відповідає освіченому пріоритету акціонерів?
    options:
      - 'Закрити негайно: наслідки для міста раду не стосуються'
      - Порівняти варіанти за впливом на довгострокову вартість, урахувавши репутацію і ринок праці
      - Не закривати за жодних умов
    notes: >-
      Правильна відповідь — порівняти варіанти за впливом на довгострокову вартість. Освічений пріоритет акціонерів
      тримає мету — довгострокову вартість, але визнає, що її не досягти без урахування інтересів стейкхолдерів;
      етичний аспект — хто несе ціну рішення. Перший варіант — пріоритет акціонерів у крайній формі: він ігнорує,
      що репутація і відносини з регулятором і персоналом впливають на довгострокову вартість. Третій — стейкхолдерський
      підхід у крайній формі: без критерію вартості менеджмент, підзвітний усім, не підзвітний нікому, а збитковий
      завод зрештою загрожує і працівникам. Попросіть сформулювати власну позицію одним реченням і назвати межу,
      за якою вона стає виправданням.

  - id: summary
    type: summary
    title: Підсумок лекції
    bullets:
      - Корпорація збирає капітал у величезних масштабах, але власники не ухвалюють рішень
      - Відокремлення власності від контролю породжує агентську проблему
      - Агентські витрати — сума моніторингу, гарантування і залишкових втрат
      - 'Розпорошена власність — нагляд за менеджментом; концентрована — захист меншості'
      - Пріоритет акціонерів чи стейкхолдери — етичний вибір, у кожного підходу є межа
      - Якісне управління створює вартість, слабке — перекладає ціну на тих, хто не контролює
    notes: >-
      Поверніться до питання з першого слайда: що мало б запобігти тому, щоб гроші вкладників опинилися під контролем
      кількох осіб. Відповідь лекції — механізми корпоративного управління, які закривають розрив між тими, хто володіє,
      і тими, хто контролює. Приклад для самостійної роботи: за кейсом ПриватБанку складіть схему відносин між
      акціонерами, менеджментом, вкладниками і державою і для кожної пари визначте, чи є вона агентською, а якщо
      так — хто принципал, а хто агент. Питання до аудиторії: яке одне речення з лекції ви запишете в конспект
      як головне? Далі — самоперевірка в лонгріді і тренувальний тест теми 1.
