<svg xmlns="http://www.w3.org/2000/svg" id="fig-t01-2" class="scheme" viewBox="0 0 560 372" role="img" aria-labelledby="fig-t01-2-title fig-t01-2-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="fig-t01-2-title">Рисунок 2. Три складові агентських витрат за Дженсеном і Меклінгом</title>
  <desc id="fig-t01-2-desc">Три блоки один під одним, з’єднані знаками «плюс», і підсумковий блок унизу. Перший: витрати на моніторинг — несе принципал (аудит, наглядова рада, звітність). Другий: витрати на гарантування — несе сам агент (договірні обмеження, гарантії й застава, добровільний аудит). Третій: залишкові втрати — рішення агента, яких не вдалося запобігти; позначено карміновим як елемент, що не зникає. Підсумок: агентські витрати дорівнюють сумі трьох складових.</desc>
  <style>
    #fig-t01-2 .box { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-2 .box-owner { fill: var(--surface-tint, #eef4fa); }
    #fig-t01-2 .t { fill: var(--ink, #0f1c2e); font-size: 15px; font-weight: 650; }
    #fig-t01-2 .s { fill: var(--ink-2, #445570); font-size: 12.5px; }
    #fig-t01-2 .lbl { fill: var(--ink-2, #445570); font-size: 12px; }
    #fig-t01-2 .plus { fill: var(--ink, #0f1c2e); font-size: 20px; font-weight: 600; text-anchor: middle; }
    #fig-t01-2 .refc { fill: var(--surface, #ffffff); stroke: var(--ink, #0f1c2e); stroke-width: 1.25; }
    #fig-t01-2 .refn { fill: var(--ink, #0f1c2e); font-size: 11.5px; font-weight: 700; text-anchor: middle; }
    #fig-t01-2 .exam { stroke: var(--err, #b42318); }
    #fig-t01-2 .exam-t { fill: var(--err-ink, #8f1d14); font-size: 12px; font-weight: 600; }
  </style>

  <rect class="box" x="60" y="14" width="440" height="66" rx="6"/>
  <text class="t" x="76" y="40">Витрати на моніторинг</text>
  <text class="s" x="76" y="62">несе принципал: аудит, наглядова рада, звітність</text>
  <text class="plus" x="280" y="105">+</text>

  <rect class="box" x="60" y="118" width="440" height="66" rx="6"/>
  <text class="t" x="76" y="144">Витрати на гарантування</text>
  <text class="s" x="76" y="166">несе сам агент: договірні обмеження, застава, добровільний аудит</text>
  <text class="plus" x="280" y="209">+</text>

  <rect class="box exam" x="60" y="222" width="440" height="66" rx="6"/>
  <text class="t" x="76" y="248">Залишкові втрати</text>
  <text class="exam-t" x="76" y="270">рішення агента, яких не вдалося запобігти</text>
  <text class="plus" x="280" y="313">=</text>

  <rect class="box box-owner" x="60" y="322" width="440" height="40" rx="6"/>
  <text class="t" x="280" y="347" text-anchor="middle">Агентські витрати</text>

  <circle class="refc" cx="44" cy="30" r="11"/><text class="refn" x="44" y="34">1</text>
  <circle class="refc" cx="44" cy="134" r="11"/><text class="refn" x="44" y="138">2</text>
  <circle class="refc exam" cx="44" cy="238" r="11"/><text class="refn exam-n" x="44" y="242">3</text>
  <circle class="refc" cx="516" cy="342" r="11"/><text class="refn" x="516" y="346">4</text>
</svg>
