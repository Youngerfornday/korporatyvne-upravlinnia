        answer: Захист тих, хто володіє часткою, але не контролює рішень
        feedback: >-
          Цей розділ спрямований насамперед проти зловживань контролюючих осіб щодо міноритаріїв.
      - prompt: Розділ IV. Розкриття інформації і прозорість
        answer: Зменшення інформаційної асиметрії між компанією та інвесторами
        feedback: >-
          Повна звітність і аудит здешевлюють принципалу контроль за агентом.
      - prompt: Розділ V. Відповідальність ради
        answer: Побудова головного механізму моніторингу агента принципалами
        feedback: >-
          Рада — той орган, через який акціонери наглядають за менеджментом і вимагають підзвітності.
      - prompt: Розділ VI. Сталий розвиток і стійкість
        answer: Врахування інтересів стейкхолдерів і кліматичних ризиків
        feedback: >-
          Новий розділ увібрав колишній розділ про роль стейкхолдерів і додав кліматичні ризики.
    distractors:
      - Визначення черговості вимог кредиторів під час банкрутства
      - Встановлення обов’язкових ставок винагороди виконавчого органу
    lawRef:
      - act: G20/OECD Principles of Corporate Governance 2023 (OECD Publishing)
        article: розділи I–VI (MS-01)
        checkedAt: '2026-09-14'
        url: https://www.oecd.org/en/publications/g20-oecd-principles-of-corporate-governance-2023_ed750b30-en.html

