  # --- Розуміння (5) ---

  - id: t03-q006
    type: multichoice
    topic: t03
    bloom: understand
    single: true
    stem: Чому приватне акціонерне товариство, яке стає публічним, не створює нової юридичної особи?
    generalFeedback: >-
      Закон розводить дві різні дії. Перетворення змінює організаційно-правову форму й породжує правонаступника.
      Зміна типу товариства такою дією не є: юридична особа залишається тією самою, майно не переоформлюють,
      змінюють лише статут. Водночас створити публічне товариство «з нуля» не можна — воно з’являється або
      зі зміни типу приватного, або з перетворення іншого господарського товариства.
    answers:
      - text: Бо публічне товариство є новим товариством, а попереднє водночас ліквідують
        fraction: 0
        feedback: >-
          Ліквідації тут немає: товариство продовжує існувати з тим самим кодом і тим самим майном.
      - text: Бо перетворення товариства закон дозволяє лише за рішенням суду
        fraction: 0
        feedback: >-
          Перетворення — звичайна корпоративна процедура за рішенням власників, а не судова справа.
      - text: Бо закон прямо називає зміну типу такою, що не є перетворенням товариства
        fraction: 100
        feedback: >-
          Так. Це пряма норма закону, і саме вона пояснює, чому правонаступник не потрібен.
      - text: Бо тип товариства зазначають у найменуванні, а найменування змінюють вільно
        fraction: 0
        feedback: >-
          Тип узагалі не обов’язково зазначати в найменуванні, і справа не в назві, а в статусі юридичної особи.
    lawRef:
      - act: Закон України «Про акціонерні товариства» № 2465-IX
        article: ст. 6 ч. 1–4 (AT-01)
        checkedAt: '2026-09-14'
        url: https://zakon.rada.gov.ua/laws/show/2465-20

  - id: t03-q007
    type: multichoice
    topic: t03
    bloom: understand
    single: false
    stem: >-
      Що саме відрізняє товариство з додатковою відповідальністю від товариства з обмеженою відповідальністю
      за Законом України № 2275-VIII?
    generalFeedback: >-
      Обидві форми живуть за одним законом, і відмінність у них єдина, але принципова. Учасники товариства
      з додатковою відповідальністю солідарно несуть додаткову (субсидіарну) відповідальність власним майном
      у розмірі, однаково кратному до вкладу кожного; кратність визначає статут, а конкретного числа закон
      не називає. У решті — капітал, частки, органи, вихід учасника — діють правила про товариство з обмеженою
      відповідальністю.
    answers:
      - text: Учасники додатково відповідають за зобов’язаннями товариства власним майном
        fraction: 33.33333
        feedback: >-
          Так. Відповідальність субсидіарна: кредитор спершу звертається до товариства і лише за браком
          його майна доходить до учасників.
      - text: Розмір додаткової відповідальності учасників встановлює статут товариства
        fraction: 33.33333
        feedback: >-
          Так. Саме товариство обирає число, а закон лише вимагає, щоб воно було в статуті.
      - text: Кратність додаткової відповідальності однакова для всіх учасників товариства
        fraction: 33.33333
        feedback: >-
          Так. Множник один для всіх, а гривнева сума в кожного своя, бо рахується від його власного вкладу.
      - text: Закон встановлює додаткову відповідальність у трикратному розмірі вкладу
        fraction: -33.33333
        feedback: >-
          Конкретної кратності закон не встановлює: питання «скільки саме» правильної відповіді в законі не має.
      - text: Порядок скликання зборів учасників регулює окремий спеціальний закон
        fraction: -33.33333
        feedback: >-
          Окремого закону немає: до товариства з додатковою відповідальністю застосовують норми про товариство
          з обмеженою відповідальністю, що не суперечать спеціальній статті.
    lawRef:
      - act: Закон України «Про товариства з обмеженою та додатковою відповідальністю» № 2275-VIII
        article: ст. 56 ч. 1–3 (TOV-16)
        checkedAt: '2026-09-17'
        url: https://zakon.rada.gov.ua/laws/show/2275-19#n381

