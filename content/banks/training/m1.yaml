    stem: >-
      У банку два контролюючі акціонери. За позицією регулятора, понад 97 % корпоративного кредитного портфеля
      становлять кредити компаніям, пов’язаним з цими акціонерами; близько половини пасивів банку — вклади
      населення. Наглядову раду і правління сформували ті самі акціонери. Який висновок про природу конфлікту
      і про механізм, що мав би його стримати, є коректним?
    generalFeedback: >-
      Щоб визначити тип конфлікту, поставте два питання: хто фактично ухвалює рішення і хто від цих рішень
      втрачає. Тут рішення ухвалюють контролюючі власники, а втрачають ті, хто не контролює, — вкладники,
      кредитори і зрештою держава. Проти такого конфлікту працюють контроль правочинів із заінтересованістю,
      розкриття кінцевих бенефіціарів і незалежні голоси в раді.
    answers:
      - text: Це конфлікт менеджменту з акціонерами; стримати його мала винагорода за курсом акцій
        fraction: 0
        feedback: >-
          Менеджмент тут підпорядкований власникам і виконує їхню волю, тож конфлікт не між ним і власниками;
          прив’язка винагороди до курсу акцій нічого не змінила б.
      - text: Це конфлікт власників з вкладниками і кредиторами; стримати його мав контроль пов’язаних угод
        fraction: 100
        feedback: >-
          Так. Вигоду отримували контролюючі акціонери, а ризик несли вкладники й кредитори; спрацювати мали
          контроль угод з пов’язаними особами і розкриття кінцевих бенефіціарів.
      - text: Це конфлікт наглядової ради з правлінням; стримати його мав розподіл повноважень у статуті
        fraction: 0
        feedback: >-
          Рада і правління сформовані тими самими особами й діють узгоджено, тож конфлікту між органами тут немає.
      - text: Це не агентський конфлікт; акціонери розпоряджаються власним банком на власний розсуд
        fraction: 0
        feedback: >-
          Банк розпоряджається не власними коштами, а грошима вкладників, тому його власники є агентами щодо них.

