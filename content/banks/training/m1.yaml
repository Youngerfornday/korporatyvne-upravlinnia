      до мінімальної заробітної плати на день створення; у товаристві з обмеженою відповідальністю її немає
      взагалі, а закон дисциплінує учасника строком внесення вкладу.
    choices:
      - text: '200'
        feedback: >-
          Множник саме 200; числа зі старих методичок стосувалися законодавства, якого вже немає.
      - text: мінімального розміру не встановлює
        feedback: >-
          Статутний капітал такого товариства може становити й одну гривню, і державний реєстратор його зареєструє.
      - text: шести місяців з дня державної реєстрації
        feedback: >-
          Це загальний строк внесення вкладу; статут може встановити інший.
      - text: '1250'
        feedback: >-
          Це число зі старих джерел про закон, який втратив чинність; у чинному законодавстві такої вимоги немає.
      - text: одного року з дня державної реєстрації
        feedback: >-
          Річний строк закон встановлює для іншого випадку — виплати вартості частки учасникові, який вийшов.
    lawRef:
