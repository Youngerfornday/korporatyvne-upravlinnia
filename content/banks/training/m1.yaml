    bloom: remember
    stem: >-
      Оцініть твердження. Господарський кодекс України втратив чинність 28.08.2025, тому діяльність акціонерних
      товариств регулює Закон України «Про акціонерні товариства» № 2465-IX.
    generalFeedback: >-
      28.08.2025 — день введення в дію Закону № 4196-IX; з цієї дати Господарський кодекс не діє. Акціонерні
      товариства регулює Закон № 2465-IX, товариства з обмеженою відповідальністю — Закон № 2275-VIII.
    correct: true
    feedbackTrue: >-
      Так. Господарський кодекс № 436-IV втратив чинність з дня введення в дію Закону № 4196-IX, і будь-яке
      твердження про «корпоративні підприємства за Господарським кодексом» сьогодні застаріле.
    feedbackFalse: >-
      Ні, твердження правильне. Кодекс не діє з 28.08.2025, а норми про акціонерні товариства залишилися
      в Законі № 2465-IX, чинному з 2023 року.
    lawRef:
