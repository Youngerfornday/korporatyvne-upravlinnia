    correct: true
    feedbackTrue: >-
      Так. Господарський кодекс № 436-IV втратив чинність з дня введення в дію Закону № 4196-IX, і будь-яке
      твердження про «корпоративні підприємства за Господарським кодексом» сьогодні застаріле.
    feedbackFalse: >-
      Ні, твердження правильне. Кодекс не діє з 28.08.2025, а норми про акціонерні товариства залишилися
