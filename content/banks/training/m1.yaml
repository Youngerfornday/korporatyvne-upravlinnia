    bloom: understand
    stem: Установіть відповідність між умовою і рівнем правил, на якому її можна встановити.
    generalFeedback: >-
      Правила лежать трьома шарами. Закон встановлює мінімум, якого не обійти. Статут робить вибір там,
      де закон залишив варіанти, і орієнтир для пошуку таких місць — формула «якщо статут не встановлює
      іншого». Корпоративний договір додає домовленість конкретних сторін, але імперативних норм не змінює.
    pairs:
