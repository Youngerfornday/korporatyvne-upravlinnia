    bloom: understand
    stem: >-
      Установіть відповідність між розділом Принципів G20/ОЕСР 2023 року та проблемою корпоративного управління,
      яку він розв’язує.
    generalFeedback: >-
      Структура Принципів повторює логіку теми: розкриття інформації зменшує інформаційну асиметрію, права
      акціонерів захищають того, хто володіє, але не контролює, розділ про раду описує головний інструмент
