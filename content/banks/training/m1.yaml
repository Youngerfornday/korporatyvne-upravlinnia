  - id: t03-q015
    type: multichoice
    topic: t03
    bloom: analyze
    single: true
    stem: >-
      Аналітик узяв таблиці ЄДРПОУ, порівняв рядок «Публічне акціонерне товариство» за 2020 рік з рядком
      «Відкрите акціонерне товариство» за 2026 рік і зробив висновок, що українські компанії масово
      відмовляються від публічності. У чому головна вада цього висновку?
    generalFeedback: >-
      Перевірка чужого висновку з даних починається з питання, чи порівнювані самі рядки. Поділ акціонерних
      товариств за типами між таблицями до 2021 року і з 2022 року непорівнянний: у ранніх таблицях є
      «публічне» і «приватне», у пізніших — «Відкрите» і «Закрите», причому це рядки статистичного
      класифікатора, а не типи за чинним законом. Тому тренд рахують лише за загальною кількістю акціонерних
      товариств.
    answers:
      - text: Рядки за типами товариств у таблицях різних років непорівнянні між собою
        fraction: 100
        feedback: >-
          Так. Назви «відкрите» й «закрите» живуть у класифікаторі, хоча в праві їх немає з 01.01.2023.
      - text: Дані реєстру показують діючі товариства, а висновок стосується зареєстрованих
        fraction: 0
        feedback: >-
          Застереження перевернуто: реєстр показує саме зареєстрованих суб’єктів, а не діючих.
      - text: Дані реєстру охоплюють усю територію держави, тож потрібна поправка на це
        fraction: 0
        feedback: >-
          Застереження теж перевернуто: дані не охоплюють тимчасово окуповану територію, про що сказано
          в примітці до таблиць.
      - text: Кількість публічних товариств не змінювалася, тому будь-який тренд хибний
        fraction: 0
        feedback: >-
          Твердження про незмінність з наявних рядків не випливає; проблема саме в тому, що рядки описують різне.
