  - id: t01-q003
    type: matching
    topic: t01
    bloom: remember
    stem: Установіть відповідність між поняттям агентської теорії та його визначенням.
    generalFeedback: >-
      Агентські відносини — це доручення діяти від чужого імені. Принципал доручає, агент виконує, інформаційна
      асиметрія заважає перевірити агента, а залишкові втрати лишаються навіть після моніторингу й гарантій.
    pairs:
      - prompt: Принципал
        answer: Сторона, яка доручає діяти у своїх інтересах і несе наслідки чужих рішень
        feedback: >-
          Принципалами є акціонери щодо менеджменту, а щодо контролюючого акціонера — міноритарії, кредитори
          і вкладники, чиї кошти він фактично контролює.
      - prompt: Агент
        answer: Сторона, якій доручено діяти від чужого імені й розпоряджатися чужими ресурсами
        feedback: >-
          Агентами в корпорації є виконавчий орган і члени ради; вони мають діяти добросовісно в інтересах
          товариства, а не у власних.
      - prompt: Інформаційна асиметрія
        answer: Нерівність знань сторін про справжній стан справ і якість ухвалених рішень
        feedback: >-
          Саме асиметрія перетворює розбіжність інтересів на проблему: принципал не може безкоштовно відрізнити
          невдачу через ринок від невдачі через недбалість.
      - prompt: Залишкові втрати
        answer: Збитки принципала від рішень агента, яким не запобігли моніторинг і гарантії
        feedback: >-
          Це третя складова агентських витрат. Звести її до нуля неможливо: у певний момент ще одна гривня
          на аудит коштує більше, ніж втрати, яким вона запобігає.
    distractors:
      - Плата посередника за пошук контрагента й укладення договору між сторонами
      - Обов’язок агента відшкодувати принципалу весь недоотриманий ним прибуток

  - id: t01-q004
    type: ddwtos
    topic: t01
    bloom: remember
    stem: >-
      Агентські витрати за Дженсеном і Меклінгом складаються з трьох частин. [[1]] оплачує принципал, щоб бачити
      дії агента. [[2]] бере на себе агент, щоб довести свою добросовісність. [[3]] виникають попри перші дві
      частини і саме тому потребують окремої назви.
    generalFeedback: >-
      Агентські витрати — сума витрат на моніторинг, витрат на гарантування і залишкових втрат. Мета
      корпоративного управління — мінімізувати цю суму, а не якусь одну складову.
    choices:
      - text: Витрати на моніторинг
        feedback: >-
          Наглядова рада, зовнішній і внутрішній аудит, звітність, корпоративний секретар — це ціна спостереження
          за агентом, яку платить принципал.
      - text: Витрати на гарантування
        feedback: >-
          Опціони, обмеження на угоди з пов’язаними особами, страхування відповідальності й зобов’язання
          не конкурувати агент бере на себе сам, щоб йому повірили.
      - text: Залишкові втрати
        feedback: >-
          Це збитки від рішень агента, які він усе одно ухвалив попри моніторинг і гарантії. Компанія без ради
          і без аудиту просто переносить усю суму сюди.
      - text: Трансакційні витрати
        feedback: >-
          Витрати на пошук контрагента й укладення угод до складу агентських витрат за Дженсеном і Меклінгом
          не входять.
      - text: Адміністративні штрафи
        feedback: >-
          Штрафи регуляторів — можливий наслідок слабкого управління, але не окрема складова агентських витрат.

  - id: t01-q005
    type: multichoice
    topic: t01
    bloom: remember
    single: true
    stem: Які типи акціонерних товариств передбачає чинний Закон України «Про акціонерні товариства» № 2465-IX?
    generalFeedback: >-
      Закон № 2465-IX знає лише два типи товариств — публічне і приватне; тип визначає статут, а його зміна
      не є перетворенням. Публічним є товариство, щодо акцій якого була здійснена публічна пропозиція або акції
      якого допущені до торгів на організованому ринку капіталу.
    answers:
      - text: Відкриті й закриті акціонерні товариства
        fraction: 0
        feedback: >-
          Поділ на відкриті й закриті залишився в Законі № 514-VI, який втратив чинність 01.01.2023.
      - text: Публічні й народні акціонерні товариства
        fraction: 0
        feedback: >-
          Публічне товариство закон знає, а «народного» типу в українському законодавстві немає.
      - text: Відкриті й приватні акціонерні товариства
        fraction: 0
        feedback: >-
          Приватне товариство закон знає, а відкрите — це форма зі скасованого Закону № 514-VI.
      - text: Публічні й приватні акціонерні товариства
        fraction: 100
        feedback: >-
          Так. Це вичерпний перелік типів; публічну пропозицію власних акцій може робити лише публічне товариство.
    lawRef:
      - act: Закон України «Про акціонерні товариства» № 2465-IX
        article: ст. 6 ч. 1–4 (AT-01)
        checkedAt: '2026-09-14'
        url: https://zakon.rada.gov.ua/laws/show/2465-20

  # --- Розуміння (5) ---

  - id: t01-q006
    type: multichoice
    topic: t01
    bloom: understand
    single: true
    stem: >-
      Чому відокремлення власності від контролю є проблемою, а не просто зручним поділом праці між власниками
      й керівниками?
    generalFeedback: >-
      Сам по собі поділ праці проблеми не створює. Її створює поєднання двох обставин: в агента є власні
      інтереси, а принципал не бачить його дій без витрат. Тому корпоративне управління — це насамперед спосіб
      здешевити спостереження за агентом.
    answers:
      - text: Бо керівник має власні інтереси, а власник не може безкоштовно перевірити його дії
        fraction: 100
        feedback: >-
          Так. Розбіжність інтересів разом з інформаційною асиметрією і перетворює поділ праці на агентську
          проблему.
      - text: Бо закон забороняє акціонерам передавати управління товариством найманим керівникам
        fraction: 0
        feedback: >-
          Закон, навпаки, будує корпорацію на централізованому управлінні: рішення ухвалюють органи товариства.
      - text: Бо акціонери втрачають право на дивіденди, щойно обирають виконавчий орган товариства
        fraction: 0
        feedback: >-
          Право на дивіденди належить акціонерові незалежно від того, хто саме керує товариством.
      - text: Бо рішення органів товариства не мають сили без письмової згоди кожного акціонера
        fraction: 0
        feedback: >-
          Рішення органів обов’язкові для товариства; окрема згода кожного акціонера для цього не потрібна.

  - id: t01-q007
    type: multichoice
    topic: t01
    bloom: understand
    single: false
    stem: Які з наведених дій контролюючого акціонера є проявом конфлікту мажоритарних і міноритарних акціонерів?
    generalFeedback: >-
      Конфлікт «принципал — принципал» полягає не в тому, що мажоритарій отримує більше, а в тому, що він
      отримує дохід в обхід дивідендів, тобто непропорційно до своєї частки. Пропорційні вигоди від більшого
      пакета акцій конфліктом не є.
    answers:
      - text: Закупівля сировини у власної фірми мажоритарія за цінами, вищими за ринкові
        fraction: 33.33333
        feedback: >-
          Так. Різниця в ціні дістається лише мажоритарію, а збиток несуть усі акціонери пропорційно часткам.
      - text: Додаткова емісія на користь пов’язаних осіб, що розмиває частки решти акціонерів
        fraction: 33.33333
        feedback: >-
          Так. Розмивання часток переносить вартість від міноритаріїв до контролюючого акціонера.
      - text: Багаторічна невиплата дивідендів при зростанні прибутку через пов’язані структури
        fraction: 33.33333
        feedback: >-
          Так. Прибуток є, але до міноритаріїв він не доходить: дохід іде повз дивіденди.
      - text: Голосування мажоритарія кількістю голосів, пропорційною до його пакета акцій
        fraction: -33.33333
        feedback: >-
          Це звичайна реалізація права голосу: одна голосуюча акція дає один голос, крім кумулятивного голосування.
      - text: Отримання мажоритарієм більшої суми дивідендів пропорційно до його пакета
        fraction: -33.33333
        feedback: >-
          Це справедливий розподіл: дивіденд на одну акцію однаковий, а сума залежить від кількості акцій.
    lawRef:
      - act: Закон України «Про акціонерні товариства» № 2465-IX
        article: ст. 27 ч. 1–2 (AT-13)
        checkedAt: '2026-09-14'
        url: https://zakon.rada.gov.ua/laws/show/2465-20

  - id: t01-q008
    type: truefalse
    topic: t01
    bloom: understand
    stem: >-
      Оцініть твердження. Принципи корпоративного управління G20/ОЕСР 2023 року є обов’язковими нормами прямої
      дії для компаній країн-учасниць G20.
    generalFeedback: >-
      Чинну редакцію Принципів опубліковано 11.09.2023, і вона містить шість розділів. Це орієнтир для
      законодавців, регуляторів і бірж, а не норма прямої дії. В Україні на Принципи спирається рекомендаційний
      Кодекс корпоративного управління НКЦПФР, тоді як мінімум вимог встановлює Закон № 2465-IX.
    correct: false
    feedbackTrue: >-
      Ні. Принципи є необов’язковими: вони адресовані державам і регуляторам, а компанію зобов’язує вже
      національний закон або правила лістингу, написані з їх урахуванням.
    feedbackFalse: >-
      Так. Принципи мають рекомендаційний характер; обов’язковою для компанії стає лише та їх частина, яку
      держава перенесла в закон, а біржа — у правила лістингу.
    lawRef:
      - act: G20/OECD Principles of Corporate Governance 2023 (OECD Publishing)
        article: розділи I–VI (MS-01)
        checkedAt: '2026-09-14'
        url: https://www.oecd.org/en/publications/g20-oecd-principles-of-corporate-governance-2023_ed750b30-en.html

  - id: t01-q009
    type: matching
