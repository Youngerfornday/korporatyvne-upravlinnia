  # --- Запам’ятовування (5) ---

  - id: t01-q001
    type: multichoice
    topic: t01
    bloom: remember
    single: true
    stem: Яка сукупність ознак відрізняє корпорацію від бізнесу фізичної особи-підприємця?
    generalFeedback: >-
      Корпорацію визначають три взаємопов’язані ознаки: обмежена відповідальність учасників, вільне відчуження
      часток і централізоване управління в органах товариства. Кожна тримає дві інші: без обмеженої
      відповідальності не буде вкладників, без вільного обігу часток — довгих інвестицій, без централізованого
      управління — працездатної компанії з тисячею власників.
    answers:
      - text: Необмежена відповідальність учасників, вільне відчуження часток і централізоване управління
        fraction: 0
        feedback: >-
          Необмежена відповідальність — ознака фізичної особи-підприємця, який відповідає всім своїм майном.
          Саме її корпорація й скасовує, щоб зібрати гроші тих, хто не готовий ризикувати квартирою.
      - text: Обмежена відповідальність учасників, вільне відчуження часток і централізоване управління
        fraction: 100
        feedback: >-
          Так. Ці три ознаки разом дають корпорації змогу збирати капітал сотень людей, які не беруть участі
          в управлінні заводом і не знають одне одного.
      - text: Обмежена відповідальність учасників, заборона відчуження часток і централізоване управління
        fraction: 0
        feedback: >-
          Заборона відчуження зробила б вкладення безстроковим: ніхто не вклав би гроші, не маючи змоги вийти,
          продавши акцію без згоди інших акціонерів.
      - text: Обмежена відповідальність учасників, вільне відчуження часток і управління кожним власником
        fraction: 0
        feedback: >-
          Управління кожним власником неможливе в товаристві з тисячею акціонерів: вони фізично не погоджували б
          щодня закупівлю сировини. Тому рішення ухвалюють органи товариства.

