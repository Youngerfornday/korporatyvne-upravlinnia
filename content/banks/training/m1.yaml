    generalFeedback: >-
      Корпоративний договір укладають лише в письмовій формі: недодержання форми робить його нікчемним,
      тобто недійсним без рішення суду. Усна домовленість засновників, хай яка щира, юридично не існує —
      і саме це найчастіше залишає від слів «ми ж домовлялися» порожнє місце.
    answers:
      - text: Письмової форми; недодержання форми робить договір нікчемним
        fraction: 100
        feedback: >-
          Так. Це правило однакове і для акціонерних товариств, і для товариств з обмеженою відповідальністю.
      - text: Письмової форми з нотаріальним посвідченням; інакше договір оспорюваний
        fraction: 0
        feedback: >-
