        feedback: >-
          Менеджмент тут підпорядкований власникам і виконує їхню волю, тож конфлікт не між ним і власниками;
          прив’язка винагороди до курсу акцій нічого не змінила б.
      - text: Це конфлікт власників з вкладниками і кредиторами; стримати його мав контроль пов’язаних угод
        fraction: 100
        feedback: >-
          Так. Вигоду отримували контролюючі акціонери, а ризик несли вкладники й кредитори; спрацювати мали
          контроль угод з пов’язаними особами і розкриття кінцевих бенефіціарів.
      - text: Це конфлікт наглядової ради з правлінням; стримати його мав розподіл повноважень у статуті
        fraction: 0
        feedback: >-
          Рада і правління сформовані тими самими особами й діють узгоджено, тож конфлікту між органами тут немає.
      - text: Це не агентський конфлікт; акціонери розпоряджаються власним банком на власний розсуд
        fraction: 0
        feedback: >-
          Банк розпоряджається не власними коштами, а грошима вкладників, тому його власники є агентами щодо них.
