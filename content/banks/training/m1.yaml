      - text: Будь-якої форми; недодержання письмової форми на силу договору не впливає
        fraction: 0
        feedback: >-
          Саме форма тут і є умовою чинності: без письмового тексту договору для права не існує.
      - text: Письмової форми і державної реєстрації; без реєстрації договір не укладено
        fraction: 0
        feedback: >-
          Реєструвати корпоративний договір не потрібно; понад те, його зміст за загальним правилом конфіденційний.
