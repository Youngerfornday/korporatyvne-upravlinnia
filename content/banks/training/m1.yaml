        answer: Корпоративний договір сторін
        feedback: >-
          Це індивідуальна домовленість, якій не місце в статуті, однаковому для всіх учасників — теперішніх
          і майбутніх.
      - prompt: Вибір однорівневої або дворівневої структури управління товариством
        answer: Статут товариства
        feedback: >-
          Закон дає два варіанти і залишає вибір статуту; зміна виду структури не є реорганізацією.
      - prompt: Поріг у три чверті голосів усіх учасників для зміни статуту товариства
        answer: Закон, якого не змінюють ні статутом, ні договором
        feedback: >-
          Корпоративний договір діє між сторонами і порогів голосування, встановлених законом, не переписує.
      - prompt: Додатковий обов’язок акціонера, не передбачений жодною нормою закону
        answer: Такий обов’язок встановити не можна
        feedback: >-
          Обов’язки акціонерів встановлює лише закон, тому статутом їх не додають.
    distractors:
