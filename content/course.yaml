# TODO(фаза 2): остаточні формулювання політик.
policies:
  attendance: Бали за відвідування не нараховуються.
  deadlines: Роботи, подані після терміну без поважної причини, оцінюються з пониженням, визначеним у силабусі.
  academicIntegrity: Роботи мають бути самостійними; виявлений плагіат або списування означає повторне виконання завдання.
  ai: Інструменти штучного інтелекту дозволені для пошуку ідей і перевірки мови з обов’язковим зазначенням; видавати згенерований текст за власний заборонено.
  bonusPoints: Додаткові бали можливі за участь у кейс-конкурсах і наукових заходах; сума балів не перевищує 100.
  retakes: Повторне складання підсумкового тесту — у терміни, визначені розкладом ліквідації академічної заборгованості.
