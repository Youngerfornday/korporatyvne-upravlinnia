      - statement: Пояснювати сучасний стан звітності зі сталого розвитку в ЄС і Україні та оцінювати її значення для стейкхолдерів.
        prn: [prn15]
    lectureQuestions:
      - Розкриття інформації як принцип корпоративного управління — регульована інформація, регулярна й особлива інформація.
      - Річна і проміжна інформація емітента — склад, строки, обсяг розкриття для ПАТ і ПрАТ.
      - Звіт керівництва і звіт про корпоративне управління за ст. 127 Закону № 3480-IV.
      - Кодекс корпоративного управління НКЦПФР і принцип «дотримуйся або пояснюй».
      - Звіт про управління за Законом № 996-XIV — хто подає, рекомендований зміст, категорії підприємств.
      - Звітність зі сталого розвитку в ЄС — CSRD, ESRS, Директива Omnibus I; стандарти ISSB.
      - Звітність зі сталого розвитку в Україні — стратегія КМУ і законопроєкт.
    hours: { lectures: 2, selfStudy: 6 }
    selfStudyTasks:
      - task: Прочитати лонгрід теми 9 і пройти самоперевірку.
        hours: 1
      - task: Знайти на SMIDA річну інформацію обраного емітента за 2025 р. і перевірити наявність звіту про корпоративне управління.
