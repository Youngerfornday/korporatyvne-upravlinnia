    title: КСВ, корпоративна культура й етика, КУ державних підприємств
    summary: Корпоративна соціальна відповідальність, культура й етика, особливості управління державними підприємствами.
    results:
      - statement: Пояснювати концепції корпоративної соціальної відповідальності, корпоративної культури й ділової етики та їх зв’язок зі стійкістю компанії.
        prn: [prn15]
      - statement: Розрізняти особливості корпоративного управління державних підприємств за Законом № 185-V і Настановами ОЕСР 2024.
        prn: [prn12]
      - statement: Аналізувати наслідки втручання держави як акціонера для незалежності наглядової ради на прикладі кейсів.
        prn: [prn12]
      - statement: Формувати судження щодо соціально відповідальної поведінки компанії з урахуванням інтересів стейкхолдерів.
        prn: [prn15]
    lectureQuestions:
      - Корпоративна соціальна відповідальність і сталий розвиток — від філантропії до інтеграції в стратегію; ISO 26000 як настанова.
