# Реєстр кейсів (docs/research/cases.md). Повна фабула — лише в primaryTopic; в інших темах — окремий аспект (focus).
# caveat — що не підтверджено першоджерелом і не може подаватися як факт.
cases:
  - id: privatbank
    title: ПриватБанк — виведення з ринку за участю держави (2016) і подальші суди
    region: ua
    primaryTopic: t01
    ref: { doc: cases, section: '1' }
    caveat: Рішення КСУ щодо Закону № 590-IX не знайдено; дані про пов’язане кредитування — позиція НБУ; норми Закону № 590-IX відсутні в legal-baseline.md.
  - id: naftogaz
    title: Нафтогаз — держава-акціонер, наглядова рада і зміни голови правління (2021–2026)
    region: ua
    primaryTopic: t11
    ref: { doc: cases, section: '2' }
    caveat: Судових рішень щодо подій 2021 р. немає — підстави звільнення є позиціями сторін; результат конкурсу на голову правління 2026 р. перевірити перед публікацією.
  - id: ukrenergo
    title: Укренерго — звільнення голови правління наглядовою радою (2024)
    region: ua
    primaryTopic: t05
    ref: { doc: cases, section: '3' }
    caveat: Законність звільнення судом не оцінювалась; у кримінальному провадженні діє презумпція невинуватості.
  - id: motor-sich
    title: Мотор Січ — корпоративний контроль, іноземні інвестори і примусове відчуження акцій
    region: ua
    primaryTopic: t08
    ref: { doc: cases, section: '4' }
    caveat: Вироку, рішення арбітражу й апеляції на рішення ВАКС не знайдено; розрізняти арешт (2021), примусове відчуження (2022) і стягнення активів (2024).
  - id: soe-board-reform
    title: Реформа наглядових рад енергетичних держкомпаній після операції «Мідас» (2025–2026)
    region: ua
    primaryTopic: t11
    ref: { doc: cases, section: '5' }
    caveat: Обставини схеми — позиція сторони обвинувачення; розбіжність дат щодо попередньої наглядової ради Енергоатому звірити з розпорядженнями КМУ.
  - id: astarta
    title: Astarta Holding — українська агрокомпанія з лістингом на Варшавській біржі
    region: ua
    primaryTopic: t09
    ref: { doc: cases, section: '6' }
    caveat: Суму дивідендів за 2025 р., кількість незалежних директорів і структуру акціонерів першоджерелом не підтверджено.
  - id: kernel
    title: Kernel Holding — процедура sell-out у Люксембурзі (2025–2026)
    region: ua
    primaryTopic: t04
    ref: { doc: cases, section: '6' }
    caveat: Статус делістингу з GPW не підтверджено.
  - id: enron
    title: Enron (2001) і закон Сарбейнза — Окслі (2002)
    region: international
    primaryTopic: t01
    ref: { doc: cases, section: '7' }
    caveat: Висновки щодо відповідальності ради — звіт підкомітету Сенату США, а не рішення суду.
  - id: volkswagen
    title: Volkswagen — «Dieselgate» і відповідальність правління (з 2015 р.)
    region: international
    primaryTopic: t06
    ref: { doc: cases, section: '8' }
    caveat: Чинність вироку Земельного суду Брауншвейга і стан процесу Вінтеркорна не підтверджено; вина Вінтеркорна судом не встановлена.
  - id: wirecard
    title: Wirecard (2020) і роль аудитора
    region: international
    primaryTopic: t10
    ref: { doc: cases, section: '9' }
    caveat: Вироку станом на 15.09.2026 немає (заключні промови — з 19.10.2026), тому перед публікацією перевірити; діє презумпція невинуватості.
  - id: openai
    title: OpenAI — криза ради директорів (2023) і реструктуризація
    region: international
    primaryTopic: t05
    ref: { doc: cases, section: '10' }
    caveat: Першоджерела openai.com не відкрилися — формулювання за медіа; висновки WilmerHale — приватна перевірка, не рішення суду.
  - id: toyota
    title: Toyota — Кодекс КУ Японії, голосування акціонерів і приватизація Toyota Industries
    region: international
    primaryTopic: t08
    ref: { doc: cases, section: '11' }
    caveat: Причинний зв’язок змін у раді Toyota з Кодексом КУ джерелами не встановлено — подавати як паралельні факти.
  - id: tesla
    title: Tesla — винагорода CEO і рішення судів Делаверу (2024–2026)
    region: international
    primaryTopic: t06
    ref: { doc: cases, section: '12' }
    caveat: Текст рішення Верховного суду Делаверу не відкрито — положення викладено за Gibson Dunn і формою 10-K/A.

# Практичні: 8 × 2 год, кожна з рубрикою на 3 бали (3 критерії по 1 балу) і тренажером.
# trainers — ID рушіїв (src/engines), рушії пише окремий потік.
practicals:
  - id: p01
    module: m1
    topics: [t01, t02]
    title: Матриця моделей корпоративного управління
    hours: 2
    goal: Навчитися розпізнавати моделі корпоративного управління за їхніми ознаками й аргументовано оцінювати, яка модель ближча до практики українських компаній.
    results:
      - Визначати модель корпоративного управління за описом структури власності, будови ради й ролі стейкхолдерів.
      - Аргументувати оцінку моделі з посиланням на Принципи G20/ОЕСР 2023 і з урахуванням інтересів стейкхолдерів.
    prn: [prn03, prn15]
    trainers: [model-matrix]
    tasks:
      - У тренажері зіставити 11 ознак (структура власності, роль банків і працівників, будова ради, захист міноритаріїв, розкриття) з англо-американською, німецькою, японською і сімейною моделями.
      - За короткими описами трьох компаній (Volkswagen, Toyota і умовної компанії з розпорошеною власністю) визначити модель і назвати дві ключові ознаки.
      - Написати есе до 300 слів про те, яка модель найближча до українських АТ після Закону № 2465-IX і як вона враховує інтереси стейкхолдерів.
    rubric:
      - title: Матриця моделей
        points: 1
        levels:
          - { points: 1, description: Правильно зіставлено не менше 90% ознак і моделей. }
          - { points: 0.5, description: Правильно зіставлено 60–89% ознак. }
          - { points: 0, description: Правильно зіставлено менше 60% ознак або завдання не виконано. }
      - title: Аргументація есе
        points: 1
        levels:
          - { points: 1, description: 'Чітка теза і щонайменше два аргументи, що спираються на ознаки моделей і Принципи G20/ОЕСР 2023.' }
          - { points: 0.5, description: Теза з одним аргументом або аргументи без зв’язку з ознаками моделей. }
          - { points: 0, description: Тези немає або текст переказує лекцію. }
      - title: Інтереси стейкхолдерів
        points: 1
        levels:
          - { points: 1, description: Названо щонайменше дві групи стейкхолдерів і оцінено вплив моделі на їхні інтереси з урахуванням етичних аспектів. }
          - { points: 0.5, description: Стейкхолдерів названо без оцінки впливу. }
          - { points: 0, description: Стейкхолдерів не розглянуто. }
    data:
      - title: Принципи корпоративного управління G20/ОЕСР 2023 — структура розділів
        ref: { doc: legal-baseline, section: '12' }
        url: https://www.oecd.org/en/publications/g20-oecd-principles-of-corporate-governance-2023_ed750b30-en.html
      - title: Структура контролю Volkswagen AG станом на 31.12.2025
        ref: { doc: cases, section: '8' }
        url: https://www.volkswagen-group.com/en/shareholder-structure-15951
      - title: Перегляд Кодексу корпоративного управління Японії 2021 р.
        ref: { doc: cases, section: '11' }
        url: https://www.fsa.go.jp/en/news/2021/20210406.html

  - id: p02
    module: m1
    topics: [t03]
    title: Вибір форми бізнесу і корпоративний договір стартапу
    hours: 2
    goal: Обґрунтувати вибір організаційно-правової форми для бізнесу з інвестором за чинними законами й даними статистики та підготувати ключові умови корпоративного договору.
    results:
      - Розраховувати й тлумачити зміну кількості АТ і ТОВ за даними Держстату.
      - Обґрунтовувати вибір між ТОВ і ПрАТ за правовими та економічними критеріями.
      - Формулювати законні умови корпоративного договору й оцінювати їхні правові наслідки.
    prn: [prn04, prn06, prn12]
    trainers: [legal-form-choice]
    tasks:
      - За таблицями ЄДРПОУ розрахувати абсолютну й відносну зміну кількості ТОВ і суми рядків АТ з 01.01.2020 до 01.01.2026 (для АТ — лише загальна кількість), пояснити тренд і те, чому таблиці до 2021 р. і з 2022 р. не можна порівнювати напряму.
      - Для стартапу з трьома засновниками й венчурним інвестором порівняти ТОВ і ПрАТ за критеріями — статутний капітал, вихід учасника, залучення інвестицій, розкриття інформації, корпоративні процедури.
      - Запропонувати п’ять умов корпоративного договору (купівля-продаж частки, drag-along і tag-along, порядок голосування, вихід інвестора) і перевірити кожну на відповідність ст. 7 Закону № 2275-VIII.
    rubric:
      - title: Статистика АТ і ТОВ
        points: 1
        levels:
          - { points: 1, description: 'Правильно розраховано абсолютну й відносну зміну кількості АТ і ТОВ, тренд пояснено з урахуванням непорівнянності даних про ПАТ і ПрАТ.' }
          - { points: 0.5, description: Розрахунки мають одну помилку або тренд не пояснено. }
          - { points: 0, description: Розрахунків немає або вони хибні. }
      - title: Вибір форми бізнесу
        points: 1
        levels:
          - { points: 1, description: Форму обрано за щонайменше чотирма критеріями з посиланням на чинні норми Законів № 2275-VIII і № 2465-IX. }
          - { points: 0.5, description: Вибір обґрунтовано одним-двома критеріями або з неточними нормами. }
          - { points: 0, description: 'Вибір не обґрунтовано або спирається на норми, що втратили чинність.' }
      - title: Умови корпоративного договору
        points: 1
        levels:
          - { points: 1, description: 'Запропоновано п’ять законних умов, пов’язаних з ризиками стартапу, і оцінено правові наслідки кожної.' }
          - { points: 0.5, description: Умови неповні або без оцінки наслідків. }
          - { points: 0, description: Умов немає або вони нікчемні. }
    data:
      - title: Кількість юридичних осіб за організаційно-правовими формами на 01.01.2022–01.01.2025 (ЄДРПОУ, нова форма таблиці)
        ref: { doc: data-sources, section: '1.1' }
        url: https://ukrstat.gov.ua/edrpoy/ukr/EDRPU_2024/ks_opfg/arh_ks_opfg_24.htm
        note: Таблиці до 2021 р. і з 2022 р. мають різну структуру рядків — рядки «ПАТ» і «Відкрите АТ» напряму не порівнюються; ЄДРПОУ рахує зареєстровані, а не діючі товариства; сертифікат ukrstat.gov.ua прострочений.
      - title: Кількість юридичних осіб за формами на 01.01.2020 (ЄДРПОУ, стара форма таблиці)
        ref: { doc: data-sources, section: '1.1' }
        url: https://ukrstat.gov.ua/edrpoy/ukr/EDRPU_2020/ks_opfg/ks_opfg_0120.htm
      - title: Кількість юридичних осіб за формами на 01.01.2026 і 01.07.2026 (Держстат, SDMX API)
        ref: { doc: data-sources, section: '1.1' }
        url: https://stat.gov.ua/uk/development-api/sdmx-api-v2-1
        note: Дані отримано через SDMX API Держстату (набір DF_STATISTICAL_BUSINESS_REGISTER_Q_M) і звірено 15.09.2026; для тренду брати лише загальну кількість АТ, бо поділ на ПАТ і ПрАТ між таблицями до 2021 р. і з 2022 р. непорівнянний.
      - title: Закон про ТОВ і ТДВ — корпоративний договір, вихід учасника, статутний капітал
        ref: { doc: legal-baseline, section: '2' }
        url: https://zakon.rada.gov.ua/laws/show/2275-19

  - id: p03
    module: m2
    topics: [t04]
    title: Загальні збори акціонерів — кворум і кумулятивне голосування
    hours: 2
    goal: Застосувати норми Закону № 2465-IX до підготовки й проведення загальних зборів і розрахувати результати кумулятивного голосування.
    results:
      - Визначати кворум і перевіряти строки скликання позачергових зборів.
      - Розраховувати результати кумулятивного голосування й мінімальний пакет для обрання кандидата.
      - Готувати аргументоване звернення міноритарного акціонера до ради.
    prn: [prn04, prn06, prn11]
    trainers: [quorum, cumulative-voting]
    tasks:
      - Кейс за мотивами «Зоря-113» з новою, послідовною хронологією — визначити, чи мали збори умовного ПрАТ «Зоря» кворум з урахуванням акцій, що не голосують.
      - Перевірити, чи дотримано строки розгляду вимоги акціонера з 5% голосуючих акцій і проведення позачергових зборів (10, 45, 90 і 120 днів).
      - У тренажері розрахувати розподіл кумулятивних голосів і мінімальний пакет для обрання 2 з 7 членів наглядової ради.
      - Підготувати звернення міноритарного акціонера до наглядової ради з вимогою включити питання до порядку денного.
    rubric:
      - title: Кворум і строки зборів
        points: 1
        levels:
          - { points: 1, description: 'Кворум визначено правильно з урахуванням акцій, що не голосують, а всі строки перевірено за ст. 42 і 47 Закону № 2465-IX.' }
          - { points: 0.5, description: Одна помилка в кворумі або строках. }
          - { points: 0, description: Дві й більше помилок. }
      - title: Кумулятивне голосування
        points: 1
        levels:
          - { points: 1, description: 'Правильно розраховано голоси й мінімальний пакет для обрання кандидата, результат перевірено в тренажері.' }
          - { points: 0.5, description: 'Механіку описано правильно, але розрахунок має помилку.' }
          - { points: 0, description: Розрахунку немає або механіку викладено хибно. }
      - title: Позиція міноритарного акціонера
        points: 1
        levels:
          - { points: 1, description: 'Звернення до ради логічне, містить конкретні вимоги й посилання на права акціонера.' }
          - { points: 0.5, description: Звернення загальне або без посилань на права акціонера. }
          - { points: 0, description: Звернення немає. }
    data:
      - title: Кворум, строки скликання, більшість голосів і кумулятивне голосування
        ref: { doc: legal-baseline, section: '1.3' }
        url: https://zakon.rada.gov.ua/laws/show/2465-20
        note: Формула мінімального пакета S·k/(N+1)+1 — математичне правило, законом не встановлене (legal-baseline.md, розділ «Не підтверджено», пункт 13); правильність і округлення перевіряє рушій тренажера.

  - id: p04
    module: m2
    topics: [t05, t06]
    title: Формування наглядової ради і погодження правочинів
    hours: 2
    goal: Сформувати склад наглядової ради публічного акціонерного товариства за матрицею компетенцій і критеріями незалежності та визначити порядок погодження значних правочинів і правочинів із заінтересованістю.
    results:
      - Застосовувати критерії незалежності й вимоги Закону № 2465-IX до складу ради та комітетів.
      - Визначати орган і більшість голосів для погодження правочину та наслідки порушення порядку.
    prn: [prn03, prn04, prn12]
    trainers: [board-matrix, transaction-approval]
    tasks:
      - З 10 кандидатів сформувати наглядову раду ПАТ із 7 осіб з урахуванням матриці компетенцій і вимоги щодо незалежних членів (не менше третини складу, але не менше двох осіб).
      - Для кожного кандидата визначити, чи може він бути незалежним директором, з посиланням на критерії ст. 73 Закону № 2465-IX.
      - Сформувати обов’язкові комітети (аудиторський, з винагород, з питань призначень) і обрати їхніх голів.
      - Визначити орган, що погоджує правочини на 12%, 30% і 55% вартості активів і правочин із заінтересованістю на 8% активів, а також наслідки порушення порядку.
    rubric:
      - title: Склад ради і незалежність
        points: 1
        levels:
          - { points: 1, description: 'Склад наглядової ради ПАТ відповідає ст. 72–73 Закону № 2465-IX, рішення щодо незалежності кожного кандидата обґрунтовано.' }
          - { points: 0.5, description: Одна невідповідність вимогам або одне необґрунтоване рішення щодо кандидата. }
          - { points: 0, description: Склад не відповідає вимогам закону. }
      - title: Матриця компетенцій і комітети
        points: 1
        levels:
          - { points: 1, description: 'Матриця покриває ключові компетенції, обов’язкові комітети сформовано за ст. 76 Закону № 2465-IX з урахуванням винятку воєнного стану.' }
          - { points: 0.5, description: Матриця неповна або комітети сформовано з порушенням вимог. }
          - { points: 0, description: Матрицю й комітети не сформовано. }
      - title: Погодження правочинів
        points: 1
        levels:
          - { points: 1, description: 'Для всіх правочинів правильно визначено орган і більшість голосів, названо наслідки порушення порядку.' }
          - { points: 0.5, description: Одна помилка у визначенні органу або наслідків. }
          - { points: 0, description: Дві й більше помилок. }
    data:
      - title: Склад наглядової ради, незалежні директори і комітети
        ref: { doc: legal-baseline, section: '1.4' }
        url: https://zakon.rada.gov.ua/laws/show/2465-20
        note: Вимоги до частки незалежних директорів у раді директорів ПАТ не підтверджено — завдання будується лише на наглядовій раді. Під час воєнного стану і 6 місяців після нього вимоги щодо незалежних директорів у комітетах обов’язкові лише для АТ з часткою держави понад 50% (розділ XIX Закону № 2465-IX, рядок AT-53 legal-baseline.md) — у фабулі зазначити, яке правило застосовується.
      - title: Значні правочини й правочини із заінтересованістю
        ref: { doc: legal-baseline, section: '1.6' }
        url: https://zakon.rada.gov.ua/laws/show/2465-20
        note: Тлумачення абз. 4 ч. 3 ст. 106 щодо повноважень наглядової ради ПАТ не перевірено — використовувати лише базові пороги 10%, 25% і 50%.

  - id: p05
    module: m3
    topics: [t07]
    title: Капітал і дивіденди — розподіл прибутку АТ з державною часткою
    hours: 2
    goal: Перевірити правові умови виплати дивідендів, розрахувати розподіл прибутку й обґрунтувати рекомендацію раді щодо дивідендної політики.
    results:
      - Перевіряти заборони на виплату дивідендів і правило чистих активів.
      - Розраховувати дивіденд на акцію, суму дивідендів держави, коефіцієнт виплати і строки виплати.
      - Обґрунтовувати вибір сценарію розподілу прибутку з урахуванням інтересів акціонерів і кредиторів.
    prn: [prn04, prn06]
    trainers: [profit-distribution]
    tasks:
      - Кейс за мотивами «ПАТ Мрія» з новою фабулою — для умовного АТ «Мрія», де державі належать 50% акцій плюс одна акція, перевірити умови ст. 35 Закону № 2465-IX за балансом на кінець року.
      - У тренажері розрахувати чистий прибуток до розподілу, дивіденд на просту акцію, суму дивідендів держави й коефіцієнт виплати.
      - Визначити дату складення переліку отримувачів дивідендів і граничну дату виплати.
      - Порівняти два сценарії розподілу прибутку (реінвестування і виплата 50% прибутку) та підготувати рекомендацію наглядовій раді.
    rubric:
      - title: Правові умови виплати дивідендів
        points: 1
        levels:
          - { points: 1, description: 'Перевірено всі умови ст. 35 Закону № 2465-IX і правило чистих активів, висновок правильний.' }
          - { points: 0.5, description: Перевірено частину умов або висновок неточний. }
          - { points: 0, description: Умови не перевірено. }
      - title: Розрахунок дивідендів
        points: 1
        levels:
          - { points: 1, description: 'Правильно розраховано дивіденд на акцію, суму дивідендів держави, коефіцієнт виплати і строки виплати.' }
          - { points: 0.5, description: Одна помилка в розрахунках або строках. }
          - { points: 0, description: Дві й більше помилок. }
      - title: Рекомендація раді
        points: 1
        levels:
          - { points: 1, description: 'Порівняно два сценарії розподілу прибутку, рекомендацію обґрунтовано інтересами акціонерів і кредиторів.' }
          - { points: 0.5, description: Рекомендація без порівняння сценаріїв. }
          - { points: 0, description: Рекомендації немає. }
    data:
      - title: Дивіденди — джерела, строки, заборони на виплату
        ref: { doc: legal-baseline, section: '1.2' }
        url: https://zakon.rada.gov.ua/laws/show/2465-20
        note: Зупинення п. 2 ч. 1 ст. 35 на 2026 р. стосується лише АТ зі 100% акцій держави; у кейсі частка держави менша, тому заборона діє.
      - title: Мінімальний статутний капітал і правило чистих активів АТ
        ref: { doc: legal-baseline, section: '1.1' }
        url: https://zakon.rada.gov.ua/laws/show/2465-20
      - title: Мінімальна заробітна плата з 01.01.2026 для порогу статутного капіталу
        ref: { doc: legal-baseline, section: '13' }
        url: https://zakon.rada.gov.ua/laws/show/4695-20

  - id: p06
    module: m3
    topics: [t08]
    title: Ринок капіталу — аукціон заявок, облігації і доходність
    hours: 2
    goal: Змоделювати формування ціни на біржі, розрахувати доходність облігацій і оцінити стан українського ринку капіталу за актуальними даними.
    results:
      - Визначати ціну аукціону за принципом максимального обсягу угод.
      - Розраховувати ціну, поточну доходність і доходність до погашення облігації та P/E.
      - Формулювати висновок про ринок акцій в Україні на основі даних операторів ринку й НБУ.
    prn: [prn04, prn06]
    trainers: [auction, bonds]
    tasks:
      - У симуляції аукціону за книгою заявок визначити ціну, за якою обсяг угод максимальний, і незадоволені заявки.
      - Розрахувати ціну купонної облігації й поточну доходність, наближену доходність до погашення ОВДП і порівняти її з обліковою ставкою НБУ.
      - На умовних даних розрахувати P/E і пояснити, чому для акцій українських емітентів реальних котирувань майже немає.
      - За оглядом ПФТС за серпень 2026 р. описати структуру торгів і наслідки для залучення капіталу та ринку корпоративного контролю.
    rubric:
      - title: Аукціон заявок
        points: 1
        levels:
          - { points: 1, description: 'Ціну визначено за максимальним обсягом угод, обсяг і незадоволені заявки розраховано правильно.' }
          - { points: 0.5, description: 'Ціну визначено правильно, але обсяг розраховано з помилкою.' }
          - { points: 0, description: Ціну визначено неправильно. }
      - title: Облігації і P/E
        points: 1
        levels:
          - { points: 1, description: 'Правильно розраховано ціну, поточну доходність, доходність до погашення і P/E, результати зіставлено з обліковою ставкою НБУ.' }
          - { points: 0.5, description: Одна помилка в розрахунках або немає зіставлення зі ставкою. }
          - { points: 0, description: Дві й більше помилок. }
      - title: Висновок про ринок капіталу
        points: 1
        levels:
          - { points: 1, description: Висновок спирається на дані ПФТС і НБУ з посиланнями та пояснює наслідки для залучення капіталу й корпоративного контролю. }
          - { points: 0.5, description: Висновок без даних або без наслідків. }
          - { points: 0, description: Висновку немає. }
    data:
      - title: Огляд діяльності ПФТС за серпень 2026 р. — структура торгів
        ref: { doc: data-sources, section: '3.2' }
        url: https://pfts.ua/news/10131-ohliad-diialnosti-pfts-serpen-2026-roku
      - title: Ринок ОВДП і доходність розміщень у серпні 2026 р.
        ref: { doc: data-sources, section: '3.3' }
        url: https://bank.gov.ua/ua/markets/ovdp
      - title: Облікова ставка НБУ 15,5% з 31.07.2026
        ref: { doc: data-sources, section: '3.4' }
        url: https://bank.gov.ua/ua/monetary/archive-rish
        note: Наступне засідання НБУ з монетарної політики — 17.09.2026, тому перед видачею завдання ставку перевірити повторно.

  - id: p07
    module: m4
    topics: [t10, t09]
    title: Ризики, три лінії та аудит розкриття інформації
    hours: 2
    goal: Оцінити якість звіту про корпоративне управління реального емітента за чеклістом, побудувати карту ризиків і розподілити відповідальність за моделлю трьох ліній.
    results:
      - Перевіряти повноту звіту про корпоративне управління за чеклістом.
      - Будувати карту ризиків і розподіляти ризики між лініями моделі трьох ліній.
      - Формулювати запитання аудиторському комітету за результатами аналізу.
    prn: [prn04, prn11, prn12]
    trainers: [risk-map, disclosure-checklist]
    tasks:
      - Знайти на SMIDA річну інформацію обраного викладачем ПАТ за 2025 р. і перевірити звіт про корпоративне управління за 15 пунктами чекліста.
      - Виписати зі звіту 6–8 ризиків, оцінити їхню ймовірність і вплив та побудувати карту ризиків у тренажері.
      - Для кожного ризику визначити відповідальних за першою, другою і третьою лініями.
      - Сформулювати три запитання аудиторському комітету щодо виявлених прогалин розкриття й ризиків.
    rubric:
      - title: Чекліст звіту про корпоративне управління
        points: 1
        levels:
          - { points: 1, description: 'Звіт перевірено за всіма 15 пунктами, для кожного зафіксовано наявність і якість розкриття з посиланням на сторінку звіту.' }
          - { points: 0.5, description: Перевірено 8–14 пунктів або без посилань на звіт. }
          - { points: 0, description: Перевірено менше 8 пунктів. }
      - title: Карта ризиків і три лінії
        points: 1
        levels:
          - { points: 1, description: 'Для 6–8 ризиків обґрунтовано ймовірність і вплив, для кожного визначено відповідальну лінію.' }
          - { points: 0.5, description: Карта неповна або лінії визначено з помилками. }
          - { points: 0, description: Карти немає. }
      - title: Запитання аудиторському комітету
        points: 1
        levels:
          - { points: 1, description: 'Сформульовано три конкретні запитання, що випливають з виявлених прогалин розкриття й ризиків.' }
          - { points: 0.5, description: Запитання загальні або не пов’язані з аналізом. }
          - { points: 0, description: Запитань немає. }
    data:
      - title: SMIDA — регульована інформація емітентів
        ref: { doc: data-sources, section: '2.1' }
        url: https://smida.gov.ua/db/emitent
        note: Звіт емітента за 2025 р. обирає викладач і перевіряє його наявність перед видачею завдання.
      - title: Склад звіту про корпоративне управління (п. 43 Положення НКЦПФР № 608)
        ref: { doc: data-sources, section: '2.3' }
        url: https://zakon.rada.gov.ua/laws/show/z1307-23
        note: Як правову норму п. 43 Положення № 608 використовувати лише після доповнення legal-baseline.md; правова основа звіту про корпоративне управління — ст. 127 ч. 3 Закону № 3480-IV (RK-13).
      - title: Модель трьох ліній IIA і рамки COSO
        ref: { doc: legal-baseline, section: '12' }
        url: https://www.theiia.org/en/resources/statements-of-position/

  - id: p08
    module: m4
    topics: [t12, t11]
    title: Аудит ефективності корпоративного управління — модель DuPont і скоринг-картка
    hours: 2
    goal: Оцінити фінансову ефективність і якість корпоративного управління компанії за моделлю DuPont і скоринг-карткою та пояснити зв’язок між ними.
    results:
      - Розкладати рентабельність власного капіталу за моделлю DuPont і визначати драйвери змін.
      - Оцінювати якість корпоративного управління, соціальної відповідальності й розкриття за скоринг-карткою.
      - Інтерпретувати результати для акціонерів і кредиторів.
    prn: [prn04, prn06, prn15]
    trainers: [dupont, governance-scorecard]
    tasks:
      - Кейс за мотивами «Укрметал» на умовних даних тренажера — розкласти ROE за трьома факторами за два роки й визначити основний драйвер змін.
      - Застосувати скоринг-картку (права акціонерів, рада, розкриття, контроль і ризики, соціальна відповідальність) до компанії свого кейс-проєкту.
      - Розрахувати коефіцієнт покриття відсотків і пояснити, як оцінка корпоративного управління впливає на рішення кредитора.
    rubric:
      - title: Модель DuPont
        points: 1
        levels:
          - { points: 1, description: 'ROE правильно розкладено на три фактори за два роки, визначено основний драйвер змін.' }
          - { points: 0.5, description: Одна помилка в розрахунках або драйвер не визначено. }
          - { points: 0, description: Дві й більше помилок. }
      - title: Скоринг-картка
        points: 1
        levels:
          - { points: 1, description: Компанію оцінено за всіма блоками скоринг-картки з обґрунтуванням кожної оцінки відкритими даними. }
          - { points: 0.5, description: Оцінено частину блоків або оцінки не обґрунтовано. }
          - { points: 0, description: Скоринг-картку не заповнено. }
      - title: Інтерпретація для кредиторів і акціонерів
        points: 1
        levels:
          - { points: 1, description: 'Пояснено зв’язок оцінки корпоративного управління з рентабельністю й покриттям відсотків, сформульовано висновок для кредитора.' }
          - { points: 0.5, description: 'Зв’язок описано загально, без висновку для кредитора.' }
          - { points: 0, description: Інтерпретації немає. }
    data:
      - title: Регульована інформація і фінансова звітність емітентів на SMIDA
        ref: { doc: data-sources, section: '2.1' }
        url: https://smida.gov.ua/db/emitent
        note: Умовні дані за мотивами «Укрметал» генерує тренажер; реальні дані студент бере з річної інформації компанії кейс-проєкту.
      - title: Річна звітність і документи корпоративного управління Astarta Holding
        ref: { doc: cases, section: '6' }
        url: https://astartaholding.com/en/investor-relations/

