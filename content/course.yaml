      - Реформа корпоративного управління державного сектору — Закон № 3587-IX, Закон № 185-V, Політика державної власності і лист очікувань.
      - Наглядові ради державних підприємств — склад, незалежні члени, добір, дострокове припинення повноважень, оцінювання.
      - Перетворення державних підприємств за Законом № 4196-IX.
      - Етичні дилеми й політичне втручання в державних компаніях — уроки кейсів енергетичного сектору.
