topics:
  - id: t01
    module: m1
    slug: korporatsiia-i-korporatyvne-upravlinnia
    title: Корпорація і корпоративне управління
    summary: Відокремлення власності від контролю, агентська проблема, стейкхолдери, корпоративне управління і вартість.
  - id: t02
    module: m1
    slug: modeli-ku-ta-mizhnarodni-standarty
    title: Моделі корпоративного управління та міжнародні стандарти
    summary: Англо-американська, німецька, японська і сімейна моделі; Принципи G20/ОЕСР 2023; таймлайн КУ в Україні.
  - id: t03
    module: m1
    slug: pravove-pole-korporatyvnoho-biznesu
    title: Правове поле корпоративного бізнесу
    summary: ТОВ і ТДВ, ПАТ і ПрАТ за Законом № 2465-IX, наслідки скасування Господарського кодексу, статут і корпоративний договір.
  - id: t04
    module: m2
    slug: aktsionery-ta-zahalni-zbory
    title: Акціонери та загальні збори
    summary: Права й захист міноритаріїв, форми зборів, кворум, кумулятивне голосування, squeeze-out і sell-out.
  - id: t05
    module: m2
    slug: nahliadova-rada-i-rada-dyrektoriv
    title: Наглядова рада і рада директорів
    summary: Одно- та дворівнева структура, незалежні директори, комітети, оцінювання ради, корпоративний секретар.
  - id: t06
    module: m2
    slug: vykonavchyi-menedzhment
    title: Виконавчий менеджмент
    summary: Фідуціарні обов’язки, конфлікт інтересів, значні правочини й правочини із заінтересованістю, винагорода і KPI.
  - id: t07
    module: m3
    slug: korporatyvnyi-kapital-i-dyvidendna-polityka
    title: Корпоративний капітал і дивідендна політика
    summary: Акції, емісія, статутний капітал, чисті активи, викуп акцій, розрахунок дивідендів.
  - id: t08
    module: m3
    slug: rynok-kapitalu-i-nktspfr
    title: Ринок капіталу і НКЦПФР
    summary: IPO, лістинг, депозитарна система, ринок корпоративного контролю, злиття й поглинання.
  - id: t09
    module: m3
    slug: rozkryttia-informatsii-ta-zvitnist
    title: Розкриття інформації та звітність
    summary: Звіт про управління, Кодекс корпоративного управління НКЦПФР («дотримуйся або пояснюй»), ESG-звітність.
  - id: t10
    module: m4
    slug: vnutrishnii-kontrol-ryzyky-audyt-i-komplaiens
    title: Внутрішній контроль, ризики, аудит і комплаєнс
    summary: Модель трьох ліній, COSO, аудиторський комітет, антикорупційна програма.
  - id: t11
    module: m4
    slug: ksv-kultura-etyka-ta-ku-derzhpidpryiemstv
    title: КСВ, корпоративна культура й етика, КУ державних підприємств
    summary: Корпоративна соціальна відповідальність, культура й етика, особливості управління державними підприємствами.
  - id: t12
    module: m4
    slug: otsiniuvannia-efektyvnosti-ku
    title: Оцінювання ефективності корпоративного управління
    summary: Рейтинги й індекси, показники для кредиторів, TSR, EVA, MVA, Q Тобіна, самооцінювання ради.

