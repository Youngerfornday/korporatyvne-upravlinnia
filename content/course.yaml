        hours: 2
      - task: Порівняти статут і корпоративний договір — які умови для стартапу врегульовувати в кожному документі.
        hours: 1
      - task: Пройти тренувальні тести тем 1–3 і підготуватися до модульного тесту М1.
        hours: 1
    cases:
