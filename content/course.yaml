grading:
  split:
    current: 60
    final: 40
  categories:
    - id: practicals
      stage: current
      title: Практичні роботи
      items: 8
      pointsPerItem: 3
    - id: module-tests
      stage: current
      title: Модульні тести
      items: 4
      pointsPerItem: 6
    - id: case-project
      stage: current
      title: Кейс-проєкт «Аудит корпоративного управління компанії»
      items: 1
      pointsPerItem: 12
    - id: final-test
      stage: final
      title: Підсумковий тест
      items: 1
      pointsPerItem: 40
  # Тест з контрольного банку модуля: 15 випадкових питань з фільтром за тегом рівня Блума.
  moduleTests:
    questions: 15
    timeLimitMinutes: 30
    attempts: 1
    bankPerModule: 45
    bloom: { remember: 5, understand: 5, apply: 4, analyze: 1 }
  # Підсумковий тест: 40 питань за явною матрицею «теми × рівні Блума» (10/12/12/6 = 25/30/30/15%).
  # Подвійні теми t04, t07, t08, t10 мають по 4 питання, решта — по 3.
  finalTest:
    questions: 40
    timeLimitMinutes: 60
    attempts: 1
    bankSize: 120
    targetShare: { remember: 25, understand: 30, apply: 30, analyze: 15 }
    matrix:
      - { topic: t01, remember: 1, understand: 1, apply: 0, analyze: 1 }
      - { topic: t02, remember: 1, understand: 1, apply: 1, analyze: 0 }
      - { topic: t03, remember: 1, understand: 1, apply: 1, analyze: 0 }
      - { topic: t04, remember: 1, understand: 1, apply: 2, analyze: 0 }
      - { topic: t05, remember: 1, understand: 1, apply: 1, analyze: 0 }
      - { topic: t06, remember: 0, understand: 1, apply: 1, analyze: 1 }
      - { topic: t07, remember: 1, understand: 1, apply: 1, analyze: 1 }
      - { topic: t08, remember: 1, understand: 1, apply: 1, analyze: 1 }
      - { topic: t09, remember: 1, understand: 1, apply: 1, analyze: 0 }
      - { topic: t10, remember: 1, understand: 1, apply: 1, analyze: 1 }
      - { topic: t11, remember: 1, understand: 1, apply: 1, analyze: 0 }
      - { topic: t12, remember: 0, understand: 1, apply: 1, analyze: 1 }
  caseProject:
    title: Аудит корпоративного управління компанії
    goal: Провести діагностику корпоративного управління реальної компанії за відкритими даними, виявити проблеми й обґрунтувати рекомендації для ради та акціонерів.
    companyCriteria:
      - ПАТ або ПрАТ, що є підприємством, яке становить суспільний інтерес, з розкритою річною інформацією за 2025 р. на SMIDA, або українська компанія з лістингом на іноземній біржі.
      - Відкрито доступні статут або положення про органи управління, склад ради і дані про власників пакетів 5% і більше.
      - Кожен студент обирає окрему компанію; компанії, розібрані в кейсах курсу, не обираються.
    stages:
      - id: cp-select
        title: Вибір компанії
        deliverable: Назва компанії, код ЄДРПОУ, посилання на річну інформацію за 2025 р. і перелік джерел даних.
      - id: cp-profile
        title: Етап 1. Власність і органи управління
        deliverable: Профіль компанії до 4 сторінок — організаційно-правова форма, структура власності й контролю, органи управління, склад ради й комітетів, оцінка відповідності Закону № 2465-IX.
      - id: cp-capital
        title: Етап 2. Капітал, дивіденди і розкриття
        deliverable: Аналіз до 4 сторінок — капітал, дивідендна історія, обіг акцій, перевірка звіту про корпоративне управління за чеклістом.
      - id: cp-control
        title: Етап 3. Контроль, соціальна відповідальність і рекомендації
        deliverable: Оцінка внутрішнього контролю, ризиків, аудиту й соціальної відповідальності, 3–5 рекомендацій раді; підсумковий звіт до 12 сторінок і презентація до 10 слайдів.
    rubric:
      - title: Вибір компанії і джерела даних
        stage: cp-select
        points: 1
        levels:
          - { points: 1, description: 'Компанія відповідає критеріям, джерела даних повні, посилання робочі.' }
          - { points: 0.5, description: 'Компанія відповідає критеріям, але джерела неповні.' }
          - { points: 0, description: Компанія не відповідає критеріям або джерел немає. }
      - title: Структура власності й контроль
        stage: cp-profile
        points: 1
        levels:
          - { points: 1, description: 'Визначено власників значних пакетів і кінцевих бенефіціарних власників, оцінено концентрацію контролю.' }
          - { points: 0.5, description: Власників названо без оцінки контролю. }
          - { points: 0, description: Структуру власності не описано. }
      - title: Органи управління і відповідність закону
        stage: cp-profile
        points: 2
        levels:
          - { points: 2, description: 'Описано структуру органів, склад ради й комітетів, кожну невідповідність Закону № 2465-IX обґрунтовано нормою.' }
          - { points: 1, description: 'Структуру описано, але оцінка відповідності неповна або без посилань на норми.' }
          - { points: 0, description: Органи управління не проаналізовано. }
      - title: Капітал, дивіденди й ринок акцій
        stage: cp-capital
        points: 2
        levels:
          - { points: 2, description: 'Проаналізовано капітал, дивідендну історію й обіг акцій, висновки підкріплено розрахунками.' }
          - { points: 1, description: 'Аналіз описовий, без розрахунків.' }
          - { points: 0, description: Аналізу немає. }
      - title: Повнота розкриття інформації
        stage: cp-capital
        points: 2
        levels:
          - { points: 2, description: 'Звіт про корпоративне управління перевірено за чеклістом, відхилення від кодексу та їх пояснення оцінено.' }
          - { points: 1, description: Чекліст заповнено частково. }
          - { points: 0, description: Розкриття не перевірено. }
      - title: Внутрішній контроль, ризики й аудит
        stage: cp-control
        points: 1
        levels:
          - { points: 1, description: 'Оцінено систему внутрішнього контролю, ключові ризики й незалежність аудитора.' }
          - { points: 0.5, description: Оцінено лише частину елементів. }
          - { points: 0, description: Оцінки немає. }
      - title: Соціальна відповідальність і етика
        stage: cp-control
        points: 1
        levels:
          - { points: 1, description: 'Оцінено політики соціальної відповідальності, етики й антикорупції та їх розкриття з урахуванням інтересів стейкхолдерів.' }
          - { points: 0.5, description: Політики перелічено без оцінки. }
          - { points: 0, description: Питання не розглянуто. }
      - title: Рекомендації й аргументація
        stage: cp-control
        points: 2
        levels:
          - { points: 2, description: '3–5 конкретних рекомендацій раді випливають з аналізу, мають пріоритет і очікуваний ефект.' }
          - { points: 1, description: Рекомендації загальні або слабко пов’язані з аналізом. }
          - { points: 0, description: Рекомендацій немає. }
  admission:
    minCurrentPoints: 20
    conditions:
      - Виконано всі види робіт, передбачені робочою програмою, — 8 практичних робіт, 4 модульні тести і всі етапи кейс-проєкту.
      - Немає невідпрацьованих практичних занять.
      - Пропуски аудиторних занять без поважних причин не перевищують 30% (не більше 14 з 48 годин).
      - Набрано щонайменше 20 балів поточного контролю — інакше навіть максимум за підсумковий тест (40 балів) не дає оцінки E (60 балів).
    currentScoreOption: >-
      Здобувач, який виконав усі види робіт, може залишити бали поточного контролю як підсумкову оцінку без складання
      диференційованого заліку. Максимум поточного контролю — 60 балів, тобто оцінка E («задовільно»).
    basis:
      - { regulation: assessment-regulation, clause: п. 4.7 }
      - { regulation: assessment-regulation, clause: п. 2.5 }
  bonus:
    maxPoints: 10
    activities:
      - title: Участь в олімпіаді або кейс-конкурсі з менеджменту, фінансів чи корпоративного права (призове місце — до максимуму)
        maxPoints: 10
      - title: Доповідь на студентській науковій конференції з тематики курсу
        maxPoints: 5
      - title: Сертифікат неформальної освіти з тематики курсу, не зарахований замість практичної роботи
        maxPoints: 3
    rule: Додаткові бали нараховуються за підтвердними документами за поточний семестр, разом не більше 10; підсумкова оцінка не може перевищувати 100 балів.
  scaleBasis: { regulation: educational-process-regulation, clause: п. 8.3.2 }

# Шкала за Положенням про організацію освітнього процесу (п. 8.3.2), колонка «Екзамен, диф. залік».
scale:
  - { min: 90, max: 100, ects: A, national: відмінно }
  - { min: 82, max: 89, ects: B, national: добре }
  - { min: 75, max: 81, ects: C, national: добре }
  - { min: 66, max: 74, ects: D, national: задовільно }
  - { min: 60, max: 65, ects: E, national: задовільно }
  - { min: 0, max: 59, ects: FX, national: незадовільно з можливістю повторного складання }

policies:
  attendance: >-
    Бали за відвідування не нараховуються. Пропуски понад 30% аудиторних занять без поважних причин (понад 14 з 48
    годин) є підставою для недопуску до підсумкового контролю. Пропущене практичне заняття потрібно відпрацювати —
    виконати роботу в Moodle до строку, погодженого з викладачем.
  deadlines: >-
    Строки практичних робіт і етапів кейс-проєкту встановлено календарним планом і в Moodle. Роботу, подану не пізніше
    7 днів після строку без поважної причини, оцінюють не вище 2 з 3 балів (етап кейс-проєкту — не вище 50% балів
    етапу); подану пізніше — зараховують лише для допуску, без балів. За поважної причини, підтвердженої документом,
    строк продовжують на два тижні.
  academicIntegrity: >-
    Роботи виконуються самостійно. Плагіат, фабрикація чи фальсифікація даних, списування під час тестів і
    передавання відповідей контрольних тестів іншим особам є порушенням академічної доброчесності: така робота
    оцінюється в 0 балів і виконується повторно в новому варіанті, а тест повторно не складається. Кейс-проєкт і есе
    перевіряються на текстові збіги. Посилання на норми права — лише на чинні редакції актів на zakon.rada.gov.ua.
  ai: >-
    Модель «Часткове використання з належним цитуванням». Інструменти штучного інтелекту дозволено для пошуку ідей,
    структурування плану, перекладу й мовної перевірки кейс-проєкту та есе з обов’язковим зазначенням інструмента, мети
    й використаних фрагментів. Заборонено використовувати ШІ під час модульних і підсумкового тестів і подавати
    згенерований текст, розрахунки чи аналіз як власні. Кожну норму права, отриману за допомогою ШІ, потрібно
    перевірити за чинною редакцією на zakon.rada.gov.ua.
  bonusPoints: >-
    Додаткові бали — до 10 за участь в олімпіадах і кейс-конкурсах, доповіді на студентських наукових конференціях і
    сертифікати неформальної освіти з тематики курсу; сума балів не перевищує 100.
  retakes: >-
    Модульні тести мають одну спробу; перескладання пропущеного без поважної причини тесту або перескладання для
    підвищення балів не дозволяється. Тест, пропущений з поважної причини, відпрацьовують протягом двох тижнів.
    Повторне складання підсумкового контролю при оцінці FX — у строки ліквідації академічної заборгованості за
    розкладом.
  aiModel:
    model: partial-with-citation
    title: Часткове використання з належним цитуванням
    rationale: >-
      Курс розвиває власне судження студента щодо правових і управлінських рішень (ПРН4, ПРН12), тому тести й
      аналітичні висновки мають бути самостійними. Водночас кейс-проєкт працює з великими обсягами відкритих звітів, і
      ШІ корисний для пошуку й мовної обробки. Повна заборона непридатна до перевірки в самостійній роботі; моделі
      «Вільний вибір» і «ШІ як обов’язковий інструмент» підсилюють ризик некритичного перенесення застарілих норм, як
      у старому курсі, де поєднувалися норми Законів № 514-VI і № 2465-IX. Часткове використання з цитуванням і
      обов’язковою перевіркою норм — збалансований варіант.
    rules:
      - Дозволено — пошук ідей і джерел, план роботи, переклад, мовна перевірка кейс-проєкту та есе.
      - Обов’язково — зазначити інструмент, мету використання й фрагменти роботи, створені з його допомогою.
      - Обов’язково — перевірити кожну норму права й кожну цифру за першоджерелом.
      - Заборонено — використовувати ШІ під час модульних і підсумкового тестів.
      - Заборонено — подавати згенерований текст, розрахунки чи висновки як власні.
    needsConfirmation: true
    note: >-
      Модель політики обирає викладач з чотирьох, запропонованих Положенням про робочі програми та силабуси. Зміст
      Політики університету щодо використання систем ШІ в дослідженні опрацьовано лише у вступній частині — звірити
      формулювання зі зразком положення.
    basis:
      - { regulation: syllabus-regulation, clause: пп. 2.13.11 }
      - { regulation: ai-policy, clause: вступна частина }
  nonFormalEducation:
    value: >-
      Результати неформальної освіти з тематики курсу (онлайн-курси, сертифікатні програми, тренінги з корпоративного
      управління, ESG, комплаєнсу чи фінансової звітності) можуть бути зараховані замість однієї або двох практичних
      робіт відповідних тем за поданням сертифіката й виконанням контрольного завдання, погодженого з викладачем;
      максимум — бали цих практичних робіт. Модульні й підсумковий тести не замінюються.
    needsConfirmation: true
    note: >-
      Положення університету про визнання результатів неформальної та інформальної освіти в дослідженні не опрацьоване —
      звірити порядок, перелік документів і межі зарахування.
  basis:
    - { regulation: assessment-regulation, clause: 'пп. 2.5, 3.3, 3.4, 3.6, 4.7' }
    - { regulation: syllabus-regulation, clause: пп. 2.13.11 }

