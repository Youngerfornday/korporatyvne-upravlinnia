      - Ринкові показники — ринкова капіталізація, TSR, Q Тобіна.
      - Вартісні показники — EVA, MVA, середньозважена вартість капіталу.
      - Фінансові показники і модель DuPont — ROE, ROA, покриття відсотків.
      - Оцінювання роботи ради — звіт наглядової ради, оцінювання наглядових рад державних підприємств.
      - Голосування акціонерів і винагорода за показниками як сигнали якості корпоративного управління.
