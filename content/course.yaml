# Подвійні лекції (4 год): t04, t07, t08, t10 — найбільші нормативні блоки з розрахунками.
# СРС теми: лонгрід і самоперевірка, тренувальний тест, аналітичні завдання, етапи кейс-проєкту.
topics:
  - id: t01
    module: m1
    slug: korporatsiia-i-korporatyvne-upravlinnia
    title: Корпорація і корпоративне управління
    summary: Відокремлення власності від контролю, агентська проблема, стейкхолдери, корпоративне управління і вартість.
    results:
      - statement: Пояснювати сутність корпорації і корпоративного управління через відокремлення власності від контролю.
        prn: [prn03]
      - statement: Розрізняти агентський конфлікт «менеджмент — акціонери» і конфлікт мажоритарних і міноритарних акціонерів та механізми зниження агентських витрат.
        prn: [prn03]
      - statement: Аналізувати на прикладі кейсу наслідки слабкого корпоративного управління для вартості компанії, кредиторів і вкладників.
        prn: [prn12]
      - statement: Порівнювати концепцію пріоритету акціонерів і стейкхолдерський підхід та формувати власну позицію з урахуванням етичних аспектів.
        prn: [prn15]
    lectureQuestions:
      - Корпорація як форма організації бізнесу — обмежена відповідальність, вільне відчуження часток, централізоване управління.
      - Відокремлення власності від контролю і виникнення агентської проблеми.
      - Агентська теорія — принципал і агент, інформаційна асиметрія, агентські витрати.
      - Конфлікти «менеджмент — акціонери» і «мажоритарні — міноритарні акціонери»; кінцевий бенефіціарний власник.
      - Стейкхолдери компанії — концепція пріоритету акціонерів і теорія стейкхолдерів.
      - Корпоративне управління як система відносин і механізмів у Принципах G20/ОЕСР 2023.
      - Корпоративне управління і вартість компанії — канали впливу і ціна слабкого управління.
    hours: { lectures: 2, selfStudy: 4 }
    selfStudyTasks:
      - task: Прочитати лонгрід теми 1 і пройти самоперевірку.
        hours: 2
      - task: 'За кейсом ПриватБанку скласти схему відносин між акціонерами, менеджментом, вкладниками і державою: для кожної пари визначити, чи є вона агентською, і якщо так — хто принципал, а хто агент.'
        hours: 1
      - task: Пройти тренувальний тест теми 1.
        hours: 1
    cases:
      - case: privatbank
        focus: Пов’язане кредитування й виведення коштів контролюючими акціонерами — агентська проблема між власниками, вкладниками, кредиторами і державою.
      - case: enron
        focus: Конфлікт інтересів фінансового директора, винятки з кодексу поведінки і позабалансові структури — агентська проблема між менеджментом і акціонерами.

  - id: t02
    module: m1
    slug: modeli-ku-ta-mizhnarodni-standarty
    title: Моделі корпоративного управління та міжнародні стандарти
    summary: Англо-американська, німецька, японська і сімейна моделі; Принципи G20/ОЕСР 2023; таймлайн КУ в Україні.
    results:
      - statement: Пояснювати ключові ознаки англо-американської, німецької, японської та сімейної моделей корпоративного управління.
        prn: [prn03]
      - statement: Порівнювати моделі за структурою власності, будовою ради й захистом міноритарних акціонерів і визначати модель за описом компанії.
        prn: [prn03]
      - statement: Пояснювати структуру Принципів корпоративного управління G20/ОЕСР 2023 і режим «дотримуйся або пояснюй».
        prn: [prn03]
      - statement: Аналізувати етапи розвитку корпоративного управління в Україні та їх зв’язок з міжнародними стандартами.
        prn: [prn03]
    lectureQuestions:
      - Класифікація систем корпоративного управління — інсайдерські й аутсайдерські системи.
      - Англо-американська модель — розпорошена власність, ринок корпоративного контролю, однорівнева рада з незалежними директорами.
      - Німецька модель — концентрована власність, дворівнева структура, співучасть працівників у наглядовій раді.
      - Японська модель — перехресне володіння (кейрецу), роль банків, перегляд Кодексу корпоративного управління Японії.
      - Сімейна модель і компанії з державою як домінуючим акціонером.
      - Принципи корпоративного управління G20/ОЕСР 2023 — шість розділів і новий розділ про сталий розвиток і стійкість.
      - Кодекси корпоративного управління і режим «дотримуйся або пояснюй» — Кодекс корпоративного управління Великої Британії 2024, Директива SRD II.
      - Етапи розвитку корпоративного управління в Україні — від Закону № 514-VI до Законів № 2465-IX і № 3587-IX.
    hours: { lectures: 2, selfStudy: 4 }
    selfStudyTasks:
      - task: Прочитати лонгрід теми 2 і пройти самоперевірку.
        hours: 1
      - task: Скласти порівняльну таблицю моделей корпоративного управління за п’ятьма ознаками (підготовка до практичної 1).
        hours: 2
      - task: Пройти тренувальний тест теми 2.
        hours: 1
    cases:
      - case: soe-board-reform
        focus: Закон № 3587-IX як етап наближення українського корпоративного управління до стандартів ОЕСР, розроблений за участі міжнародних партнерів.
      - case: volkswagen
        focus: Структура контролю (Porsche SE, земля Нижня Саксонія, Qatar Holding) і паритетна наглядова рада як риси німецької моделі.
      - case: toyota
        focus: Перегляд Кодексу корпоративного управління Японії 2021 р. — частка незалежних директорів, комітети, матриця навичок ради.

  - id: t03
    module: m1
    slug: pravove-pole-korporatyvnoho-biznesu
    title: Правове поле корпоративного бізнесу
    summary: ТОВ і ТДВ, ПАТ і ПрАТ за Законом № 2465-IX, наслідки скасування Господарського кодексу, статут і корпоративний договір.
    results:
      - statement: Розрізняти публічні й приватні акціонерні товариства, ТОВ і ТДВ за чинними Законами № 2465-IX і № 2275-VIII.
        prn: [prn12]
      - statement: Пояснювати правові наслідки втрати чинності Господарським кодексом і перехідного періоду за Законом № 4196-IX.
        prn: [prn12]
      - statement: Аналізувати динаміку кількості АТ і ТОВ за даними Держстату з урахуванням обмежень статистики.
        prn: [prn06]
      - statement: Обґрунтовувати вибір організаційно-правової форми й ключові умови статуту та корпоративного договору для нового бізнесу.
        prn: [prn04]
    lectureQuestions:
      - Господарські товариства після втрати чинності Господарським кодексом — Закон № 4196-IX, перехідний період, заборона нових «підприємств».
      - Акціонерне товариство за Законом № 2465-IX — публічні й приватні АТ, АТ з одним акціонером, мінімальний статутний капітал.
      - ТОВ і ТДВ за Законом № 2275-VIII — статутний капітал, відповідальність учасників, органи управління.
      - Права учасників ТОВ — переважне право купівлі частки, вихід з товариства, дивіденди.
      - Статут як установчий документ і межі його диспозитивності.
      - Корпоративний договір в АТ і ТОВ — форма, зміст, нікчемні умови, розкриття.
      - Вибір організаційно-правової форми бізнесу — критерії і статистика АТ і ТОВ в Україні.
    hours: { lectures: 2, selfStudy: 5 }
    selfStudyTasks:
