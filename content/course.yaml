annotation: >-
  Дисципліна формує в майбутніх менеджерів розуміння того, як влаштовано управління корпораціями: як розподіляються
  права й відповідальність між акціонерами, наглядовою радою і виконавчим менеджментом, як узгоджуються інтереси
  власників, кредиторів, працівників і суспільства та як якість корпоративного управління впливає на вартість
  компанії. Курс спирається на чинне законодавство України (закони про акціонерні товариства, про ТОВ і ТДВ, про
  ринки капіталу, про аудит, про запобігання корупції, про управління об’єктами державної власності) і Принципи
  корпоративного управління G20/ОЕСР 2023 р. Студенти розв’язують розрахункові задачі (кворум, кумулятивне
  голосування, дивіденди, доходність, модель DuPont), аналізують реальні українські й міжнародні кейси та відкриті
  дані емітентів і виконують кейс-проєкт «Аудит корпоративного управління компанії».
goal: >-
  Сформувати здатність аналізувати систему корпоративного управління організації, виявляти в ній проблеми
  й обґрунтовувати управлінські рішення з урахуванням чинних норм права, міжнародних стандартів, інтересів
  стейкхолдерів і етичних аспектів.
objectives:
  - Пояснити природу агентських конфліктів і роль корпоративного управління у створенні вартості компанії.
  - Ознайомити з моделями корпоративного управління, Принципами G20/ОЕСР 2023 і етапами розвитку корпоративного управління в Україні.
  - Навчити застосовувати норми законів про акціонерні товариства і ТОВ до рішень загальних зборів, наглядової ради й виконавчого органу.
  - Сформувати навички розрахунків для корпоративних рішень — кворум, кумулятивне голосування, дивіденди, доходність цінних паперів, показники ефективності.
  - Навчити знаходити й інтерпретувати розкриту інформацію емітентів та оцінювати системи внутрішнього контролю, управління ризиками й комплаєнсу.
  - Розвинути здатність формувати судження щодо соціальної відповідальності й етики компаній, зокрема державних.

integralCompetence:
  statement: >-
    Здатність розв’язувати складні спеціалізовані задачі та практичні проблеми, які характеризуються комплексністю
    і невизначеністю умов, у сфері менеджменту або у процесі навчання, що передбачає застосування теорій та методів
    соціальних та поведінкових наук.
  ref: { doc: education-standard, section: '2.2' }

